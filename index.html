
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NeedForSpeed | City Drive</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c;font-family:Arial,Helvetica,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.panel{background:rgba(10,17,25,.78);border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:12px 16px;backdrop-filter:blur(9px);box-shadow:0 5px 25px #0003}
#brand{position:absolute;top:15px;left:15px;font-size:20px;font-weight:900;letter-spacing:2px}
#brand small{display:block;color:#52c8ff;font-size:10px;letter-spacing:4px;margin-top:4px}
#speedBox{position:absolute;right:15px;top:15px;text-align:right;min-width:130px}
#speed{font-size:38px;font-weight:900;line-height:1}
#unit{font-size:11px;color:#aab9c8;letter-spacing:2px}
#gear{color:#54d7ff;font-weight:bold;font-size:13px;margin-top:5px}
#status{position:absolute;top:105px;left:15px;font-size:12px;color:#dbe6ee}
#help{position:absolute;left:15px;bottom:18px;font-size:12px;line-height:1.8;color:#dce7f0}
#help b{color:#fff}
#minimap{position:absolute;right:15px;top:115px;width:145px;height:145px;border-radius:12px;border:1px solid #ffffff45;background:#09111dcc}
#message{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;width:min(90%,500px);display:none;pointer-events:auto;background:rgba(8,13,20,.94);padding:30px;border:1px solid #ffffff35;border-radius:20px;box-shadow:0 15px 70px #0009}
#message h1{font-size:clamp(30px,7vw,52px);margin:0 0 10px;letter-spacing:2px}
#message p{color:#c5d3df;line-height:1.6}
button{background:#14a9ed;border:0;color:white;font-weight:bold;font-size:15px;border-radius:10px;padding:13px 24px;cursor:pointer}
button:active{transform:scale(.97)}
#controls{position:fixed;bottom:20px;right:18px;display:flex;gap:12px;pointer-events:auto;z-index:8}
.ctrl{width:66px;height:66px;border-radius:50%;background:#0b1725bb;border:2px solid #ffffff80;color:white;font-size:25px;touch-action:none;user-select:none}
#pedals{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto;z-index:8}
.pedal{min-width:72px;height:54px;font-size:12px;background:#0b1725cc;border:1px solid #ffffff80;padding:8px;touch-action:none}
#nitro{color:#68e4ff}
#hint{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff9;font-size:11px;text-shadow:0 2px 4px black}
@media(min-width:850px){#controls,#pedals{opacity:.48}#controls:hover,#pedals:hover{opacity:1}}
@media(max-width:500px){#brand{font-size:15px}#brand small{font-size:8px}#speed{font-size:30px}#minimap{width:105px;height:105px;top:105px}#status{top:90px;font-size:10px}#help{font-size:10px;bottom:100px}#controls{bottom:17px;right:12px;gap:7px}.ctrl{width:54px;height:54px;font-size:21px}#pedals{left:14px;bottom:17px;transform:none;gap:6px}.pedal{min-width:56px;height:48px;font-size:10px}#hint{display:none}}
</style>
</head>
<body>
<div id="hud">
  <div id="brand" class="panel">NEED FOR SPEED<small>OPEN CITY // STREET DRIVE</small></div>
  <div id="speedBox" class="panel">
    <div id="speed">000</div><div id="unit">KM/H</div><div id="gear">GEAR D</div>
  </div>
  <div id="status" class="panel">CITY DISTRICT 01<br>TRAFFIC: ACTIVE</div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="help" class="panel">
    <b>DRIVING CONTROLS</b><br>
    W / ↑ Accelerate<br>
    S / ↓ Brake / Reverse<br>
    A D / ← → Steer<br>
    SPACE Handbrake
  </div>
  <div id="hint">EXPLORE THE CITY · AVOID TRAFFIC</div>
  <div id="message">
    <h1 id="gameOverTitle">CRASHED!</h1>
    <p id="gameOverText">Your drive has ended.</p>
    <button id="restart">DRIVE AGAIN ↻</button>
  </div>
</div>
<div id="pedals">
  <button class="pedal" id="brake">BRAKE</button>
  <button class="pedal" id="gas">ACCELERATE</button>
  <button class="pedal" id="nitro">NITRO ⚡</button>
</div>
<div id="controls">
  <button class="ctrl" id="left">←</button>
  <button class="ctrl" id="right">→</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x92b9d5);
scene.fog = new THREE.Fog(0x92b9d5, 180, 1050);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1800);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9edff,0x59604e,2.0));
const sun = new THREE.DirectionalLight(0xffe9cc,2.6);
sun.position.set(-180,260,100);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-180; sun.shadow.camera.right=180;
sun.shadow.camera.top=180; sun.shadow.camera.bottom=-180;
sun.shadow.bias=-0.00025;
scene.add(sun);

const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const asphalt=mat(0x343b42), sidewalk=mat(0x9b9d9a), grass=mat(0x596d4d);
const concrete=mat(0xb6b6ae), darkGlass=mat(0x152633,.24,.45);
const whiteLine=mat(0xe2dfcf), yellowLine=mat(0xf4d05e);
const buildingMats=[0x9299a1,0xc2b8a8,0x858f98,0xb0aaa0,0x777f88,0xd0c8ba,0x686f79].map(c=>mat(c,.9));
const windowMat=new THREE.MeshStandardMaterial({color:0x91bfd0,roughness:.26,metalness:.25});
const litWindow=new THREE.MeshStandardMaterial({color:0xf3d9a0,emissive:0x70522a,emissiveIntensity:.35});
const poleMat=mat(0x3a4146,.5,.7);
const roadSize=120, roadWidth=24, cityLimit=720;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),grass);
ground.rotation.x=-Math.PI/2;ground.position.y=-.16;ground.receiveShadow=true;scene.add(ground);

function cube(parent,w,h,d,material,x,y,z,cast=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;parent.add(o);return o;
}
function cylinder(parent,r1,r2,h,material,x,y,z,segments=8){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}

// Huge connected road network.
const roadGeo=new THREE.PlaneGeometry(roadWidth, cityLimit*2+roadSize);
for(let i=-6;i<=6;i++){
 const p=i*roadSize;
 const rx=new THREE.Mesh(roadGeo,asphalt);
 rx.rotation.x=-Math.PI/2;rx.position.set(p,-.08,0);scene.add(rx);
 const rz=new THREE.Mesh(roadGeo,asphalt);
 rz.rotation.x=-Math.PI/2;rz.rotation.z=Math.PI/2;rz.position.set(0,-.075,p);scene.add(rz);
 // Broken centre lines.
 for(let q=-cityLimit;q<=cityLimit;q+=18){
  cube(scene,.22,.035,7,whiteLine,p,.005,q,false);
  cube(scene,7,.035,.22,whiteLine,q,.006,p,false);
 }
 // Lane dividers on either side of centre.
 for(let q=-cityLimit;q<=cityLimit;q+=24){
  cube(scene,.15,.03,4,whiteLine,p-5.6,.002,q,false);
  cube(scene,.15,.03,4,whiteLine,p+5.6,.002,q,false);
  cube(scene,4,.03,.15,whiteLine,q,.002,p-5.6,false);
  cube(scene,4,.03,.15,whiteLine,q,.002,p+5.6,false);
 }
}

// City blocks: sidewalks, storefronts, towers, courtyards, parks.
let seed=83174;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let ix=-6;ix<6;ix++){
 for(let iz=-6;iz<6;iz++){
  const cx=(ix+.5)*roadSize, cz=(iz+.5)*roadSize;
  const park=rand()<.12;
  cube(scene,94,.24,94,sidewalk,cx,-.015,cz,false);
  if(park){
   cube(scene,80,.08,80,grass,cx,.12,cz,false);
   for(let j=0;j<12;j++){
    const x=cx+(rand()-.5)*68,z=cz+(rand()-.5)*68;
    cylinder(scene,.25,.45,3.5,mat(0x71523a),x,1.7,z,7);
    const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2+rand()*1.6,1),mat([0x31583b,0x466a40,0x637849][Math.floor(rand()*3)]));
    crown.position.set(x,4.4,z);crown.castShadow=true;scene.add(crown);
   }
   continue;
  }
  const count=3+Math.floor(rand()*5);
  for(let j=0;j<count;j++){
   const x=cx+(rand()-.5)*69,z=cz+(rand()-.5)*69;
   const w=8+rand()*15,d=8+rand()*15;
   const h=8+Math.pow(rand(),1.7)*100;
   const building=new THREE.Group();building.position.set(x,0,z);scene.add(building);
   const bm=buildingMats[Math.floor(rand()*buildingMats.length)];
   cube(building,w,h,d,bm,0,h/2+.18,0);
   // Rooftop structure and details.
   if(rand()>.35) cube(building,w*.45,1.8,d*.4,concrete,0,h+1.1,0);
   if(h>35 && rand()>.45) cylinder(building,.35,.2,6,poleMat,0,h+4,0,6);
   // Repeating window rows on front and sides.
   const floors=Math.min(24,Math.floor(h/3.5));
   const cols=Math.max(2,Math.floor(w/2.5));
   for(let f=0;f<floors;f++){
    for(let c=0;c<cols;c++){
     const wx=-w/2+(c+.5)*w/cols;
     const wy=2.3+f*3.4;
     const wm=rand()>.18?windowMat:litWindow;
     cube(building,w/cols*.52,.95,.08,wm,wx,wy,d/2+.045,false);
     if(c%2===0) cube(building,.055,1.15,.11,poleMat,wx,wy,d/2+.10,false);
    }
    for(let c=0;c<Math.max(2,Math.floor(d/2.5));c++){
     const wz=-d/2+(c+.5)*d/Math.max(2,Math.floor(d/2.5));
     cube(building,.08,.95,d/Math.max(2,Math.floor(d/2.5))*.52,rand()>.18?windowMat:litWindow,w/2+.045,2.3+f*3.4,wz,false);
    }
   }
   // Shopfronts at street level.
   if(h<25){
    cube(building,w*.75,2.2,.12,windowMat,0,1.7,d/2+.12,false);
    cube(building,w*.85,.45,.18,mat([0x227baf,0xc34f37,0x3b855e,0xe3bd4f][Math.floor(rand()*4)]),0,3.2,d/2+.15,false);
   }
  }
  // Trees around the block edge.
  for(let j=0;j<4;j++){
   const side=j%2===0?-1:1;
   const tx=cx+side*(37+rand()*5),tz=cz+(rand()-.5)*66;
   cylinder(scene,.2,.32,2.4,mat(0x604c38),tx,1.2,tz,7);
   const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,1),mat(0x3e6843));
   crown.position.set(tx,3.1,tz);crown.castShadow=true;scene.add(crown);
  }
 }
}

// Streetlights along the main avenues.
for(let axis=0;axis<2;axis++){
 for(let road=-6;road<=6;road++){
  for(let q=-cityLimit;q<=cityLimit;q+=60){
   for(const side of [-1,1]){
    const x=axis===0?road*roadSize+side*14:q;
    const z=axis===0?q:road*roadSize+side*14;
    cylinder(scene,.12,.17,5.8,poleMat,x,2.9,z);
    cube(scene,.8,.12,.18,poleMat,x+(axis===0?side*.28:0),5.7,z+(axis===1?side*.28:0),false);
    const bulb=new THREE.Mesh(new THREE.BoxGeometry(.5,.15,.5),mat(0xffe6a3,.3));
    bulb.position.set(x,5.62,z);scene.add(bulb);
   }
  }
 }
}

// Detailed BMW-inspired sporty luxury sedan.
function makeCar(color=0x151a20,traffic=false){
 const root=new THREE.Group();
 const bodyMat=mat(color,.26,.72);
 const trim=mat(0x10151b,.3,.6);
 const chrome=mat(0xb8c6ce,.2,.85);
 const rubber=mat(0x17191d,.92);
 const rim=mat(0x9ba5ad,.25,.85);
 const red=mat(0xf51c2e,.25,.25);
 const headlamp=new THREE.MeshStandardMaterial({color:0xe9f5ff,emissive:0x9fcfff,emissiveIntensity:2});
 const glass=new THREE.MeshPhysicalMaterial({color:0x172c3c,metalness:.35,roughness:.13,transparent:true,opacity:.94});
 // Main lower body, front is negative Z.
 cube(root,2.12,.52,4.55,bodyMat,0,.77,0);
 cube(root,2.0,.32,3.4,bodyMat,0,1.02,-.05);
 // Hood and trunk.
 const hood=cube(root,1.95,.15,1.45,bodyMat,0,1.04,-1.38);
 const trunk=cube(root,1.9,.17,.82,bodyMat,0,1.02,1.66);
 // Sculpted cabin.
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.56,.7,2.05),bodyMat);
 cabin.position.set(0,1.34,.05);cabin.castShadow=true;root.add(cabin);
 // Sloping windscreen and rear window.
 const windshield=cube(root,1.48,.48,.07,glass,0,1.58,-.65);
 windshield.rotation.x=-.35;
 const rearGlass=cube(root,1.43,.42,.07,glass,0,1.58,.83);
 rearGlass.rotation.x=.35;
 // Side windows.
 for(const side of [-1,1]){
  cube(root,.045,.43,1.36,glass,side*.79,1.55,.04);
  // Door handles and mirror housings.
  cube(root,.055,.06,.24,chrome,side*1.07,1.05,.25);
  cube(root,.22,.13,.24,bodyMat,side*1.08,1.43,-.62);
  // Wheel arches, four performance wheels.
  for(const z of [-1.43,1.42]){
   const wheel=new THREE.Group();
   wheel.position.set(side*1.03,.48,z);
   root.add(wheel);
   const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,24),rubber);
   tire.rotation.z=Math.PI/2;tire.castShadow=true;wheel.add(tire);
   const rimMesh=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.265,12),rim);
   rimMesh.rotation.z=Math.PI/2;wheel.add(rimMesh);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.28,12),chrome);
   hub.rotation.z=Math.PI/2;wheel.add(hub);
   for(let s=0;s<10;s++){
    const a=s*Math.PI/5;
    const spoke=cube(wheel,.045,.39,.055,chrome,0,Math.sin(a)*.17,Math.cos(a)*.17,false);
    spoke.rotation.x=a;
   }
   if(!traffic)wheel.userData.steerable=z<0;
   wheel.userData.front=z<0;
   root.userData.wheels=root.userData.wheels||[];
   root.userData.wheels.push(wheel);
  }
 }
 // Wide twin-kidney grille and sporty lower intake.
 cube(root,.72,.39,.065,trim,0,.79,-2.285);
 for(let i=0;i<7;i++)cube(root,.025,.32,.075,chrome,-.29+i*.097,.79,-2.33,false);
 cube(root,.8,.12,.08,trim,0,.49,-2.28);
 for(const side of [-1,1]){
  cube(root,.44,.19,.06,headlamp,side*.69,.99,-2.30);
  cube(root,.42,.18,.07,red,side*.68,.88,2.29);
  cube(root,.28,.09,.06,trim,side*.68,.55,-2.29);
  // Exhaust tips.
  cylinder(root,.085,.085,.18,chrome,side*.66,.45,2.3,12).rotation.x=Math.PI/2;
 }
 // Front bumper lip, side skirts and subtle rear spoiler.
 cube(root,1.95,.09,.28,trim,0,.48,-2.19);
 cube(root,1.65,.09,.15,bodyMat,0,1.25,2.03);
 cube(root,.12,.11,3.25,trim,-1.04,.55,0);
 cube(root,.12,.11,3.25,trim,1.04,.55,0);
 // Blue-white headlight beams.
 const leftBeam=new THREE.SpotLight(0xd8eaff,traffic?0:18,65,Math.PI/7,.55,1.4);
 const rightBeam=leftBeam.clone();
 leftBeam.position.set(-.65,.95,-2.15);rightBeam.position.set(.65,.95,-2.15);
 leftBeam.target.position.set(-.8,.1,-22);rightBeam.target.position.set(.8,.1,-22);
 root.add(leftBeam,leftBeam.target,rightBeam,rightBeam.target);
 root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return root;
}
const player=makeCar(0x172d48,false);
player.position.set(0,0,0);scene.add(player);
const traffic=[];
const trafficColors=[0xb9252b,0xe4e6e8,0x181c20,0x8b9ca4,0xc7a45b,0x284c3a,0x5a4c80,0x777777];

// Place traffic on distant road lanes. Each car follows a straight road.
function spawnTraffic(i){
 const car=makeCar(trafficColors[i%trafficColors.length],true);
 const vertical=rand()>.5;
 const lane=rand()>.5?5.1:-5.1;
 const roadIndex=Math.floor(rand()*11)-5;
 const p=(rand()-.5)*cityLimit*1.8;
 const dir=rand()>.5?1:-1;
 if(vertical){
  car.position.set(roadIndex*roadSize+lane,0,p);
  car.rotation.y=dir>0?Math.PI:0;
 }else{
  car.position.set(p,0,roadIndex*roadSize+lane);
  car.rotation.y=dir>0?Math.PI/2:-Math.PI/2;
 }
 scene.add(car);
 traffic.push({car,vertical,lane,dir,speed:9+rand()*12,roadIndex});
}
for(let i=0;i<24;i++)spawnTraffic(i);

const keys={};
let steerTouch=0,gasTouch=false,brakeTouch=false,nitroTouch=false;
let speed=0,heading=0,gameOver=false,distance=0;
const clock=new THREE.Clock();
let lastCrash='';
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key.toLowerCase()==='r' && gameOver)resetGame();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

function holdButton(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});
 el.addEventListener('pointerup',e=>{e.preventDefault();up()});
 el.addEventListener('pointercancel',up);
 el.addEventListener('lostpointercapture',up);
}
holdButton('left',()=>steerTouch=-1,()=>{if(steerTouch===-1)steerTouch=0});
holdButton('right',()=>steerTouch=1,()=>{if(steerTouch===1)steerTouch=0});
holdButton('gas',()=>gasTouch=true,()=>gasTouch=false);
holdButton('brake',()=>brakeTouch=true,()=>brakeTouch=false);
holdButton('nitro',()=>nitroTouch=true,()=>nitroTouch=false);

document.getElementById('restart').onclick=resetGame;

function endGame(reason){
 if(gameOver)return;
 gameOver=true;speed=0;lastCrash=reason;
 document.getElementById('gameOverTitle').textContent='CRASHED!';
 document.getElementById('gameOverText').innerHTML=
  reason+'<br>Distance driven: '+(distance/1000).toFixed(2)+' km<br>Press R or tap below to drive again.';
 document.getElementById('message').style.display='block';
}
function resetGame(){
 speed=0;heading=0;distance=0;gameOver=false;lastCrash='';
 player.position.set(0,0,0);player.rotation.set(0,0,0);
 traffic.forEach((t,i)=>{
  const vertical=i%2===0;
  t.vertical=vertical;t.dir=i%4<2?1:-1;
  t.roadIndex=(i%11)-5;t.lane=i%2===0?5.1:-5.1;
  if(vertical){
   t.car.position.set(t.roadIndex*roadSize+t.lane,-0,100+(i*39)%500);
   t.car.rotation.y=t.dir>0?Math.PI:0;
  }else{
   t.car.position.set(100+(i*43)%500,0,t.roadIndex*roadSize+t.lane);
   t.car.rotation.y=t.dir>0?Math.PI/2:-Math.PI/2;
  }
 });
 document.getElementById('message').style.display='none';
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}

const speedEl=document.getElementById('speed');
const gearEl=document.getElementById('gear');
const statusEl=document.getElementById('status');
const mapCanvas=document.getElementById('minimap');
const mapCtx=mapCanvas.getContext('2d');

function drawMap(){
 const w=mapCanvas.width,h=mapCanvas.height;
 mapCtx.clearRect(0,0,w,h);mapCtx.fillStyle='#17251d';mapCtx.fillRect(0,0,w,h);
 const scale=w/(cityLimit*2);
 mapCtx.strokeStyle='#65717a';mapCtx.lineWidth=roadWidth*scale;
 for(let i=-6;i<=6;i++){
  let p=w/2+i*roadSize*scale;
  mapCtx.beginPath();mapCtx.moveTo(p,0);mapCtx.lineTo(p,h);mapCtx.stroke();
  mapCtx.beginPath();mapCtx.moveTo(0,p);mapCtx.lineTo(w,p);mapCtx.stroke();
 }
 mapCtx.fillStyle='#e8e8df';
 for(const t of traffic){
  let x=w/2+t.car.position.x*scale,y=h/2+t.car.position.z*scale;
  if(x>=0&&x<=w&&y>=0&&y<=h){mapCtx.beginPath();mapCtx.arc(x,y,2.2,0,Math.PI*2);mapCtx.fill()}
 }
 const px=w/2+player.position.x*scale,pz=h/2+player.position.z*scale;
 mapCtx.save();mapCtx.translate(px,pz);mapCtx.rotate(-heading);
 mapCtx.fillStyle='#4ad9ff';mapCtx.beginPath();mapCtx.moveTo(0,-7);mapCtx.lineTo(5,5);mapCtx.lineTo(-5,5);mapCtx.closePath();mapCtx.fill();mapCtx.restore();
}

function update(dt){
 if(gameOver)return;
 dt=Math.min(dt,.04);
 const forward=keys['w']||keys['arrowup']||gasTouch;
 const reverse=keys['s']||keys['arrowdown']||brakeTouch;
 const braking=keys[' ']||keys['space'];
 const steer=(keys['a']||keys['arrowleft']?-1:0)+(keys['d']||keys['arrowright']?1:0)+steerTouch;
 const nitro=nitroTouch&&speed>4;

 // Smooth automatic acceleration with manual throttle, brake and reverse.
 const target=nitro?49:forward?39:27;
 if(forward||(!reverse&&!braking))speed=lerp(speed,target,dt*(nitro?1.1:.38));
 if(reverse){
  if(speed>1)speed=Math.max(0,speed-48*dt);
  else speed=Math.max(-10,speed-14*dt);
 }
 if(braking)speed=lerp(speed,0,dt*4.5);
 if(!forward&&!reverse&&!braking)speed=lerp(speed,27,dt*.24);
 if(nitro)speed=Math.min(speed,49);
 speed=clamp(speed,-10,49);

 // Speed-sensitive steering and real heading-based movement.
 const speedFactor=clamp(Math.abs(speed)/12,0,1);
 const turnRate=(.25+speedFactor*.82)*(braking?.68:1);
 heading+=steer*turnRate*dt*Math.sign(speed||1);
 player.rotation.y=heading;
 player.position.x+=Math.sin(heading)*speed*dt;
 player.position.z-=Math.cos(heading)*speed*dt;
 distance+=Math.abs(speed*dt);

 // Keep the world finite and prevent driving through city blocks.
 if(Math.abs(player.position.x)>cityLimit-4||Math.abs(player.position.z)>cityLimit-4){
  endGame('You left the city limits!');return;
 }
 // A small curb/grass penalty discourages cutting through buildings.
 const roadX=Math.round(player.position.x/roadSize)*roadSize;
 const roadZ=Math.round(player.position.z/roadSize)*roadSize;
 const onRoadX=Math.abs(player.position.x-roadX)<roadWidth/2-1.5;
 const onRoadZ=Math.abs(player.position.z-roadZ)<roadWidth/2-1.5;
 if(!onRoadX&&!onRoadZ){
  speed=lerp(speed,0,dt*.9);
 }
 // Roll slightly with steering; animate front wheels.
 player.rotation.z=lerp(player.rotation.z,-steer*.035*speedFactor,dt*4);
 for(const wheel of player.userData.wheels||[]){
  if(wheel.userData.steerable)wheel.rotation.y=steer*.28;
  wheel.children[0].rotation.x-=speed*dt*1.7;
  wheel.children[1].rotation.x-=speed*dt*1.7;
 }
 // Traffic moves along the road grid.
 for(const t of traffic){
  const c=t.car;
  const step=t.dir*t.speed*dt;
  if(t.vertical)c.position.z+=step;
  else c.position.x+=step;
  if(c.position.x>cityLimit)c.position.x=-cityLimit;
  if(c.position.x< -cityLimit)c.position.x=cityLimit;
  if(c.position.z>cityLimit)c.position.z=-cityLimit;
  if(c.position.z< -cityLimit)c.position.z=cityLimit;
  // Collision detection.
  const dx=c.position.x-player.position.x,dz=c.position.z-player.position.z;
  if(dx*dx+dz*dz<4.0*4.0){endGame('You crashed into another car!');return}
 }
 // Follow camera stays behind the car's actual heading.
 const behind=13,up=6.1;
 const desired=new THREE.Vector3(
  player.position.x+Math.sin(heading)*behind,
  up,
  player.position.z+Math.cos(heading)*behind
 );
 camera.position.lerp(desired,1-Math.exp(-4*dt));
 const look=new THREE.Vector3(
  player.position.x-Math.sin(heading)*5,
  1.1,
  player.position.z+Math.cos(heading)*5
 );
 camera.lookAt(look);
 camera.fov=lerp(camera.fov,65+Math.min(Math.abs(speed)*.18,8),dt*2);
 camera.updateProjectionMatrix();

 speedEl.textContent=String(Math.round(Math.abs(speed)*3.6)).padStart(3,'0');
 gearEl.textContent=speed<-.5?'GEAR R':speed<1?'GEAR N':nitro?'GEAR D ⚡':'GEAR D';
 const districtX=Math.floor((player.position.x+cityLimit)/roadSize)+1;
 const districtZ=Math.floor((player.position.z+cityLimit)/roadSize)+1;
 statusEl.innerHTML='DISTRICT '+String(clamp(districtX,1,12)).padStart(2,'0')+'-'+String(clamp(districtZ,1,12)).padStart(2,'0')+'<br>TRAFFIC: ACTIVE';
 drawMap();
}

camera.position.set(0,7,14);camera.lookAt(0,0,0);
let mapTimer=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();
 update(dt);
 mapTimer+=dt;
 if(mapTimer>.12){if(!gameOver)drawMap();mapTimer=0}
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});
</script>
