
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW M5 Driving Game</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: Arial, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 15px; left: 15px; z-index: 5;
    color: white; background: #0009; padding: 12px 16px;
    border-radius: 10px; line-height: 1.6; font-weight: bold;
    text-shadow: 1px 1px 3px #000; pointer-events: none;
  }
  #help {
    position: fixed; top: 15px; right: 15px; z-index: 5;
    color: white; background: #0009; padding: 10px 14px;
    border-radius: 10px; font-size: 13px; line-height: 1.7;
    text-align: right; pointer-events: none;
  }
  #cameraLabel {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 5; color: white; background: #0009; padding: 8px 14px;
    border-radius: 20px; font-weight: bold; pointer-events: none;
  }
  #error {
    display: none; position: fixed; z-index: 20; inset: 15px;
    background: #200; color: white; padding: 20px; white-space: pre-wrap;
  }
  #mobile {
    position: fixed; bottom: 20px; left: 0; right: 0; z-index: 8;
    display: flex; justify-content: space-between; padding: 0 18px;
    pointer-events: none;
  }
  .group { display: flex; gap: 10px; align-items: end; }
  .control {
    pointer-events: auto; width: 65px; height: 65px; border: 2px solid #ffffffbb;
    border-radius: 16px; background: #111b; color: white;
    font-size: 24px; font-weight: bold; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .control:active { background: #666d; }
  .pedal { width: 62px; height: 76px; font-size: 13px; }
  @media (hover: hover) and (pointer: fine) { #mobile { display: none; } }
</style>
</head>
<body>
<div id="hud">
  <div>BMW M5 COMPETITION</div>
  <div>Speed: <span id="speed">0</span> km/h</div>
  <div>Distance: <span id="distance">0</span> m</div>
</div>
<div id="help">
  W / ↑ : Accelerate<br>
  S / ↓ : Brake<br>
  A / ← : Turn left<br>
  D / → : Turn right<br>
  <b>C : Change camera</b><br>
  R : Reset
</div>
<div id="cameraLabel">DRIVER CAMERA · Press C</div>
<div id="error"></div>

<div id="mobile">
  <div class="group">
    <button class="control" data-key="left">◀</button>
    <button class="control" data-key="right">▶</button>
  </div>
  <div class="group">
    <button class="control pedal" data-key="brake">BRAKE</button>
    <button class="control pedal" data-key="gas">GAS</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const errorBox = document.getElementById("error");
  if (!window.THREE) {
    errorBox.style.display = "block";
    errorBox.textContent = "The 3D game could not load. Check your internet connection and refresh the page.";
    return;
  }

  try {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x91d3f3);
    scene.fog = new THREE.Fog(0x91d3f3, 100, 650);

    const camera = new THREE.PerspectiveCamera(
      72, innerWidth / innerHeight, 0.1, 1200
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdaf0ff, 0x64734b, 2.0));
    const sunlight = new THREE.DirectionalLight(0xffffff, 2.2);
    sunlight.position.set(-35, 70, 20);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(2048, 2048);
    sunlight.shadow.camera.left = -70;
    sunlight.shadow.camera.right = 70;
    sunlight.shadow.camera.top = 100;
    sunlight.shadow.camera.bottom = -100;
    scene.add(sunlight);

    const mat = (color, roughness = 0.8, metalness = 0) =>
      new THREE.MeshStandardMaterial({ color, roughness, metalness });

    const grassMat = mat(0x578447);
    const roadMat = mat(0x30343a, 0.95);
    const lineMat = mat(0xf5f1d7);
    const blackMat = mat(0x101216, 0.45);
    const rubberMat = mat(0x171719);
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0x183547, roughness: 0.2, metalness: 0.3,
      transparent: true, opacity: 0.83
    });
    const silverMat = mat(0xb8c3ca, 0.3, 0.8);
    const redLightMat = new THREE.MeshStandardMaterial({
      color: 0xff1010, emissive: 0x9d0000, emissiveIntensity: 1.5
    });
    const headlightMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xddeeff, emissiveIntensity: 1.2
    });

    function box(parent, w, h, d, material, x, y, z, cast = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d), material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(parent, radiusTop, radiusBottom, height, material,
                      x, y, z, rx = 0, ry = 0, rz = 0, segments = 12) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Fixed world: scenery and road are never translated or rotated by steering.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1800, 1800), grassMat
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, -0.12, -350);
    ground.receiveShadow = true;
    scene.add(ground);

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(15, 1600), roadMat
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, -0.035, -350);
    road.receiveShadow = true;
    scene.add(road);

    // Road edges and dashed lane markers are stationary world objects.
    for (const x of [-7.15, 7.15]) {
      const edge = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.035, 1600), lineMat
      );
      edge.position.set(x, 0.005, -350);
      scene.add(edge);
    }

    for (const x of [-2.5, 2.5]) {
      for (let z = 25; z > -1150; z -= 12) {
        const dash = new THREE.Mesh(
          new THREE.BoxGeometry(0.11, 0.035, 5.2), lineMat
        );
        dash.position.set(x, 0.008, z);
        scene.add(dash);
      }
    }

    // Guard rails remain fixed alongside the road.
    for (const side of [-1, 1]) {
      const rail = box(scene, 0.18, 0.36, 1500, silverMat,
        side * 8.1, 0.55, -350, false);
      const postMat = mat(0x89939a);
      for (let z = 35; z > -1080; z -= 18) {
        box(scene, 0.12, 0.65, 0.12, postMat,
          side * 8.1, 0.34, z, false);
      }
    }

    // Trees and rocks are fixed to the landscape.
    let seed = 24681357;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    const trunkMat = mat(0x62452e);
    const leafMats = [mat(0x2f6d36), mat(0x3b7d3d), mat(0x4d8a42)];
    const rockMat = mat(0x777d7d);

    for (let z = 45; z > -1120; z -= 10) {
      for (const side of [-1, 1]) {
        const x = side * (12 + random() * 27);
        if (random() < 0.8) {
          const h = 2.5 + random() * 3.8;
          cylinder(scene, 0.22, 0.36, h * 0.55, trunkMat,
            x, h * 0.275, z, 0, 0, 0, 7);
          const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.0 + random() * 1.1, h, 7),
            leafMats[Math.floor(random() * leafMats.length)]
          );
          leaves.position.set(x, h * 0.55 + 0.7, z);
          leaves.castShadow = true;
          scene.add(leaves);
        } else {
          const rock = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.5 + random(), 0),
            rockMat
          );
          rock.position.set(x, 0.45, z);
          rock.scale.y = 0.65;
          scene.add(rock);
        }
      }
    }

    // BMW M5-inspired sports sedan. Front of every car points toward -Z.
    function makeCar(color, isPlayer = false) {
      const car = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({
        color, metalness: 0.72, roughness: 0.25
      });
      const darkPaint = mat(0x15191e, 0.35, 0.6);

      box(car, 2.04, 0.48, 4.55, paint, 0, 0.72, 0);
      box(car, 1.93, 0.22, 1.25, paint, 0, 0.91, -1.62);
      box(car, 1.9, 0.2, 1.0, paint, 0, 0.91, 1.62);

      // Roof and windows.
      box(car, 1.65, 0.58, 1.85, paint, 0, 1.24, -0.05);
      box(car, 1.57, 0.43, 0.13, glassMat, 0, 1.27, -1.0);
      box(car, 1.57, 0.43, 0.13, glassMat, 0, 1.27, 0.88);
      for (const side of [-1, 1]) {
        box(car, 0.07, 0.39, 1.55, glassMat, side * 0.84, 1.27, -0.05);
        box(car, 0.08, 0.48, 1.95, paint, side * 0.84, 1.22, -0.04);
        box(car, 0.1, 0.22, 0.6, darkPaint, side * 1.03, 0.95, -0.15);
        box(car, 0.12, 0.18, 0.12, paint, side * 1.12, 1.13, -0.15);
      }

      // Front grille, twin kidney-style openings, splitter and headlights.
      box(car, 0.5, 0.39, 0.07, blackMat, -0.29, 0.69, -2.29);
      box(car, 0.5, 0.39, 0.07, blackMat, 0.29, 0.69, -2.29);
      box(car, 0.06, 0.4, 0.08, silverMat, 0, 0.69, -2.32);
      box(car, 1.8, 0.09, 0.17, darkPaint, 0, 0.47, -2.29);
      for (const side of [-1, 1]) {
        box(car, 0.47, 0.13, 0.08, headlightMat,
          side * 0.72, 0.9, -2.3);
        box(car, 0.12, 0.13, 0.08, headlightMat,
          side * 0.93, 0.9, -2.3);
        box(car, 0.42, 0.15, 0.09, redLightMat,
          side * 0.68, 0.84, 2.29);
        cylinder(car, 0.095, 0.095, 0.16, silverMat,
          side * 0.72, 0.39, 2.28, Math.PI / 2);
      }

      // Wheels and rims.
      const wheels = [];
      for (const x of [-1.04, 1.04]) {
        for (const z of [-1.42, 1.42]) {
          const wheel = new THREE.Group();
          wheel.position.set(x, 0.43, z);
          car.add(wheel);
          cylinder(wheel, 0.39, 0.39, 0.23, rubberMat,
            0, 0, 0, 0, 0, Math.PI / 2, 20);
          cylinder(wheel, 0.235, 0.235, 0.245, silverMat,
            0, 0, 0, 0, 0, Math.PI / 2, 12);
          cylinder(wheel, 0.075, 0.075, 0.25, darkPaint,
            0, 0, 0, 0, 0, Math.PI / 2, 10);
          wheels.push(wheel);
        }
      }

      box(car, 1.7, 0.06, 0.13, darkPaint, 0, 1.02, 1.95);
      car.position.y = 0;
      car.userData.wheels = wheels;
      car.userData.isPlayer = isPlayer;
      return car;
    }

    const player = makeCar(0x1762d1, true);
    player.position.set(0, 0, 0);
    scene.add(player);

    // Traffic cars all face -Z, the same forward direction as the player.
    const traffic = [];
    const trafficColors = [0xd92323, 0xe4e7eb, 0x171b22, 0xc2a234, 0x287e4a, 0x6d5aa6];

    function addTrafficCar(index) {
      const car = makeCar(trafficColors[index % trafficColors.length]);
      const lane = [-5, 0, 5][index % 3];
      car.position.set(lane, 0, -65 - index * 52);
      car.userData.speed = 19 + random() * 24; // metres per second
      car.userData.lane = lane;
      scene.add(car);
      traffic.push(car);
    }
    for (let i = 0; i < 8; i++) addTrafficCar(i);

    const keys = {};
    let speed = 0;
    let distance = 0;
    let heading = 0;
    let cameraMode = 0; // 0 = driver, 1 = exterior
    let crashed = false;

    function resetGame() {
      speed = 0;
      distance = 0;
      heading = 0;
      crashed = false;
      player.position.set(0, 0, 0);
      player.rotation.set(0, 0, 0);
      traffic.forEach((car, i) => {
        car.position.x = [-5, 0, 5][i % 3];
        car.position.z = -65 - i * 52;
        car.userData.speed = 19 + random() * 24;
      });
    }

    function changeCamera() {
      cameraMode = cameraMode === 0 ? 1 : 0;
      document.getElementById("cameraLabel").textContent =
        cameraMode === 0
          ? "DRIVER CAMERA · Press C for exterior"
          : "EXTERIOR CAMERA · Press C for driver view";
    }

    window.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault();
      }
      keys[key] = true;
      if (key === "c" && !e.repeat) changeCamera();
      if (key === "r" && !e.repeat) resetGame();
    });
    window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
    window.addEventListener("blur", () => {
      for (const key in keys) keys[key] = false;
    });

    document.querySelectorAll("[data-key]").forEach(button => {
      const key = button.dataset.key;
      const down = e => { e.preventDefault(); keys[key] = true; };
      const up = e => { e.preventDefault(); keys[key] = false; };
      button.addEventListener("pointerdown", down);
      button.addEventListener("pointerup", up);
      button.addEventListener("pointercancel", up);
      button.addEventListener("pointerleave", up);
    });

    const clock = new THREE.Clock();
    const desiredCameraPosition = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();
    const forwardVector = new THREE.Vector3();

    function updateCamera(dt) {
      const smooth = 1 - Math.exp(-5 * dt);

      if (cameraMode === 0) {
        // Driver-seat camera attached to the car's forward direction.
        desiredCameraPosition.set(0, 1.43, -0.18);
        player.localToWorld(desiredCameraPosition);
        lookTarget.set(0, 1.35, -16);
        player.localToWorld(lookTarget);
      } else {
        // Exterior chase camera: behind the car, looking forward.
        desiredCameraPosition.set(0, 4.0, 8.5);
        player.localToWorld(desiredCameraPosition);
        lookTarget.set(0, 1.0, -5);
        player.localToWorld(lookTarget);
      }

      camera.position.lerp(desiredCameraPosition, smooth);
      const currentLook = camera.userData.lookTarget || lookTarget.clone();
      currentLook.lerp(lookTarget, smooth);
      camera.userData.lookTarget = currentLook;
      camera.lookAt(currentLook);
    }

    function update(dt) {
      const gas = keys["w"] || keys["arrowup"] || keys["gas"];
      const brake = keys["s"] || keys["arrowdown"] || keys["brake"];
      const left = keys["a"] || keys["arrowleft"] || keys["left"];
      const right = keys["d"] || keys["arrowright"] || keys["right"];

      if (gas) speed += 27 * dt;
      else speed -= 4.5 * dt;
      if (brake) speed -= 42 * dt;
      speed = THREE.MathUtils.clamp(speed, 0, 83.3);

      // Smooth steering: the car changes its own heading and travels along it.
      const steering = (right ? 1 : 0) - (left ? 1 : 0);
      if (speed > 0.5) {
        const steerStrength = 0.68 * (0.35 + speed / 55);
        heading -= steering * steerStrength * dt;
      }

      // Move the car in the direction its nose points.
      forwardVector.set(Math.sin(heading), 0, -Math.cos(heading));
      player.position.x += forwardVector.x * speed * dt;
      player.position.z += forwardVector.z * speed * dt;
      player.rotation.y = heading;

      // No world transform changes here: the road and map are stationary.
      distance += speed * dt;

      // Traffic also moves forward along -Z, not backward.
      for (const car of traffic) {
        car.position.z -= car.userData.speed * dt;

        // Recycle a car only after it has passed behind the player.
        if (car.position.z > player.position.z + 32) {
          const farthest = Math.min(...traffic.map(other => other.position.z));
          car.position.z = farthest - 65 - random() * 45;
          car.position.x = [-5, 0, 5][Math.floor(random() * 3)];
          car.userData.speed = 19 + random() * 24;
        }

        // Detect close traffic and slow down to avoid overlap.
        const dx = car.position.x - player.position.x;
        const dz = car.position.z - player.position.z;
        if (Math.abs(dx) < 1.8 && Math.abs(dz) < 3.8) {
          speed = Math.min(speed, car.userData.speed * 1.1);
        }
      }

      // Keep the player on the road without sliding the road itself.
      player.position.x = THREE.MathUtils.clamp(player.position.x, -6.1, 6.1);

      for (const wheel of player.userData.wheels) {
        wheel.rotation.x += speed * dt * 1.7;
      }
      for (const car of traffic) {
        for (const wheel of car.userData.wheels) {
          wheel.rotation.x += car.userData.speed * dt * 1.7;
        }
      }

      document.getElementById("speed").textContent = Math.round(speed * 3.6);
      document.getElementById("distance").textContent = Math.floor(distance);
      updateCamera(dt);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);
      update(dt);
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    camera.position.set(0, 1.43, 0.1);
    animate();
  } catch (err) {
    errorBox.style.display = "block";
    errorBox.textContent = "Game error:\n" + (err?.stack || err?.message || err);
  }
})();
</script>
</body>
</html>
