<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedForSpeed 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;z-index:2;background:#0009;padding:14px;border-radius:12px;line-height:1.7}
#speed{font-size:28px;font-weight:bold;color:#55eaff}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0009;z-index:5}
.panel{background:#141414ed;padding:28px;border:1px solid #555;border-radius:18px;max-width:90%}
button{border:0;border-radius:10px;padding:13px 17px;font-weight:bold;cursor:pointer;background:#19c8ef;color:#111;touch-action:none}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;z-index:3;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
.control{min-width:62px;min-height:55px;font-size:18px;background:#222d;color:white;border:1px solid #aaa}
#gas{background:#19bb72}#brake{background:#e34b4b}
#help{position:fixed;right:15px;top:15px;background:#0009;padding:10px;border-radius:10px;z-index:2;font-size:12px}
</style>
</head>
<body>
<div id="hud">
  <div>NEED FOR SPEED</div>
  <div id="speed">0 km/h</div>
  <div id="gear">GEAR: N</div>
  <div>SCORE: <span id="score">0</span></div>
</div>
<div id="help">W/↑ GAS · S/↓ BRAKE<br>A/← LEFT · D/→ RIGHT</div>
<div id="message">
  <div class="panel">
    <h1 id="title">🏎️ NEED FOR SPEED</h1>
    <p id="description">Drive fast. Avoid traffic. Beat your score!</p>
    <button id="start">START ENGINE</button>
  </div>
</div>
<div id="controls">
  <div class="group">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <div class="group">
    <button class="control" id="brake">BRAKE</button>
    <button class="control" id="gas">GAS</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 45, 220);

  const camera = new THREE.PerspectiveCamera(
    70, innerWidth / innerHeight, 0.1, 300
  );
  camera.position.set(0, 5, 10);
  camera.lookAt(0, 1, -10);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x526050, 2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.3);
  sun.position.set(-10, 20, 10);
  sun.castShadow = true;
  scene.add(sun);

  function box(w,h,d,color,x,y,z,parent=scene) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      new THREE.MeshStandardMaterial({color, roughness:0.75})
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  // Ground and road
  box(300,0.2,300,0x438b40,0,-0.2,-100);
  box(13,0.15,300,0x333333,0,-0.06,-100);
  box(0.18,0.05,300,0xffffff,-6.25,0.04,-100);
  box(0.18,0.05,300,0xffffff,6.25,0.04,-100);

  const lines=[];
  for(let z=-230;z<20;z+=9){
    lines.push(box(0.16,0.06,4,0xffffff,0,0.04,z));
  }

  // Roadside trees
  const trees=[];
  function makeTree(x,z){
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(
      new THREE.CylinderGeometry(0.18,0.25,1.6,7),
      new THREE.MeshStandardMaterial({color:0x664322})
    );
    trunk.position.y=0.8;
    tree.add(trunk);
    const leaves=new THREE.Mesh(
      new THREE.ConeGeometry(1.1,2.8,8),
      new THREE.MeshStandardMaterial({color:0x176b30})
    );
    leaves.position.y=2.5;
    tree.add(leaves);
    tree.position.set(x,0,z);
    scene.add(tree);
    trees.push(tree);
  }
  for(let z=-220;z<20;z+=13){
    makeTree(-10,z);
    makeTree(10,z-5);
  }

  // Build a car from simple 3D parts
  function makeCar(color,isPlayer=false){
    const car=new THREE.Group();
    box(1.65,0.55,3.1,color,0,0.65,0,car);
    box(1.25,0.65,1.5,0x202b38,0,1.18,-0.15,car);
    box(1.3,0.12,0.12,0xfff3bd,0.48,0.72,-1.57,car);
    box(1.3,0.12,0.12,0xfff3bd,-0.48,0.72,-1.57,car);
    box(1.25,0.13,0.12,0xff3333,0,0.75,1.57,car);

    const wheels=[];
    for(const x of [-0.87,0.87]){
      for(const z of [-1,1]){
        const wheel=new THREE.Mesh(
          new THREE.CylinderGeometry(0.36,0.36,0.22,16),
          new THREE.MeshStandardMaterial({color:0x111111})
        );
        wheel.rotation.z=Math.PI/2;
        wheel.position.set(x,0.36,z);
        wheel.castShadow=true;
        car.add(wheel);
        wheels.push(wheel);
      }
    }
    car.userData.wheels=wheels;
    scene.add(car);
    return car;
  }

  const player=makeCar(0x00aaff,true);
  player.position.set(0,0,3);

  const traffic=[];
  const trafficColors=[0xff3333,0xffcc22,0xeeeeee,0x9944ee,0x22cc77];
  for(let i=0;i<5;i++){
    const car=makeCar(trafficColors[i]);
    car.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-30-i*37);
    traffic.push(car);
  }

  const keys={left:false,right:false,gas:false,brake:false};
  let running=false, speed=0, score=0, playerX=0;
  let lateralVelocity=0, steering=0;
  let previous=performance.now();

  function setKey(key,value){keys[key]=value;}

  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))
      e.preventDefault();
    if(k==='arrowleft'||k==='a')setKey('left',true);
    if(k==='arrowright'||k==='d')setKey('right',true);
    if(k==='arrowup'||k==='w')setKey('gas',true);
    if(k==='arrowdown'||k==='s'||k===' ')setKey('brake',true);
  });
  addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a')setKey('left',false);
    if(k==='arrowright'||k==='d')setKey('right',false);
    if(k==='arrowup'||k==='w')setKey('gas',false);
    if(k==='arrowdown'||k==='s'||k===' ')setKey('brake',false);
  });
  addEventListener('blur',()=>{
    Object.keys(keys).forEach(k=>keys[k]=false);
  });

  function bindButton(id,key){
    const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{
      e.preventDefault();
      setKey(key,true);
      el.setPointerCapture(e.pointerId);
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(evt=>{
      el.addEventListener(evt,()=>setKey(key,false));
    });
  }
  bindButton('left','left');
  bindButton('right','right');
  bindButton('gas','gas');
  bindButton('brake','brake');

  const speedEl=document.getElementById('speed');
  const scoreEl=document.getElementById('score');
  const gearEl=document.getElementById('gear');
  const message=document.getElementById('message');

  function gameOver(){
    if(!running)return;
    running=false;
    Object.keys(keys).forEach(k=>keys[k]=false);
    document.getElementById('title').textContent='💥 CRASH!';
    document.getElementById('description').textContent=
      'Score: '+Math.floor(score)+' · Try again!';
    document.getElementById('start').textContent='DRIVE AGAIN';
    message.style.display='flex';
  }

  function startGame(){
    speed=0;
    score=0;
    playerX=0;
    lateralVelocity=0;
    steering=0;
    player.position.x=0;
    traffic.forEach((car,i)=>{
      car.position.x=[-4,0,4][Math.floor(Math.random()*3)];
      car.position.z=-35-i*38;
    });
    scoreEl.textContent='0';
    document.getElementById('title').textContent='🏎️ NEED FOR SPEED';
    document.getElementById('description').textContent='Drive fast. Avoid traffic!';
    document.getElementById('start').textContent='START ENGINE';
    message.style.display='none';
    running=true;
    previous=performance.now();
  }
  document.getElementById('start').addEventListener('click',startGame);

  function animate(now){
    requestAnimationFrame(animate);
    const dt=Math.min((now-previous)/1000,0.04);
    previous=now;

    if(running){
      // Acceleration, coasting and braking
      if(keys.gas)speed+=45*dt;
      else speed-=5*dt;
      if(keys.brake)speed-=90*dt;
      speed=THREE.MathUtils.clamp(speed,0,190);

      // Smooth steering and momentum
      const input=(keys.left?1:0)-(keys.right?1:0);
      lateralVelocity+=input*(3.5+speed*0.025)*dt;
      lateralVelocity*=Math.exp(-3.2*dt);
      lateralVelocity=THREE.MathUtils.clamp(lateralVelocity,-5,5);
      playerX+=lateralVelocity*dt;

      if(playerX < -5.1 || playerX > 5.1){
        playerX=THREE.MathUtils.clamp(playerX,-5.1,5.1);
        lateralVelocity=0;
      }

      player.position.x=playerX;
      steering=THREE.MathUtils.lerp(
        steering,input*0.3,1-Math.exp(-7*dt)
      );
      player.rotation.y=-steering*0.35;
      player.userData.wheels.forEach(w=>w.rotation.x+=speed*dt*0.035);

      // Follow camera
      camera.position.x=THREE.MathUtils.lerp(
        camera.position.x,playerX*0.45,1-Math.exp(-3*dt)
      );
      camera.position.y=THREE.MathUtils.lerp(
        camera.position.y,5+speed*0.003,1-Math.exp(-2*dt)
      );
      camera.lookAt(playerX*0.3,1,-10);

      // Road and scenery move toward the player
      const move=speed*dt*0.22;
      lines.forEach(line=>{
        line.position.z+=move*3;
        if(line.position.z>12)line.position.z-=270;
      });
      trees.forEach(tree=>{
        tree.position.z+=move*3;
        if(tree.position.z>15)tree.position.z-=260;
      });

      // Traffic and collisions
      for(const car of traffic){
        car.position.z+=move*2.2;
        const hitLength=Math.abs(car.position.z-player.position.z)<2.5;
        const hitWidth=Math.abs(car.position.x-playerX)<1.45;
        if(hitLength&&hitWidth){
          gameOver();
          break;
        }
        if(car.position.z>12){
          car.position.z=-190-Math.random()*50;
          car.position.x=[-4,0,4][Math.floor(Math.random()*3)];
          score+=100;
        }
      }

      score+=dt*speed*0.25;
      speedEl.textContent=Math.round(speed)+' km/h';
      gearEl.textContent='GEAR: '+(speed<1?'N':speed<45?'1':speed<90?'2':speed<140?'3':'4');
      scoreEl.textContent=Math.floor(score);
    }

    renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
