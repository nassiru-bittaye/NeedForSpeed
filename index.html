
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMW M5 CS Driving Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#91d5f5;font-family:Arial,sans-serif}
canvas{display:block}
#hud,#help,#cameraLabel{position:fixed;z-index:5;color:white;background:#071019d9;border:1px solid #ffffff33;border-radius:10px;padding:12px}
#hud{top:14px;left:14px;line-height:1.65;font-weight:bold}
#hud .model{color:#b5d6bc;font-size:17px}
#help{top:14px;right:14px;text-align:right;line-height:1.7;font-size:13px}
#cameraLabel{bottom:15px;left:50%;transform:translateX(-50%);white-space:nowrap}
#error{display:none;position:fixed;inset:10px;z-index:30;background:#300;color:white;padding:20px;white-space:pre-wrap}
#mobile{position:fixed;bottom:20px;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.controls{display:flex;gap:8px}
.control{pointer-events:auto;touch-action:none;user-select:none;width:62px;height:62px;border:2px solid #ffffffbb;border-radius:15px;background:#101722dd;color:white;font-size:22px;font-weight:bold}
.pedal{font-size:12px;height:68px}
@media(hover:hover) and (pointer:fine){#mobile{display:none}}
</style>
</head>
<body>
<div id="hud">
  <div class="model">BMW M5 CS</div>
  <div>Speed: <span id="speed">0</span> km/h</div>
  <div>Distance: <span id="distance">0</span> m</div>
</div>
<div id="help">
  W / ↑ Accelerate<br>
  S / ↓ Brake<br>
  A / ← Turn left<br>
  D / → Turn right<br>
  <b>C Change camera</b><br>
  R Reset
</div>
<div id="cameraLabel">DRIVER CAMERA · PRESS C</div>
<div id="error"></div>
<div id="mobile">
  <div class="controls">
    <button class="control" data-key="left">◀</button>
    <button class="control" data-key="right">▶</button>
  </div>
  <div class="controls">
    <button class="control pedal" data-key="brake">BRAKE</button>
    <button class="control pedal" data-key="gas">GAS</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
if(!window.THREE){
 const e=document.getElementById('error');
 e.style.display='block';e.textContent='3D graphics did not load. Check your internet connection and refresh.';
 return;
}
try {
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d5f5);
scene.fog=new THREE.Fog(0x91d5f5,150,750);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe6f4ff,0x596047,2.0));
const sun=new THREE.DirectionalLight(0xfff5e5,2.7);
sun.position.set(-35,70,35);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=(color,roughness=.5,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const paint=new THREE.MeshStandardMaterial({
 color:0x073c2c,roughness:.22,metalness:.72
});
const paintHighlight=new THREE.MeshStandardMaterial({
 color:0x0c503a,roughness:.24,metalness:.7
});
const carbon=mat(0x111518,.3,.45);
const black=mat(0x07090b,.25,.25);
const bronze=mat(0x9b7441,.28,.82);
const bronzeLight=mat(0xd0a76a,.25,.82);
const rubber=mat(0x111113,.88);
const windowMat=new THREE.MeshStandardMaterial({
 color:0x101e27,roughness:.16,metalness:.3
});
const chrome=mat(0xb5c1c5,.25,.9);
const yellowLED=new THREE.MeshStandardMaterial({
 color:0xffdf7b,emissive:0xffc83e,emissiveIntensity:2.0
});
const redLED=new THREE.MeshStandardMaterial({
 color:0xff141c,emissive:0x9c0005,emissiveIntensity:1.7
});

function box(parent,w,h,d,material,x,y,z,cast=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);
 o.castShadow=cast;o.receiveShadow=true;
 parent.add(o);return o;
}
function cyl(parent,rt,rb,h,material,x,y,z,rx=0,ry=0,rz=0,n=20){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),material);
 o.position.set(x,y,z);o.rotation.set(rx,ry,rz);
 o.castShadow=true;parent.add(o);return o;
}
function shape(parent,pts,depth,material,x,y,z){
 const s=new THREE.Shape();
 s.moveTo(pts[0][0],pts[0][1]);
 for(let i=1;i<pts.length;i++)s.lineTo(pts[i][0],pts[i][1]);
 s.closePath();
 const o=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{
  depth,bevelEnabled:true,bevelSegments:2,steps:1,
  bevelSize:.018,bevelThickness:.018
 }),material);
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}

// Stationary landscape. Steering never moves the map.
const grass=mat(0x568447);
const roadMat=mat(0x30343a,.94);
const roadLine=mat(0xf5f1dc);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),grass);
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.12,-400);
ground.receiveShadow=true;scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(15,1800),roadMat);
road.rotation.x=-Math.PI/2;road.position.set(0,-.04,-400);
road.receiveShadow=true;scene.add(road);

for(const x of [-7.15,7.15]){
 box(scene,.15,.035,1800,roadLine,x,.005,-400,false);
}
for(const x of [-2.5,2.5]){
 for(let z=40;z>-1250;z-=12)
  box(scene,.11,.035,5,roadLine,x,.008,z,false);
}

let seed=1357911;
function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
const trunk=mat(0x61442b);
const foliage=[mat(0x285d31),mat(0x39743a),mat(0x4a8240)];
for(let z=45;z>-1250;z-=12){
 for(const side of [-1,1]){
  const x=side*(12+rand()*27),h=3+rand()*4;
  cyl(scene,.23,.34,h*.55,trunk,x,h*.275,z,0,0,0,8);
  const crown=new THREE.Mesh(
   new THREE.ConeGeometry(1+rand()*1.1,h,8),
   foliage[Math.floor(rand()*foliage.length)]
  );
  crown.position.set(x,h*.7,z);crown.castShadow=true;scene.add(crown);
 }
}
for(const side of [-1,1]){
 box(scene,.15,.38,1600,chrome,side*8.2,.48,-400,false);
 for(let z=35;z>-1200;z-=18)
  box(scene,.1,.6,.12,chrome,side*8.2,.3,z,false);
}

// BMW M5 CS-inspired 3D model. Nose faces forward, toward -Z.
function makeCar(color=0x073c2c){
 const car=new THREE.Group();
 const bodyPaint=color===0x073c2c?paint:
  new THREE.MeshStandardMaterial({color,metalness:.65,roughness:.3});
 const wheels=[];

 // Wide body and lower sill.
 box(car,2.12,.38,4.72,bodyPaint,0,.68,0);
 box(car,2.02,.18,1.1,bodyPaint,0,.88,-1.72);
 box(car,1.99,.17,.93,bodyPaint,0,.87,1.72);
 box(car,1.84,.12,1.45,bodyPaint,0,.92,-1.22);
 box(car,1.85,.12,.65,bodyPaint,0,.91,1.96);

 // Raised hood contours.
 for(const x of [-.62,.62]){
  const line=box(car,.045,.035,1.25,paintHighlight,x,.991,-1.23);
  line.material=bodyPaint;
 }
 box(car,1.8,.065,.16,carbon,0,.98,2.08);

 // Low roof and fast windscreen slope.
 shape(car,[
  [-.79,0],[-.7,.45],[-.48,.63],[.48,.63],
  [.7,.45],[.79,0]
 ],1.62,bodyPaint,0,1.02,-.82);
 box(car,1.49,.39,.06,windowMat,0,1.34,-.9);
 box(car,1.47,.38,.06,windowMat,0,1.33,.87);

 for(const side of [-1,1]){
  // Window pillars and side glass.
  box(car,.085,.42,1.48,windowMat,side*.81,1.31,-.03);
  box(car,.1,.53,1.72,bodyPaint,side*.82,1.25,-.03);
  box(car,.13,.19,.44,black,side*1.05,.98,-.2);
  box(car,.14,.1,.19,bodyPaint,side*1.11,1.12,-.45);
  box(car,.15,.06,.17,black,side*1.12,1.12,-.45);

  // Pronounced muscular wheel arches.
  for(const z of [-1.43,1.43]){
   const arch=new THREE.Mesh(
    new THREE.TorusGeometry(.46,.055,8,32,Math.PI),
    bodyPaint
   );
   arch.rotation.z=Math.PI;
   arch.rotation.x=Math.PI/2;
   arch.position.set(side*.99,.44,z);
   car.add(arch);
  }
  box(car,.13,.13,2.85,carbon,side*1.04,.39,.03);
 }

 // Iconic twin kidney grille: tall black openings and vertical slats.
 for(const gx of [-.30,.30]){
  box(car,.54,.46,.09,chrome,gx,.69,-2.36);
  box(car,.47,.395,.105,black,gx,.69,-2.415);
  for(let i=0;i<6;i++){
   box(car,.022,.345,.025,bronzeLight,gx-.18+i*.072,.69,-2.475);
  }
 }
 box(car,.055,.43,.1,black,0,.69,-2.43);

 // Deep front bumper, side intakes and carbon splitter.
 box(car,1.97,.22,.19,bodyPaint,0,.48,-2.32);
 box(car,1.98,.065,.29,carbon,0,.365,-2.36);
 for(const side of [-1,1]){
  box(car,.42,.19,.09,black,side*.72,.53,-2.42);
  box(car,.055,.17,.055,bronzeLight,side*.72,.53,-2.47);

  // Sharp yellow-tinted CS-style headlights.
  shape(car,[[0,0],[.48,.035],[.41,.16],[.06,.13]],
   .065,yellowLED,side*.48,.83,-2.4);
  box(car,.31,.035,.06,yellowLED,side*.72,.91,-2.41);
  box(car,.19,.035,.06,yellowLED,side*.88,.87,-2.41);

  // Rear LED tail lights.
  box(car,.57,.14,.065,redLED,side*.67,.84,2.37);
  box(car,.32,.035,.07,redLED,side*.69,.91,2.38);

  // Side vents behind the front wheels.
  box(car,.20,.22,.035,black,side*1.055,.69,-.95);
  for(let i=0;i<3;i++)
   box(car,.018,.15,.025,chrome,side*1.06,.69+i*.001,-1.0+i*.035);
 }

 // Quad exhausts: two on each side of the rear bumper.
 for(const x of [-.72,-.48,.48,.72]){
  cyl(car,.105,.105,.17,chrome,x,.405,2.39,Math.PI/2,0,0,20);
  cyl(car,.073,.073,.18,black,x,.405,2.49,Math.PI/2,0,0,20);
 }

 // Small front badge detail.
 cyl(car,.09,.09,.018,chrome,0,1.002,-1.95,Math.PI/2,0,0,24);
 cyl(car,.064,.064,.021,mat(0x174d9a,.25,.7),0,1.015,-1.95,Math.PI/2,0,0,24);

 // Bronze CS multi-spoke wheels and dark tyres.
 for(const x of [-1.035,1.035]){
  for(const z of [-1.43,1.43]){
   const wheel=new THREE.Group();
   wheel.position.set(x,.43,z);car.add(wheel);
   cyl(wheel,.395,.395,.25,rubber,0,0,0,0,0,Math.PI/2,32);
   cyl(wheel,.29,.29,.26,black,0,0,0,0,0,Math.PI/2,32);
   cyl(wheel,.247,.247,.275,bronze,0,0,0,0,0,Math.PI/2,32);
   // Twenty slim spokes for a forged wheel look.
   for(let i=0;i<10;i++){
    const a=i*Math.PI/5;
    const spoke=box(wheel,.037,.40,.035,bronzeLight,0,0,0);
    spoke.position.set(Math.sin(a)*.105,Math.cos(a)*.105,0);
    spoke.rotation.z=-a;
    const spoke2=box(wheel,.027,.33,.03,bronze,0,0,0);
    spoke2.position.set(Math.sin(a+.12)*.11,Math.cos(a+.12)*.11,0);
    spoke2.rotation.z=-(a+.12);
   }
   cyl(wheel,.075,.075,.29,black,0,0,0,0,0,Math.PI/2,16);
   cyl(wheel,.055,.055,.30,bronzeLight,0,0,0,0,0,Math.PI/2,16);
   wheels.push(wheel);
  }
 }

 // Dark carbon rear diffuser.
 box(car,1.72,.14,.18,carbon,0,.43,2.35);
 for(let x=-.6;x<=.61;x+=.3)
  box(car,.035,.15,.23,black,x,.39,2.37);

 car.userData.wheels=wheels;
 return car;
}

const player=makeCar();
scene.add(player);
player.position.set(0,0,0);

// Traffic uses the same forward orientation as the player.
const traffic=[];
const colors=[0xd6d9de,0x15191e,0x92252b,0x4c665e,0xb4a27d];
for(let i=0;i<7;i++){
 const c=makeCar(colors[i%colors.length]);
 c.scale.set(.92,.92,.92);
 c.position.set([-5,0,5][i%3],0,-75-i*75);
 c.userData.speed=17+rand()*15;
 scene.add(c);traffic.push(c);
}

const keys={};
let speed=0,travelled=0,heading=0,cameraMode=0;
function reset(){
 speed=0;travelled=0;heading=0;
 player.position.set(0,0,0);player.rotation.set(0,0,0);
 traffic.forEach((c,i)=>{
  c.position.set([-5,0,5][i%3],0,-75-i*75);
  c.userData.speed=17+rand()*15;
 });
}
function toggleCamera(){
 cameraMode=1-cameraMode;
 document.getElementById('cameraLabel').textContent=
 cameraMode?'EXTERIOR CAMERA · PRESS C FOR DRIVER VIEW':
 'DRIVER CAMERA · PRESS C FOR EXTERIOR';
}
window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 keys[k]=true;
 if(k==='c'&&!e.repeat)toggleCamera();
 if(k==='r'&&!e.repeat)reset();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerdown',down);
 b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);
 b.addEventListener('pointerleave',up);
});

const clock=new THREE.Clock();
const look=new THREE.Vector3();
let lookReady=false;
function updateCamera(dt){
 const pos=new THREE.Vector3(),target=new THREE.Vector3();
 if(cameraMode===0){
  pos.set(0,1.46,-.15);player.localToWorld(pos);
  target.set(0,1.38,-25);player.localToWorld(target);
 }else{
  pos.set(0,4.1,9.5);player.localToWorld(pos);
  target.set(0,1,-5);player.localToWorld(target);
 }
 const f=1-Math.exp(-6*dt);
 camera.position.lerp(pos,f);
 if(!lookReady){look.copy(target);lookReady=true}
 else look.lerp(target,f);
 camera.lookAt(look);
}

function update(dt){
 const gas=keys.w||keys.arrowup||keys.gas;
 const brake=keys.s||keys.arrowdown||keys.brake;
 const left=keys.a||keys.arrowleft||keys.left;
 const right=keys.d||keys.arrowright||keys.right;

 if(gas)speed+=24*dt;
 else speed-=3*dt;
 if(brake)speed-=38*dt;
 speed=THREE.MathUtils.clamp(speed,0,78);

 const steer=(right?1:0)-(left?1:0);
 if(speed>.5)heading-=steer*(.45+speed/80)*dt;

 // The car moves through the stationary world.
 player.position.x+=Math.sin(heading)*speed*dt;
 player.position.z-=Math.cos(heading)*speed*dt;
 player.position.x=THREE.MathUtils.clamp(player.position.x,-6,6);
 player.rotation.y=heading;
 travelled+=speed*dt;

 for(const c of traffic){
  c.position.z-=c.userData.speed*dt;
  if(c.position.z>player.position.z+30){
   const farthest=Math.min(...traffic.map(v=>v.position.z));
   c.position.z=farthest-75-rand()*55;
   c.position.x=[-5,0,5][Math.floor(rand()*3)];
   c.userData.speed=17+rand()*15;
  }
  if(Math.abs(c.position.x-player.position.x)<1.7&&
     Math.abs(c.position.z-player.position.z)<3.3){
   speed=Math.min(speed,c.userData.speed*.9);
  }
  for(const w of c.userData.wheels)w.rotation.x+=c.userData.speed*dt*1.7;
 }
 for(const w of player.userData.wheels)w.rotation.x+=speed*dt*1.7;

 document.getElementById('speed').textContent=Math.round(speed*3.6);
 document.getElementById('distance').textContent=Math.floor(travelled);
 updateCamera(dt);
}

function animate(){
 requestAnimationFrame(animate);
 update(Math.min(clock.getDelta(),.04));
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
camera.position.set(0,1.5,.1);
animate();
}catch(err){
 const e=document.getElementById('error');
 e.style.display='block';
 e.textContent='Game error:\n'+(err.stack||err.message||err);
}
})();
</script>
</body>
</html>
