
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMW Street Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#86bce4;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:14px;left:14px;color:white;font-weight:bold;font-size:17px;line-height:1.8;text-shadow:2px 2px 5px #000;z-index:3}
button{cursor:pointer}
#view{position:fixed;right:12px;top:12px;z-index:4;background:#111d;color:white;border:1px solid #aaa;border-radius:9px;padding:11px;font-weight:bold}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:4;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
.control{width:65px;height:65px;border-radius:16px;border:2px solid #ffffff99;background:#111b;color:white;font-size:26px;font-weight:bold;touch-action:none;user-select:none}
#help{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:white;text-shadow:1px 1px 3px black;white-space:nowrap;z-index:3}
#flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:7}
#crash{display:none;position:fixed;inset:0;z-index:8;background:#0009;color:white;align-items:center;justify-content:center;flex-direction:column;font-size:44px;font-weight:900;text-shadow:3px 3px 5px #000}
#restart{margin-top:20px;padding:13px 22px;border-radius:10px;border:2px solid white;background:#142e50;color:white;font-size:18px}
@media(max-width:600px){#hud{font-size:14px}.control{width:58px;height:58px}#help{bottom:91px}}
</style>
</head>
<body>
<div id="hud">SPEED: <span id="speed">0</span> KM/H<br>DISTANCE: <span id="distance">0</span> M</div>
<button id="view">🚘 EXTERIOR VIEW</button>
<div id="flash"></div>
<div id="crash">
  <div>💥 CRASH!</div>
  <div style="font-size:18px;margin-top:12px">Your race has ended</div>
  <button id="restart">DRIVE AGAIN ↻</button>
</div>
<div id="controls">
  <div class="group">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <div class="group">
    <button class="control" id="brake">▼</button>
    <button class="control" id="gas">▲</button>
  </div>
</div>
<div id="help">A/D or ←/→ STEER · W/↑ ACCELERATE · S/↓ BRAKE</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
"use strict";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86bce4);
scene.fog=new THREE.Fog(0x86bce4,100,340);

const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe2f4ff,0x59604a,2.1));
const sun=new THREE.DirectionalLight(0xfff0d5,2.8);
sun.position.set(-30,60,-40);
sun.castShadow=true;
scene.add(sun);

function mat(c,r=.75,m=0){
 return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
}
function box(parent,w,h,d,c,x,y,z,ma=null){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma||mat(c));
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
 parent.add(o);return o;
}
function cyl(parent,rt,rb,h,c,x,y,z,ma=null){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),ma||mat(c));
 o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
function plane(w,h,c,x,y,z){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat(c));
 o.rotation.x=-Math.PI/2;o.position.set(x,y,z);scene.add(o);return o;
}

// ROAD AND ENVIRONMENT
plane(600,900,0x557b43,0,-.2,-300);
plane(15,900,0x30343a,0,-.08,-300);
plane(2.1,900,0x77756a,-8.5,-.06,-300);
plane(2.1,900,0x77756a,8.5,-.06,-300);
plane(.12,900,0xe7e5d7,-7.1,-.035,-300);
plane(.12,900,0xe7e5d7,7.1,-.035,-300);

const roadLines=[];
for(let z=-600;z<80;z+=13){
 roadLines.push(box(scene,.16,.025,5.5,0xffd34e,0,-.005,z));
}
for(const x of [-2.5,2.5]){
 for(let z=-600;z<80;z+=18){
  box(scene,.07,.02,8,0xf4f0e3,x,-.006,z);
 }
}

for(let i=0;i<38;i++){
 const side=i%2?1:-1,h=22+Math.random()*45;
 const mountain=new THREE.Mesh(new THREE.ConeGeometry(15+Math.random()*22,h,5),mat(0x738981));
 mountain.position.set(side*(35+Math.random()*80),h/2-1,-100-Math.random()*480);
 mountain.scale.z=1.6;scene.add(mountain);
}

function makeTree(x,z){
 const g=new THREE.Group();
 cyl(g,.15,.24,1.8,0x64452d,0,.9,0);
 const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.25,3.6,8),mat([0x245a35,0x326c3b,0x477b42][Math.floor(Math.random()*3)]));
 leaves.position.y=2.8;g.add(leaves);
 g.position.set(x,0,z);scene.add(g);
 return g;
}
const roadside=[];
for(let i=0;i<90;i++){
 const side=i%2?1:-1;
 const z=-Math.random()*650;
 roadside.push(makeTree(side*(12+Math.random()*32),z));
}
const rails=[];
for(const side of [-1,1]){
 for(let z=-600;z<80;z+=8){
  rails.push(box(scene,.14,.16,7,0xa6afb5,side*8,.8,z,mat(0x9ca6ac,.35,.75)));
  box(scene,.13,1,.13,0x73797d,side*8,.4,z);
 }
}

// CAR: separate exterior and interior so the cockpit remains visible.
const car=new THREE.Group();scene.add(car);
const exterior=new THREE.Group();car.add(exterior);
const cockpit=new THREE.Group();car.add(cockpit);

const bluePaint=mat(0x1256b5,.23,.62);
const blackLeather=mat(0x101318,.72);
const softLeather=mat(0x242a30,.85);
const silver=mat(0x9da9b2,.28,.85);
const glass=new THREE.MeshStandardMaterial({
 color:0x80c6e4,transparent:true,opacity:.22,roughness:.15,
 side:THREE.DoubleSide
});

// Sporty blue car exterior
box(exterior,2,.48,4.2,0x1256b5,0,.65,0,bluePaint);
box(exterior,1.65,.16,1.15,0x1256b5,0,.98,-1.25,bluePaint);
box(exterior,1.65,.15,.95,0x1256b5,0,.97,1.22,bluePaint);
box(exterior,1.4,.035,1.0,0x2674d6,0,.92,-1.5);
box(exterior,1.6,.1,.13,0xdff5ff,0,.65,-2.12);
for(const x of [-.73,.73]){
 box(exterior,.32,.12,.12,0xfff0cf,x,.7,-2.1);
 box(exterior,.35,.17,.1,0xff2424,x,.67,2.1);
}
box(exterior,1.58,.12,1.25,0x1256b5,0,1.8,.04,bluePaint);

function wheel(parent,x,y,z){
 const tyre=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.27,24),mat(0x111214,.96));
 tyre.rotation.z=Math.PI/2;tyre.position.set(x,y,z);parent.add(tyre);
 const rim=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.29,12),silver);
 rim.rotation.z=Math.PI/2;rim.position.set(x,y,z);parent.add(rim);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.3,12),mat(0x252b31,.3,.7));
 hub.rotation.z=Math.PI/2;hub.position.set(x,y,z);parent.add(hub);
}
for(const x of [-1,1]){
 wheel(exterior,x,.4,-1.35);
 wheel(exterior,x,.4,1.35);
 const pillar=box(exterior,.09,.95,.12,0x17202a,x*.78,1.36,-.7);
 pillar.rotation.x=-.16;
 const rear=box(exterior,.1,.8,.12,0x17202a,x*.78,1.36,.72);
 rear.rotation.x=.18;
}
const windshield=new THREE.Mesh(new THREE.PlaneGeometry(1.48,.8),glass);
windshield.position.set(0,1.43,-.72);windshield.rotation.x=-.18;exterior.add(windshield);

// BMW-INSPIRED DRIVER COCKPIT
// Black stitched-style dashboard, silver trim and a wide instrument binnacle.
box(cockpit,1.83,.29,.56,0x111419,0,1.03,-.76,blackLeather);
box(cockpit,1.72,.045,.18,0x373d43,0,1.20,-.87);
box(cockpit,1.67,.025,.035,0xb5bec5,0,1.17,-.99,silver);

// Digital instrument screen
const gaugeScreen=new THREE.MeshStandardMaterial({
 color:0x071c29,emissive:0x075078,emissiveIntensity:.65,metalness:.3,roughness:.25
});
box(cockpit,.77,.27,.07,0x070a0e,-.43,1.27,-.78,blackLeather);
box(cockpit,.68,.19,.025,0x071c29,-.43,1.27,-.735,gaugeScreen);

// Twin circular gauges
for(let i=0;i<2;i++){
 const x=-.61+i*.36;
 const rim=new THREE.Mesh(new THREE.TorusGeometry(.078,.009,8,28),silver);
 rim.position.set(x,1.27,-.715);cockpit.add(rim);
 const face=new THREE.Mesh(new THREE.CircleGeometry(.067,28),mat(0x071521,.3));
 face.position.set(x,1.27,-.72);cockpit.add(face);
 for(let j=0;j<9;j++){
  const a=j/9*Math.PI*2;
  const tick=box(cockpit,.008,.018,.009,0x64d8ff,
    x+Math.cos(a)*.049,1.27+Math.sin(a)*.049,-.707);
  tick.rotation.z=-a;
 }
 const needle=box(cockpit,.008,.052,.012,0xff514e,x,1.28,-.697);
 needle.rotation.z=-.5+i*.9;
}

// Central infotainment screen, tilted towards driver
box(cockpit,.51,.39,.08,0x11161b,.31,1.16,-.66,blackLeather);
const displayMat=new THREE.MeshStandardMaterial({
 color:0x123c50,emissive:0x0876a7,emissiveIntensity:.9,roughness:.25
});
const display=box(cockpit,.43,.29,.025,0x123c50,.31,1.17,-.61,displayMat);
display.rotation.z=-.08;

// Screen details
for(let i=0;i<3;i++){
 box(cockpit,.22,.012,.012,0x58d5ff,.31,1.24-i*.065,-.59);
}
for(let i=0;i<5;i++){
 box(cockpit,.055,.04,.025,[0x2877a0,0x54bde0,0x5b6e7c,0x2877a0,0x54bde0][i],
 .13+i*.09,.91,-.52);
}

// Air vents
for(const x of [-.77,.76]){
 box(cockpit,.22,.09,.035,0x080b0e,x,1.12,-.81);
 for(let i=0;i<3;i++){
  box(cockpit,.16,.009,.012,0x87929a,x,1.09+i*.025,-.785,silver);
 }
}

// BMW-style three-spoke steering wheel
const steeringWheel=new THREE.Group();
steeringWheel.position.set(-.45,1.28,-.36);
cockpit.add(steeringWheel);

const wheelRing=new THREE.Mesh(
 new THREE.TorusGeometry(.255,.033,12,40),mat(0x090b0e,.48)
);
steeringWheel.add(wheelRing);

const wheelHub=new THREE.Mesh(
 new THREE.CylinderGeometry(.075,.075,.055,24),mat(0x333b43,.3,.5)
);
wheelHub.rotation.x=Math.PI/2;
wheelHub.position.z=.015;
steeringWheel.add(wheelHub);

// Three spokes
box(steeringWheel,.038,.19,.035,0x9ba5ad,0,-.11,.018,silver);
const leftSpoke=box(steeringWheel,.18,.035,.035,0x9ba5ad,-.09,-.03,.018,silver);
leftSpoke.rotation.z=-.25;
const rightSpoke=box(steeringWheel,.18,.035,.035,0x9ba5ad,.09,-.03,.018,silver);
rightSpoke.rotation.z=.25;

// Centre badge
const badge=new THREE.Mesh(new THREE.CircleGeometry(.043,24),mat(0x2465a8,.3,.3));
badge.position.set(0,0,.047);steeringWheel.add(badge);

// Gear selector and centre tunnel
box(cockpit,.44,.14,.72,0x171b20,.27,.82,-.13,blackLeather);
box(cockpit,.24,.045,.23,0x30373d,.27,.92,-.14,silver);
box(cockpit,.10,.23,.12,0x11151a,.27,1.01,-.14);
const gearKnob=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),mat(0x3b4249,.22,.75));
gearKnob.position.set(.27,1.14,-.14);cockpit.add(gearKnob);
box(cockpit,.19,.025,.11,0x070a0d,.02,.91,.16);
box(cockpit,.19,.025,.11,0x070a0d,.49,.91,.16);

// Leather seats and door trim
for(const x of [-.53,.53]){
 box(cockpit,.53,.17,.58,0x161a1f,x,.7,.46,softLeather);
 box(cockpit,.53,.73,.18,0x242a30,x,1.09,.7,softLeather);
 box(cockpit,.36,.05,.05,0x4c555c,x,1.35,.59,silver);
}
for(const side of [-1,1]){
 box(cockpit,.075,.38,1.25,0x181d23,side*.87,.98,.23,blackLeather);
 box(cockpit,.085,.035,.52,0x727d85,side*.83,1.1,.23,silver);
 box(cockpit,.12,.10,.16,0x20262d,side*1.01,1.35,-.58);
 box(cockpit,.025,.045,.10,0x91d3ef,side*1.08,1.37,-.59);
}

// Rear-view mirror
box(cockpit,.29,.075,.055,0x0a0c0e,0,1.73,-.47);
box(cockpit,.24,.04,.018,0x9db8c5,0,1.73,-.435);

// Traffic vehicles
const traffic=[];
function makeTraffic(color,x,z){
 const g=new THREE.Group();
 box(g,1.7,.53,3.15,color,0,.57,0);
 box(g,1.35,.52,1.4,0x243a49,0,1.02,-.05);
 for(const side of [-1,1]){
  box(g,.28,.12,.08,0xfff1d1,side*.56,.61,-1.57);
  box(g,.28,.12,.08,0xff2929,side*.56,.61,1.57);
  wheel(g,side*.86,.36,-.98);
  wheel(g,side*.86,.36,.98);
 }
 g.position.set(x,0,z);scene.add(g);
 traffic.push({mesh:g,extra:Math.random()*2});
}
for(let i=0;i<9;i++){
 makeTraffic([0xd72626,0xe5e5e5,0x161b24,0xe8b72b,0x2b986f][i%5],
 [-5,-2.5,2.5,5][Math.floor(Math.random()*4)],-65-i*52);
}

// CONTROLS
let speed=0,distance=0,playerX=0,steering=0,steerVelocity=0,heading=0;
let gas=false,brake=false,left=false,right=false,crashed=false,flash=0,shake=0;
let interiorView=true;
const particles=[];
const $=id=>document.getElementById(id);

window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=true;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=true;
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")gas=true;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")brake=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=false;
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")gas=false;
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")brake=false;
});
function hold(id,set){
 const b=$(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();set(true);
  try{b.setPointerCapture(e.pointerId)}catch(_){}
 });
 const release=e=>{e.preventDefault();set(false)};
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",()=>set(false));
}
hold("left",v=>left=v);
hold("right",v=>right=v);
hold("gas",v=>gas=v);
hold("brake",v=>brake=v);

// CRASH EFFECT
function crashEffect(){
 for(let i=0;i<60;i++){
  const p=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.055,6,6),
   new THREE.MeshBasicMaterial({color:[0xff4c16,0xffd44a,0xffffff][i%3]}));
  p.position.set(playerX+(Math.random()-.5)*2,1+Math.random(),-1);
  scene.add(p);
  particles.push({mesh:p,v:new THREE.Vector3((Math.random()-.5)*9,Math.random()*7,(Math.random()-.5)*8),life:.6+Math.random()*.8});
 }
}
function crashGame(){
 if(crashed)return;
 crashed=true;speed=0;flash=.85;shake=.9;crashEffect();
 $("crash").style.display="flex";
}
$("restart").onclick=()=>{
 crashed=false;speed=0;distance=0;playerX=0;steering=0;steerVelocity=0;heading=0;flash=0;shake=0;
 car.position.set(0,0,0);car.rotation.set(0,0,0);
 traffic.forEach((t,i)=>{
  t.mesh.position.x=[-5,-2.5,2.5,5][i%4];
  t.mesh.position.z=-65-i*52;
 });
 particles.forEach(p=>scene.remove(p.mesh));particles.length=0;
 $("crash").style.display="none";
};
$("view").onclick=()=>{
 interiorView=!interiorView;
 $("view").textContent=interiorView?"🚘 EXTERIOR VIEW":"🧑 DRIVER VIEW";
};

// GAME LOOP
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const travel=speed/3.6;

 if(!crashed){
  if(gas)speed+=48*dt;else speed-=7*dt;
  if(brake)speed-=72*dt;
  speed=THREE.MathUtils.clamp(speed,0,240);

  const input=(right?1:0)-(left?1:0);
  steering+=(input-steering)*(1-Math.exp(-6*dt));
  steerVelocity+=steering*(1.6+speed/34)*dt;
  steerVelocity*=Math.exp(-3.0*dt);
  playerX+=steerVelocity*dt*Math.max(.8,speed/35);
  playerX=THREE.MathUtils.clamp(playerX,-6.25,6.25);

  const targetHeading=-steering*Math.min(speed/95,1)*.30;
  heading+=(targetHeading-heading)*(1-Math.exp(-4*dt));
  car.position.x+=(playerX-car.position.x)*(1-Math.exp(-8*dt));
  car.rotation.y=heading;
  steeringWheel.rotation.z=-steering*.65;

  // The road markings, roadside scenery and traffic move towards the car.
  const move=(.7+travel*1.6)*dt;
  for(const line of roadLines){
   line.position.z+=move;
   if(line.position.z>12)line.position.z-=680;
  }
  for(const t of traffic){
   t.mesh.position.z+=(.8+travel*1.35+t.extra)*dt;
   if(Math.abs(t.mesh.position.x-playerX)<1.65 &&
      Math.abs(t.mesh.position.z)<2.8 && speed>10){
    crashGame();break;
   }
   if(t.mesh.position.z>15){
    t.mesh.position.z=-440-Math.random()*150;
    t.mesh.position.x=[-5,-2.5,2.5,5][Math.floor(Math.random()*4)];
   }
  }
  for(const tree of roadside){
   tree.position.z+=move;
   if(tree.position.z>20)tree.position.z=-580-Math.random()*100;
  }
  for(const rail of rails){
   rail.position.z+=move;
   if(rail.position.z>15)rail.position.z-=680;
  }

  distance+=travel*dt;
  $("speed").textContent=Math.round(speed);
  $("distance").textContent=Math.floor(distance);

  // Drifting too far off the road slows the car and causes a crash at speed.
  if(Math.abs(playerX)>6.0 && speed>95){
   speed*=.985;
  }
 }else{
  speed=0;
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.life-=dt;p.v.y-=10*dt;p.mesh.position.addScaledVector(p.v,dt);
  if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1)}
 }
 flash=Math.max(0,flash-dt*2.5);
 shake=Math.max(0,shake-dt*2.8);
 $("flash").style.opacity=flash;

 // Camera: lowered driver-seat position.
 // Raise/lower 1.60 to change the driver's eye height.
 if(interiorView){
  cockpit.visible=true;
  exterior.visible=false;
  const offset=new THREE.Vector3(-.12,1.60,.02);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),heading);
  camera.position.set(
   car.position.x+offset.x+(Math.random()-.5)*shake,
   offset.y+(Math.random()-.5)*shake,
   offset.z
  );
  camera.rotation.order="YXZ";
  camera.rotation.y=heading;
  camera.rotation.x=0;
  camera.rotation.z=0;
 }else{
  cockpit.visible=false;
  exterior.visible=true;
  const desired=new THREE.Vector3(
   car.position.x+Math.sin(heading)*6,
   3.4,
   7.2
  );
  camera.position.lerp(desired,1-Math.exp(-4*dt));
  camera.lookAt(car.position.x,1,-5);
 }

 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
animate();
})();
</script>
</body>
</html>
