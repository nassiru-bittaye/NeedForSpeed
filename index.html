
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASSE Need For Speed</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:15px;left:15px;background:#101827dd;padding:15px;border-radius:12px}
#message{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;text-align:center}
#message h1{font-size:48px;color:#ff3434}
button{padding:12px 22px;border:0;border-radius:8px;background:#168cff;color:white;font-weight:bold}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:20px}
#controls button{font-size:23px;min-width:65px;background:#172a45dd}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <b>BMW M5 CS</b><br>
  SPEED: <span id="speed">0</span> KM/H<br>
  DISTANCE: <span id="distance">0</span> M
</div>
<div id="controls">
  <div>
    <button id="left">←</button>
    <button id="right">→</button>
  </div>
  <div>
    <button id="brake">BRAKE</button>
    <button id="gas">GAS</button>
  </div>
</div>
<div id="message">
  <div>
    <h1>GAME OVER</h1>
    <p>You crashed!</p>
    <button onclick="resetGame()">RESTART</button>
  </div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});
const speedText=document.getElementById("speed");
const distanceText=document.getElementById("distance");

let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

let car={x:0,speed:0};
let distance=0,roadOffset=0,gameOver=false;
let keys={};
let traffic=[];
let lastTime=0,spawnTimer=0;

function resetGame(){
  car={x:0,speed:0};
  distance=0;
  roadOffset=0;
  traffic=[];
  gameOver=false;
  document.getElementById("message").style.display="none";
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

function hold(id,key){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();keys[key]=true;
  });
  ["pointerup","pointerleave","pointercancel"].forEach(event=>{
    el.addEventListener(event,()=>keys[key]=false);
  });
}
hold("left","left");
hold("right","right");
hold("gas","gas");
hold("brake","brake");

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});
addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

function drawRoad(){
  ctx.fillStyle="#24472c";
  ctx.fillRect(0,0,W,H);

  const roadW=Math.min(W*.78,850);
  const roadX=(W-roadW)/2;

  ctx.fillStyle="#292d32";
  ctx.fillRect(roadX,0,roadW,H);

  ctx.fillStyle="#e8e8e8";
  ctx.fillRect(roadX+8,0,5,H);
  ctx.fillRect(roadX+roadW-13,0,5,H);

  ctx.strokeStyle="#eee";
  ctx.lineWidth=5;
  ctx.setLineDash([35,35]);
  ctx.lineDashOffset=-roadOffset;
  for(let i=1;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(roadX+roadW*i/3,0);
    ctx.lineTo(roadX+roadW*i/3,H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Simple city blocks instead of thousands of detailed objects.
  const blockSize=180;
  for(let y=-blockSize;y<H+blockSize;y+=blockSize){
    let yy=(y+roadOffset*.35)%(H+blockSize*2)-blockSize;
    ctx.fillStyle="#53616a";
    ctx.fillRect(roadX-125,yy,90,105);
    ctx.fillRect(roadX+roadW+35,yy,90,105);
    ctx.fillStyle="#a9c7db";
    for(let r=0;r<3;r++){
      for(let c=0;c<2;c++){
        ctx.fillRect(roadX-110+c*38,yy+15+r*25,16,12);
        ctx.fillRect(roadX+roadW+50+c*38,yy+15+r*25,16,12);
      }
    }
  }
  return {roadX,roadW};
}

function drawBMW(x,y,w,h){
  ctx.save();
  ctx.translate(x,y);

  // Dark green BMW-style performance sedan.
  ctx.fillStyle="#102c22";
  ctx.beginPath();
  ctx.roundRect(-w/2+3,-h/2+5,w-6,h-10,12);
  ctx.fill();

  ctx.fillStyle="#164b37";
  ctx.beginPath();
  ctx.roundRect(-w/2,-h/2,w,h,12);
  ctx.fill();

  ctx.fillStyle="#15232b";
  ctx.beginPath();
  ctx.roundRect(-w*.36,-h*.32,w*.72,h*.29,8);
  ctx.fill();

  ctx.fillStyle="#a9d8ec";
  ctx.fillRect(-w*.36,-h*.31,w*.72,5);

  ctx.fillStyle="#df2727";
  ctx.fillRect(-w*.43,h*.34,w*.2,6);
  ctx.fillRect(w*.23,h*.34,w*.2,6);

  ctx.fillStyle="#bbb";
  ctx.fillRect(-w*.39,h*.43,w*.17,4);
  ctx.fillRect(w*.22,h*.43,w*.17,4);

  ctx.restore();
}

function spawnTraffic(road){
  const lane=Math.floor(Math.random()*3);
  traffic.push({
    x:road.roadX+road.roadW*(lane+.5)/3,
    y:-100,
    speed:50+Math.random()*90,
    color:["#e8e8e8","#c62828","#2367ad","#222222"][Math.floor(Math.random()*4)]
  });
}

function loop(now){
  if(gameOver)return;
  const dt=Math.min((now-lastTime)/1000,.04);
  lastTime=now;

  if(keys.gas||keys.w||keys.arrowup)
    car.speed=Math.min(car.speed+105*dt,240);
  else
    car.speed=Math.max(0,car.speed-25*dt);

  if(keys.brake||keys.s||keys.arrowdown)
    car.speed=Math.max(0,car.speed-190*dt);

  if(keys.left||keys.a||keys.arrowleft)car.x-=340*dt;
  if(keys.right||keys.d||keys.arrowright)car.x+=340*dt;

  car.x=Math.max(-1,Math.min(1,car.x));

  roadOffset+=car.speed*dt*.65;
  distance+=car.speed*dt/3.6;

  const road=drawRoad();
  const playerX=road.roadX+road.roadW/2+car.x*road.roadW*.31;
  const playerY=H*.78;

  spawnTimer-=dt;
  if(spawnTimer<=0&&traffic.length<7){
    spawnTraffic(road);
    spawnTimer=1.5;
  }

  for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i];
    t.y+=(car.speed-t.speed)*dt*2.1+90*dt;

    ctx.fillStyle=t.color;
    ctx.fillRect(t.x-23,t.y-42,46,84);
    ctx.fillStyle="#111";
    ctx.fillRect(t.x-17,t.y-24,34,23);
    ctx.fillStyle="#ff3030";
    ctx.fillRect(t.x-19,t.y+30,10,5);
    ctx.fillRect(t.x+9,t.y+30,10,5);

    if(Math.abs(t.x-playerX)<39&&Math.abs(t.y-playerY)<65){
      gameOver=true;
      document.getElementById("message").style.display="flex";
    }
    if(t.y>H+100||t.y<-200)traffic.splice(i,1);
  }

  drawBMW(playerX,playerY,62,112);

  speedText.textContent=Math.round(car.speed);
  distanceText.textContent=Math.round(distance);

  requestAnimationFrame(loop);
}

requestAnimationFrame(t=>{
  lastTime=t;
  loop(t);
});
</script>
</body>
</html>
