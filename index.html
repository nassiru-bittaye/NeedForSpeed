// Faster acceleration
const acceleration = 95;
const maxSpeed = 320;
const braking = 150;

if (keys.w || keys.ArrowUp) {
    speed += acceleration * dt;
} else if (keys.s || keys.ArrowDown) {
    speed -= braking * dt;
} else {
    speed -= 18 * dt;
}

speed = Math.max(0, Math.min(maxSpeed, speed));
