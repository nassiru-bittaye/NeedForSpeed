
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMW Driving Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87bde8;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;top:14px;left:16px;z-index:2;font-size:22px;font-weight:bold;line-height:1.5;text-shadow:2px 2px 4px #000;pointer-events:none}
#view{position:fixed;top:14px;right:14px;z-index:3;padding:12px;border:1px solid #aaa;border-radius:10px;background:#111c;color:white}
#controls{position:fixed;bottom:40px;left:16px;right:16px;z-index:3;display:flex;justify-content:space-between}
.group{display:flex;gap:10px}
.control{width:64px;height:64px;border:2px solid #ddd;border-radius:15px;background:#101b;color:white;font-size:27px;touch-action:none}
#help{position:fixed;bottom:7px;left:0;right:0;text-align:center;font-size:12px;text-shadow:1px 1px 4px #000;pointer-events:none}
#error{display:none;position:fixed;inset:0;padding:25px;background:#111;color:white;z-index:10}
@media(max-width:500px){#hud{font-size:17px}.control{width:55px;height:55px}}
</style>
</head>
<body>
<div id="hud">SPEED: <span id="speed">0</span> KM/H<br>DISTANCE: <span id="distance">0</span> M</div>
<button id="view">🚘 EXTERIOR VIEW</button>
<div id="controls">
 <div class="group"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div>
 <div class="group"><button class="control" id="brake">▼</button><button class="control" id="gas">▲</button></div>
</div>
<div id="help">A / ← LEFT · D / → RIGHT · W / ↑ ACCELERATE · S / ↓ BRAKE</div>
<div id="error">The game could not load. Check your internet connection and refresh.</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
if(!window.THREE){document.getElementById('error').style.display='block';return}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cafa);
scene.fog=new THREE.Fog(0x91cafa,100,350);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe7f4ff,0x524a3b,2));
const sun=new THREE.DirectionalLight(0xffedcf,2.2);
sun.position.set(-30,60,-20);
scene.add(sun);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x303238),paint=mat(0xf5f1e5),yellow=mat(0xffcf55);
const grass=mat(0x527b40),bark=mat(0x60442d),leaves=mat(0x245034);
const black=mat(0x090c12,.32),leather=mat(0x171a20),silver=mat(0x9ba8b3,.25,.7);
const blue=mat(0x167bc8,.3,.35),glass=mat(0x1b3448,.3,.2);

function box(parent,w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);parent.add(o);return o;
}

// The world is generated from a curved road centreline.
// All scenery is placed relative to the road, not moved sideways by steering.
const world=new THREE.Group();
scene.add(world);

const curveAmount=0.0016;
function roadX(z){
 return 24*Math.sin((z+100)*curveAmount)-24*Math.sin(100*curveAmount);
}
function roadHeading(z){
 return Math.atan(24*curveAmount*Math.cos((z+100)*curveAmount));
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1800),grass);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.14,-700);
world.add(ground);

// Road surface built from short segments that follow the same curve.
const roadSegments=[];
const lines=[];
const edgeLines=[];
const roadside=[];
const trees=[];

for(let z=100;z>-1500;z-=8){
 const x=roadX(z);
 const angle=roadHeading(z);
 const segment=new THREE.Mesh(new THREE.PlaneGeometry(13,9),asphalt);
 segment.rotation.x=-Math.PI/2;
 segment.rotation.z=0;
 segment.position.set(x,-.04,z);
 segment.rotation.y=-angle;
 world.add(segment);
 roadSegments.push(segment);

 if(Math.round(z/8)%2===0){
  const line=box(world,.14,.025,4.3,paint,x,.015,z);
  line.rotation.y=-angle;
  lines.push(line);
 }

 for(const side of [-1,1]){
  const edge=box(world,.10,.025,8,yellow,x+side*6.15,.012,z);
  edge.rotation.y=-angle;
  edgeLines.push(edge);
 }
}

// Guardrail posts and trees follow the road centreline.
for(let z=100;z>-1500;z-=9){
 const x=roadX(z),angle=roadHeading(z);
 for(const side of [-1,1]){
  const rail=box(world,.13,.18,9,silver,x+side*7,.88,z);
  rail.rotation.y=-angle;
  roadside.push(rail);

  const post=box(world,.12,.85,.14,silver,x+side*7,.4,z);
  roadside.push(post);
 }
}

function makeTree(x,y,z,s){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,2,7),bark);
 trunk.position.y=1;g.add(trunk);
 for(let i=0;i<3;i++){
  const crown=new THREE.Mesh(new THREE.ConeGeometry(1-i*.18,2.1,7),leaves);
  crown.position.y=2+i*.78;g.add(crown);
 }
 g.position.set(x,y,z);g.scale.setScalar(s);
 world.add(g);trees.push(g);
}
for(let z=100;z>-1450;z-=13){
 const cx=roadX(z);
 for(const side of [-1,1]){
  makeTree(cx+side*(10+Math.random()*19),0,z,.8+Math.random()*1.3);
 }
}

// BMW-style cockpit stays attached to the camera.
const cockpit=new THREE.Group();
scene.add(cockpit);
box(cockpit,2.35,.25,.72,leather,0,.77,-1.03);
box(cockpit,2.25,.05,.52,black,0,.92,-1.02);
box(cockpit,2.2,.035,.08,silver,0,.66,-1.30);
box(cockpit,2,.018,.025,blue,0,.69,-1.34);

// Instrument cluster
box(cockpit,.76,.34,.05,black,-.48,1,-1.23);
box(cockpit,.67,.25,.015,mat(0x071725),-.48,1,-1.198);
for(const x of [-.68,-.28]){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.12,.015,8,36),blue);
 ring.position.set(x,1,-1.18);cockpit.add(ring);
}
box(cockpit,.72,.33,.045,black,.56,1,-1.23);
box(cockpit,.65,.25,.015,mat(0x102638),.56,1,-1.198);
box(cockpit,.025,.20,.01,blue,.53,1,-1.185);
for(let i=0;i<5;i++)box(cockpit,.10,.012,.01,silver,.68,1.08-i*.035,-1.18);

// Vents, trim and gear selector
box(cockpit,.72,.12,.06,black,.52,.72,-1.27);
for(let i=0;i<7;i++)box(cockpit,.07,.012,.01,silver,.25+i*.09,.72,-1.235);
const hazard=new THREE.Mesh(new THREE.ConeGeometry(.055,.08,3),mat(0xe52c36));
hazard.position.set(.52,.62,-1.27);hazard.rotation.z=Math.PI;cockpit.add(hazard);
box(cockpit,.4,.12,.4,black,.72,.48,-.56);
box(cockpit,.08,.23,.08,silver,.72,.62,-.62);
const knob=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),black);
knob.position.set(.72,.75,-.62);cockpit.add(knob);

// Steering wheel
const steering=new THREE.Group();
steering.position.set(-.48,.94,-.59);cockpit.add(steering);
const rim=new THREE.Mesh(new THREE.TorusGeometry(.36,.045,12,64),black);
steering.add(rim);
box(steering,.07,.47,.065,black,0,0,0);
box(steering,.47,.07,.065,black,0,-.06,0);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.075,32),silver);
hub.rotation.x=Math.PI/2;hub.position.z=.02;steering.add(hub);
const logo=new THREE.Mesh(new THREE.CircleGeometry(.10,32),blue);
logo.position.z=.062;steering.add(logo);

// Windshield frame and mirrors
box(cockpit,.13,1.25,.17,black,-1.05,1.43,-1.8);
box(cockpit,.13,1.25,.17,black,1.05,1.43,-1.8);
box(cockpit,2.2,.15,.35,black,0,2.12,-1.62);
for(const x of [-1.2,1.2]){
 box(cockpit,.32,.13,.07,black,x,1.23,-1.55);
 box(cockpit,.25,.075,.018,glass,x,1.23,-1.59);
}
box(cockpit,.22,.28,1.1,leather,-1.08,.64,-.5);
box(cockpit,.22,.28,1.1,leather,1.08,.64,-.5);

// Traffic cars are placed on the road's centreline.
const traffic=[];
function makeCar(color,lane,z){
 const g=new THREE.Group();
 box(g,1.45,.48,2.6,mat(color,.3,.25),0,.53,0);
 box(g,1.1,.45,1.12,glass,0,.96,-.1);
 box(g,1.12,.10,.08,mat(0xff2525),0,.59,1.32);
 for(const wx of [-.75,.75])for(const wz of [-.8,.8]){
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.14,16),black);
  tire.rotation.z=Math.PI/2;tire.position.set(wx,.27,wz);g.add(tire);
 }
 world.add(g);
 traffic.push({g,lane,z,speed:.7+Math.random()*1.3});
}
makeCar(0xd2d7dc,2.6,-35);
makeCar(0x202833,-2.5,-58);
makeCar(0x9d3027,2.5,-95);
makeCar(0xe1d9c9,-2.5,-135);
makeCar(0x245182,2.6,-180);

// Exterior car model
const exterior=new THREE.Group();
scene.add(exterior);
box(exterior,1.9,.55,4,blue,0,.65,0);
box(exterior,1.4,.55,1.8,glass,0,1.12,-.2);
for(const x of [-.98,.98])for(const z of [-1.25,1.25]){
 const tire=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,20),black);
 tire.rotation.z=Math.PI/2;tire.position.set(x,.35,z);exterior.add(tire);
}
exterior.visible=false;

// Input
const held={left:false,right:false,gas:false,brake:false};
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function bind(id,name){
 const b=document.getElementById(id);
 const down=e=>{e.preventDefault();held[name]=true};
 const up=e=>{e.preventDefault();held[name]=false};
 b.addEventListener('pointerdown',down);
 b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);
 b.addEventListener('pointerleave',up);
}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');

let outside=false;
document.getElementById('view').onclick=()=>{
 outside=!outside;
 cockpit.visible=!outside;
 exterior.visible=outside;
 document.getElementById('view').textContent=outside?'👤 DRIVER VIEW':'🚘 EXTERIOR VIEW';
};

// Driving state
let speed=0,distance=0;
let steer=0,heading=0;
let playerZ=0;

// Fixed driver-seat camera; rotate it to match the road direction.
camera.position.set(0,1.52,.12);

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);

 const gas=held.gas||keys.w||keys.arrowup;
 const brake=held.brake||keys.s||keys.arrowdown;
 const left=held.left||keys.a||keys.arrowleft;
 const right=held.right||keys.d||keys.arrowright;

 if(gas)speed+=27*dt;
 else speed-=2.8*dt;
 if(brake)speed-=48*dt;
 speed=THREE.MathUtils.clamp(speed,0,200);

 const v=speed/3.6;
 const steerInput=(left?1:0)-(right?1:0);

 // Progressive steering: gentle at low speed, responsive at cruising speed.
 steer=THREE.MathUtils.lerp(steer,steerInput,1-Math.exp(-5*dt));
 const turnRate=steer*(0.12+Math.min(v/22,1)*0.48);
 heading+=turnRate*dt;

 // Follow the curved road centreline. The steering adjusts heading gradually.
 playerZ-=v*dt;
 distance+=v*dt;

 // Move the road world opposite to the player's travel.
 // Road geometry is curved independently, so it stays continuous.
 world.position.z=-playerZ;
 world.position.x=0;

 // Camera follows road heading without shifting sideways.
 const roadAngle=roadHeading(playerZ);
 camera.position.set(0,1.52,.12);
 camera.rotation.order='YXZ';
 camera.rotation.y=-(heading+roadAngle);
 camera.rotation.x=0;
 camera.rotation.z=0;

 // Wheel animation follows steering.
 steering.rotation.z=-steer*.52;

 // Traffic stays aligned to the curved road.
 traffic.forEach(c=>{
  c.z+=v*dt;
  if(c.z>playerZ+18){
   c.z=playerZ-150-Math.random()*150;
   c.lane=(Math.random()>.5?1:-1)*(2.4+Math.random()*.3);
  }
  c.g.position.set(roadX(c.z)+c.lane,0,c.z);
  c.g.rotation.y=-roadHeading(c.z);
 });

 // Keep the world moving forward smoothly.
 document.getElementById('speed').textContent=Math.round(speed);
 document.getElementById('distance').textContent=Math.floor(distance);

 if(outside){
  exterior.position.set(roadX(playerZ),0,playerZ);
  exterior.rotation.y=-roadHeading(playerZ)-heading;
  camera.position.set(
   roadX(playerZ)+Math.sin(heading+roadAngle)*-7,
   4.2,
   playerZ+7
  );
  camera.lookAt(roadX(playerZ),1,playerZ-15);
 }

 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
animate();
})();
</script>
</body>
</html>
