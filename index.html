
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMW M5 CS - Realistic City</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8ba9bf;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:18px;left:18px;color:white;z-index:5;text-shadow:0 2px 5px #000}
#title{font-size:19px;color:#b7e7c5;font-weight:bold;letter-spacing:2px}
#speed{font-size:38px;font-weight:bold}
#status{font-size:13px}
#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:white;background:#000b;padding:12px 18px;border-radius:12px;font-size:13px;text-align:center;z-index:5}
#gameover{display:none;position:fixed;inset:0;background:#000c;z-index:10;color:white;align-items:center;justify-content:center;text-align:center}
#gameover h1{font-size:52px;color:#ff3434}
#gameover button{background:#168c43;color:white;border:0;padding:15px 30px;border-radius:8px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="hud">
 <div id="title">BMW M5 CS</div>
 <div><span id="speed">0</span> KM/H</div>
 <div id="status">READY TO DRIVE</div>
</div>
<div id="help">W / ↑ ACCELERATE · S / ↓ BRAKE · A / D OR ← / → TURN · SPACE HANDBRAKE</div>
<div id="gameover">
 <div><h1>CRASHED!</h1><p>Your BMW has crashed.</p><button onclick="location.reload()">DRIVE AGAIN</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML='<h2 style="color:white;padding:30px">Connect to the internet to load the 3D game.</h2>';
 throw new Error("Three.js failed");
}

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b8d1);
scene.fog=new THREE.Fog(0x91b8d1,120,620);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.shadowMap.enabled=false;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe6f3ff,0x555044,2));
const sun=new THREE.DirectionalLight(0xffffff,1.8);
sun.position.set(-60,100,50);
scene.add(sun);

function mat(color,roughness=.7,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
const green=mat(0x123d2b,.25,.7);
const darkGreen=mat(0x09251b,.3,.6);
const black=mat(0x090b0c,.4,.2);
const rubber=mat(0x080808,.9);
const chrome=mat(0xb9c2c5,.25,.85);
const glass=mat(0x243b4b,.2,.5);
const white=mat(0xffffff,.2);
const red=new THREE.MeshStandardMaterial({color:0xff2020,emissive:0x990000,emissiveIntensity:1});
const headlights=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x9ecfff,emissiveIntensity:1.8});

function box(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);parent.add(m);return m;
}
function sphere(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),material);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m;
}

// BMW
const car=new THREE.Group();
scene.add(car);

box(car,0,.95,0,2.05,.65,4.45,green);
sphere(car,0,1.12,-1.45,1.02,.4,.85,green);
box(car,0,1.12,1.75,2.08,.48,.75,green);
box(car,0,.73,-2.17,2.08,.4,.35,darkGreen);
box(car,0,.65,-2.38,1.65,.16,.12,black);
box(car,0,.48,-2.4,1.95,.07,.35,black);

// Kidney grille
for(const s of [-1,1]){
 box(car,s*.32,.96,-2.39,.48,.42,.09,chrome);
 box(car,s*.32,.96,-2.45,.40,.34,.07,black);
 for(let i=0;i<5;i++)box(car,s*.32,.80+i*.075,-2.50,.37,.018,.025,chrome);
 box(car,s*.76,1.13,-2.28,.55,.20,.13,headlights);
 for(let i=0;i<2;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.075,.018,6,16),white);
  ring.position.set(s*.76+(i-.5)*.20,1.14,-2.37);car.add(ring);
 }
 box(car,s*.55,1.31,-1.45,.035,.018,1.15,darkGreen);
 box(car,s*.83,1.68,.05,.035,.52,1.65,black);
 sphere(car,s*1.13,1.58,-.60,.22,.12,.25,green);
 box(car,s*1.03,1.53,-.60,.18,.07,.10,black);
 box(car,s*1.04,.99,.15,.025,.42,1.65,darkGreen);
 box(car,s*1.06,1.20,.40,.025,.035,.25,chrome);
 box(car,s*1.02,.54,.05,.13,.13,2.6,black);
 box(car,s*.72,1.15,2.25,.48,.20,.12,red);
 const exhaust=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.12,16),chrome);
 exhaust.rotation.z=Math.PI/2;exhaust.position.set(s*.67,.55,2.43);car.add(exhaust);
 box(car,s*.62,1.59,1.95,.07,.22,.10,black);
}
box(car,0,1.68,.15,1.65,.78,2.15,glass);
box(car,0,2.08,.12,1.55,.13,1.45,green);
box(car,0,.72,2.28,2.08,.35,.32,darkGreen);
box(car,0,.47,2.30,1.7,.10,.3,black);
box(car,0,1.70,1.95,1.8,.09,.40,black);

const wheels=[];
for(const x of [-1.04,1.04]){
 for(const z of [-1.4,1.4]){
  const g=new THREE.Group();g.position.set(x,.62,z);car.add(g);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,20),rubber);
  tire.rotation.z=Math.PI/2;g.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.30,.30,.27,20),chrome);
  rim.rotation.z=Math.PI/2;g.add(rim);
  for(let i=0;i<8;i++){
   const a=i*Math.PI/4;
   const spoke=box(g,0,Math.cos(a)*.18,Math.sin(a)*.18,.26,.04,.04,chrome);
   spoke.rotation.x=a;
  }
  wheels.push(g);
 }
}

// MOVING WORLD
const world=new THREE.Group();
scene.add(world);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1600),mat(0x414943));
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.12,-650);
world.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(22,1600),mat(0x25282a));
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-650);
world.add(road);

// Road edges
for(const x of [-10.7,10.7]){
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,1600),mat(0xe7e1c9));
 edge.position.set(x,.04,-650);world.add(edge);
}

// Sidewalks
for(const x of [-13,13]){
 const sidewalk=new THREE.Mesh(new THREE.BoxGeometry(3,.22,1600),mat(0x888984));
 sidewalk.position.set(x,.02,-650);world.add(sidewalk);
}

// Sidewalk tile lines
const tileMat=mat(0x666966);
for(let z=-1200;z<100;z+=5){
 for(const x of [-14.3,14.3]){
  box(world,x,.14,z,.025,.015,4.7,tileMat);
 }
}

// Lane markings
const markings=[];
const laneMat=mat(0xe9e6d6);
for(let z=-1300;z<100;z+=17){
 for(const x of [-3,3]){
  const line=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,7),laneMat);
  line.position.set(x,.035,z);world.add(line);markings.push(line);
 }
}

// Crosswalks and intersections
const intersections=[];
const crosswalkMat=mat(0xe6e3d8);
function createIntersection(z){
 const g=new THREE.Group();
 g.position.z=z;
 // Side street across the city
 const crossRoad=new THREE.Mesh(new THREE.BoxGeometry(80,.025,15),mat(0x292c2d));
 crossRoad.position.set(0,.015,0);g.add(crossRoad);

 for(let side of [-1,1]){
  for(let i=0;i<8;i++){
   const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.5,.035,.7),crosswalkMat);
   stripe.position.set(-5+i*1.5,.04,side*7);
   g.add(stripe);
  }
 }
 // Roadside stop lines
 for(let side of [-1,1]){
  const line=new THREE.Mesh(new THREE.BoxGeometry(22,.035,.2),crosswalkMat);
  line.position.set(0,.04,side*5);g.add(line);
 }
 world.add(g);intersections.push(g);
}
for(let i=0;i<7;i++)createIntersection(-i*190-80);

// BUILDINGS
const buildingColors=[
 0x78848a,0x53616b,0x9b9182,0x354956,
 0x77736b,0x46545b,0x9b9b94,0x3a4551
].map(c=>mat(c,.75,.12));

const glassMats=[
 mat(0x243e50,.22,.5),
 mat(0x506b7a,.2,.5),
 mat(0x344c5c,.2,.5),
 mat(0x9cabb0,.25,.35)
];

const shopColors=[0x344d5b,0x64513e,0x425b4b,0x6a4140].map(c=>mat(c,.7,.1));
const windowLight=new THREE.MeshStandardMaterial({
 color:0xffdf9b,emissive:0x6e4a1d,emissiveIntensity:.4
});

const cityChunks=[];
const temp=new THREE.Object3D();

function makeBuilding(group,x,z,width,height,depth,kind){
 const b=new THREE.Group();
 b.position.set(x,0,z);
 const color=buildingColors[Math.floor(Math.random()*buildingColors.length)];

 // Building body
 const body=box(b,0,height/2,0,width,height,depth,color);

 // Glass tower façade or regular windows
 const frontMat=kind===2?glassMats[Math.floor(Math.random()*glassMats.length)]:color;
 if(kind===2){
  box(b,0,height/2,-depth/2-.035,width*.86,height*.9,.05,frontMat);
  for(let y=2;y<height-1;y+=2.8){
   box(b,0,y,-depth/2-.075,width*.88,.055,.035,chrome);
  }
  for(let xx=-width/2+1;xx<width/2;xx+=2.3){
   box(b,xx,height/2,-depth/2-.075,.045,height*.9,.035,chrome);
  }
 }else{
  for(let y=2.3;y<height-1;y+=3.1){
   for(let xx=-width/2+1.1;xx<width/2-0.5;xx+=2.5){
    const window=box(b,xx,y,-depth/2-.045,1.05,1.25,.06,
     Math.random()>.3?glassMats[0]:windowLight);
   }
  }
 }

 // Rooftop details
 if(height>24){
  box(b,0,height+.5,0,width*.35,1,depth*.4,mat(0x555a5b));
  box(b,width*.28,height+1,0,.5,2,.5,mat(0x555a5b));
 }

 // Shops on shorter buildings
 if(kind===1){
  box(b,0,1.8,-depth/2-.09,width*.9,2.8,.08,shopColors[Math.floor(Math.random()*shopColors.length)]);
  box(b,0,3.35,-depth/2-.15,width*.9,.35,.16,windowLight);
  box(b,0,4.1,-depth/2-.10,width*.9,.15,.12,chrome);
 }

 group.add(b);
}

function makeTree(group,x,z,scale=1){
 const tree=new THREE.Group();
 tree.position.set(x,0,z);
 const trunk=box(tree,0,1.1,0,.25,2.2,.25,mat(0x60452c));
 sphere(tree,0,3.0,0,1.1,1.3,1.0,mat(0x315b38));
 sphere(tree,.55,3.35,.1,.75,.9,.75,mat(0x3b7042));
 sphere(tree,-.5,3.25,-.15,.8,.9,.8,mat(0x416d40));
 tree.scale.setScalar(scale);
 group.add(tree);
}

function makePark(group,x,z){
 const grass=new THREE.Mesh(new THREE.BoxGeometry(9,.12,25),mat(0x416c43));
 grass.position.set(x,.06,z);group.add(grass);
 for(let i=0;i<4;i++){
  makeTree(group,x+(Math.random()-.5)*6,z-10+i*6,.8+Math.random()*.4);
 }
}

function makeCarParked(group,x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 const color=mat([0x333c43,0xd8d8d0,0x7d2828,0x243e35][Math.floor(Math.random()*4)],.35,.3);
 box(g,0,.7,0,1.7,.55,3.3,color);
 box(g,0,1.15,.1,1.4,.55,1.6,glass);
 for(let side of [-1,1]){
  for(let zz of [-1,1]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.16,12),rubber);
   w.rotation.z=Math.PI/2;w.position.set(side*.85,.35,zz);g.add(w);
  }
 }
 group.add(g);
}

function createCityChunk(z){
 const group=new THREE.Group();
 group.position.z=z;

 for(const side of [-1,1]){
  // Building variety along both sides
  makeBuilding(group,side*23,-5,12,24+Math.random()*25,14,Math.random()>.55?2:0);
  makeBuilding(group,side*39,-22,13,10+Math.random()*8,13,1);
  makeBuilding(group,side*24,-35,12,18+Math.random()*40,14,Math.random()>.5?2:0);

  // Park sections and trees
  if(Math.random()>.35){
   makePark(group,side*15,-18);
  }else{
   makeTree(group,side*15,-12,1);
   makeTree(group,side*16,-29,.85);
  }

  // Parked cars near the curb
  if(Math.random()>.35)makeCarParked(group,side*12,-5);
 }

 // Street corner signs
 for(const side of [-1,1]){
  const sign=box(group,side*11,2.1,-34,.09,4,.09,mat(0x444444));
  const board=box(group,side*11,4.1,-34,.8,.65,.08,mat(0x27704a));
  box(group,side*11,4.1,-34,.65,.04,.10,white);
 }

 world.add(group);
 cityChunks.push(group);
}

for(let i=0;i<28;i++)createCityChunk(-i*48);

// STREETLIGHTS
const lampMat=mat(0x353839,.4,.7);
const bulbMat=new THREE.MeshStandardMaterial({color:0xffe5aa,emissive:0x99733c,emissiveIntensity:.5});
const lamps=[];
for(let z=-1200;z<100;z+=55){
 for(const side of [-1,1]){
  const g=new THREE.Group();
  g.position.set(side*12,0,z);
  box(g,0,3,0,.13,6,.13,lampMat);
  box(g,-side*.8,6,0,1.6,.12,.12,lampMat);
  sphere(g,-side*1.4,5.9,0,.17,.12,.17,bulbMat);
  world.add(g);lamps.push(g);
 }
}

// TRAFFIC LIGHTS
const trafficLights=[];
function makeTrafficLight(z){
 const g=new THREE.Group();
 g.position.z=z;
 for(const side of [-1,1]){
  box(g,side*11,4,0,.13,8,.13,lampMat);
  box(g,side*11,7,0,.65,1.5,.4,black);
  sphere(g,side*11,7.45,-.22,.14,.14,.06,red);
  sphere(g,side*11,7,-.22,.14,.14,.06,windowLight);
  sphere(g,side*11,6.55,-.22,.14,.14,.06,mat(0x3cbd66));
 }
 world.add(g);trafficLights.push(g);
}
for(let i=0;i<7;i++)makeTrafficLight(-i*190-80);

// TRAFFIC
const traffic=[];
const trafficColors=[0x202a35,0xeeeeee,0x9e2020,0x303030,0xaaaaaa].map(c=>mat(c,.35,.4));

function createTraffic(z,x){
 const g=new THREE.Group();
 const color=trafficColors[Math.floor(Math.random()*trafficColors.length)];
 box(g,0,.75,0,1.8,.55,3.8,color);
 box(g,0,1.25,.1,1.5,.7,1.9,glass);
 for(const side of [-1,1]){
  for(const zz of [-1.2,1.2]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,12),rubber);
   w.rotation.z=Math.PI/2;w.position.set(side*.92,.38,zz);g.add(w);
  }
  box(g,side*.55,.8,-1.95,.35,.13,.05,white);
  box(g,side*.55,.8,1.95,.35,.13,.05,red);
 }
 g.position.set(x,0,z);
 world.add(g);traffic.push(g);
}
for(let i=0;i<12;i++)createTraffic(-55-i*85,[-7,-3,3,7][i%4]);

// CONTROLS
const keys={};
let speed=0,playerX=0,steer=0,gameOver=false,shake=0;
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

const speedText=document.getElementById("speed");
const statusText=document.getElementById("status");
const particles=[];

function crash(){
 if(gameOver)return;
 gameOver=true;speed=0;shake=1.5;
 statusText.textContent="CRASHED";
 document.getElementById("gameover").style.display="flex";
 const sparkMat=new THREE.MeshBasicMaterial({color:0xffa52a});
 for(let i=0;i<28;i++){
  const p=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),sparkMat);
  p.position.set(playerX+(Math.random()-.5)*2,1+Math.random()*1.5,(Math.random()-.5)*2);
  p.userData.velocity=new THREE.Vector3((Math.random()-.5)*10,Math.random()*8,(Math.random()-.5)*10);
  scene.add(p);particles.push(p);
 }
}

// GAME LOOP
let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.035);
 previous=now;

 if(!gameOver){
  const accelerating=keys.w||keys.arrowup;
  const braking=keys.s||keys.arrowdown;
  const left=keys.a||keys.arrowleft;
  const right=keys.d||keys.arrowright;

  if(accelerating)speed=Math.min(speed+45*dt,230);
  else speed=Math.max(0,speed-8*dt);
  if(braking)speed=Math.max(0,speed-95*dt);
  if(keys[" "])speed=Math.max(0,speed-55*dt);

  // Responsive steering
  const steerInput=(right?1:0)-(left?1:0);
  steer+=steerInput*4.2*dt;
  steer*=Math.pow(.88,dt*60);
  playerX+=steer*(2.4+speed/230*3.5)*dt;
  playerX=Math.max(-8.4,Math.min(8.4,playerX));

  car.position.x=playerX;
  car.rotation.z=-steer*.12;
  car.rotation.y=-steer*.10;
  wheels.forEach(w=>w.rotation.x-=speed*dt*.035);

  // Scroll the complete city and road toward the player.
  const movement=speed*dt*.85;
  markings.forEach(m=>{
   m.position.z+=movement;
   if(m.position.z>15)m.position.z-=1400;
  });
  cityChunks.forEach(c=>{
   c.position.z+=movement;
   if(c.position.z>65)c.position.z-=28*48;
  });
  lamps.forEach(l=>{
   l.position.z+=movement;
   if(l.position.z>35)l.position.z-=1300;
  });
  intersections.forEach(g=>{
   g.position.z+=movement;
   if(g.position.z>40)g.position.z-=7*190;
  });
  trafficLights.forEach(g=>{
   g.position.z+=movement;
   if(g.position.z>40)g.position.z-=7*190;
  });

  traffic.forEach(t=>{
   t.position.z+=movement*.85;
   if(t.position.z>18){
    t.position.z=-1150-Math.random()*200;
    t.position.x=[-7,-3,3,7][Math.floor(Math.random()*4)];
   }
   if(Math.abs(t.position.z)<3.1&&Math.abs(t.position.x-playerX)<1.8)crash();
  });

  if(Math.abs(playerX)>8.25)crash();

  speedText.textContent=Math.round(speed);
  statusText.textContent=speed>170?"HIGH SPEED":speed>90?"FAST DRIVING":speed>5?"DRIVING":"READY TO DRIVE";
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.position.addScaledVector(p.userData.velocity,dt);
  p.userData.velocity.y-=14*dt;
  p.scale.multiplyScalar(.96);
  if(p.position.y<0){
   scene.remove(p);particles.splice(i,1);
  }
 }

 camera.position.lerp(new THREE.Vector3(playerX*.45,4.3,9),1-Math.pow(.001,dt));
 camera.lookAt(playerX*.3,1,-9);

 if(shake>0){
  camera.position.x+=(Math.random()-.5)*shake;
  camera.position.y+=(Math.random()-.5)*shake;
  shake=Math.max(0,shake-dt*2);
 }

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
});
</script>
</body>
</html>
