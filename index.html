
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW City Drive</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;top:18px;left:18px;z-index:2;font-size:20px;text-shadow:0 2px 5px #000}
#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0009;padding:12px 18px;border-radius:10px;text-align:center}
#gameover{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;flex-direction:column}
#gameover h1{font-size:48px;color:#ff4444}
button{padding:14px 25px;font-size:18px;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="hud">SPEED: <span id="speed">0</span> KM/H</div>
<div id="help">W / ↑ Accelerate · S / ↓ Brake · A D / ← → Steer</div>
<div id="gameover">
<h1>CRASH!</h1>
<p>Your BMW has crashed.</p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (!window.THREE) {
 document.body.innerHTML = "Three.js could not load. Check your internet connection and refresh.";
 throw new Error("Three.js failed to load");
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9df);
scene.fog = new THREE.Fog(0x87b9df, 100, 650);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,6,13);

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff,0x39434c,2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(-30,60,20);
scene.add(sun);

const mat=(color,roughness=0.8)=>new THREE.MeshStandardMaterial({color,roughness});
const roadMat=mat(0x25282c),lineMat=mat(0xffffff),greenMat=mat(0x123d29),glassMat=mat(0x172b39,0.25);
const darkMat=mat(0x111315),rubberMat=mat(0x090909),lampMat=mat(0xffffdd);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),mat(0x496b42));
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.12;
scene.add(ground);

const world=new THREE.Group();
scene.add(world);

const road=new THREE.Mesh(new THREE.PlaneGeometry(18,1600),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-650);
world.add(road);

for(let z=20;z>-1400;z-=12){
 for(let x of [-3,3]){
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,5),lineMat);
  stripe.position.set(x,.03,z);
  world.add(stripe);
 }
}

function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

// BMW-inspired player car
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,5);

box(player,2.05,.55,4.5,greenMat,0,.75,0);
box(player,1.85,.55,2.15,greenMat,0,1.22,-.35);
box(player,1.72,.48,1.8,glassMat,0,1.25,-.4);
box(player,1.95,.22,.16,darkMat,0,.75,-2.27);
box(player,1.65,.3,.12,darkMat,0,.85,2.28);

for(let x of [-.75,.75]){
 for(let z of [-1.45,1.45]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,16),rubberMat);
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.48,z);
  player.add(wheel);
 }
}
for(let x of [-.72,.72]){
 box(player,.35,.18,.08,lampMat,x,.9,-2.3);
 box(player,.35,.15,.08,mat(0xff2222),x,.85,2.3);
}

// City buildings
const buildings=[];
for(let z=0;z>-1400;z-=35){
 for(let side of [-1,1]){
  const height=12+Math.random()*45;
  const width=9+Math.random()*12;
  const building=new THREE.Group();
  const material=mat([0x777b80,0x555d65,0x8b8275,0x394c5b][Math.floor(Math.random()*4)]);
  box(building,width,height,18,material,side*(16+width/2),height/2,z);
  box(building,width*.85,1,18.1,glassMat,side*(16+width/2),height*.7,z);
  world.add(building);
  buildings.push(building);
 }
}

// Streetlights
for(let z=0;z>-1400;z-=45){
 for(let side of [-1,1]){
  const pole=box(world,.16,7,.16,darkMat,side*10,3.5,z);
  box(world,2,.13,.13,darkMat,side*9,7,z);
  box(world,.5,.18,.35,lampMat,side*8.1,6.9,z);
 }
}

// Traffic
const traffic=[];
for(let i=0;i<9;i++){
 const car=new THREE.Group();
 const color=[0xeeeeee,0x222222,0x992222,0x244b83,0xaaaaaa][i%5];
 box(car,1.8,.6,4,mat(color),0,.7,0);
 box(car,1.5,.55,1.8,glassMat,0,1.2,-.3);
 for(let x of [-.7,.7])for(let z of [-1.2,1.2]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.2,12),rubberMat);
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.4,z);
  car.add(wheel);
 }
 car.position.set([-5,-1.7,1.7,5][i%4],0,-50-i*95);
 world.add(car);
 traffic.push(car);
}

// Controls
const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let speed=0,steer=0,playerX=0,gameOver=false;
const clock=new THREE.Clock();

function crash(){
 if(gameOver)return;
 gameOver=true;
 document.getElementById("gameover").style.display="flex";
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(!gameOver){
  // Faster acceleration
  if(keys.w||keys.arrowup) speed+=110*dt;
  else if(keys.s||keys.arrowdown) speed-=170*dt;
  else speed-=22*dt;
  speed=THREE.MathUtils.clamp(speed,0,320);

  let input=0;
  if(keys.a||keys.arrowleft)input-=1;
  if(keys.d||keys.arrowright)input+=1;
  steer+=input*5*dt;
  steer*=Math.pow(.82,dt*60);
  playerX+=steer*(2.2+speed/100)*dt;
  playerX=THREE.MathUtils.clamp(playerX,-7,7);
  player.position.x=playerX;
  player.rotation.z=-steer*.045;

  const movement=speed*.11*dt;
  world.position.z+=movement;

  if(world.position.z>35)world.position.z=0;

  traffic.forEach(car=>{
   car.position.z+=(speed*.11-car.userData.speed)*dt;
   if(car.position.z>18)car.position.z=-900-Math.random()*300;
   if(Math.abs(car.position.z-player.position.z)<3.2 &&
      Math.abs(car.position.x-playerX)<1.8)crash();
  });

  if(Math.abs(playerX)>7.2)crash();

  document.getElementById("speed").textContent=Math.round(speed);
 }
 camera.position.x+=(playerX*.35-camera.position.x)*.06;
 camera.lookAt(playerX*.35,1,-8);
 renderer.render(scene,camera);
}
traffic.forEach(car=>car.userData.speed=4+Math.random()*7);
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
