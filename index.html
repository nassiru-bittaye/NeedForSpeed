
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW City Drive</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
}

canvas { display: block; }

#hud {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 2;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 2px 5px black;
}

#help {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: #000a;
  padding: 12px 18px;
  border-radius: 10px;
  text-align: center;
  white-space: nowrap;
  font-size: 14px;
}

#gameover {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 5;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#gameover h1 {
  font-size: 52px;
  color: #ff3333;
}

button {
  padding: 14px 25px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

@media(max-width:600px) {
  #help { font-size: 11px; }
  #hud { font-size: 18px; }
}
</style>
</head>

<body>

<div id="hud">
  SPEED: <span id="speed">0</span> KM/H
</div>

<div id="help">
  W / ↑ Accelerate · S / ↓ Brake · A D / ← → Steer
</div>

<div id="gameover">
  <h1>CRASH!</h1>
  <p>Your BMW has crashed.</p>
  <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
if (!window.THREE) {
  document.body.innerHTML =
    "Three.js could not load. Check your internet connection and refresh.";
  throw new Error("Three.js failed to load");
}

// -------------------------
// SCENE
// -------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9df);
scene.fog = new THREE.Fog(0x87b9df, 100, 700);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  1200
);

camera.position.set(0, 6, 14);

const renderer = new THREE.WebGLRenderer({
  antialias: false
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.2));
renderer.shadowMap.enabled = false;

document.body.appendChild(renderer.domElement);

// -------------------------
// LIGHTING
// -------------------------

scene.add(
  new THREE.HemisphereLight(0xffffff, 0x39434c, 2)
);

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-30, 60, 20);
scene.add(sun);

// -------------------------
// MATERIALS
// -------------------------

function material(color, roughness = 0.8) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const greenMat = material(0x123d29, 0.3);
const glassMat = material(0x172b39, 0.2);
const darkMat = material(0x111315);
const rubberMat = material(0x080808);
const roadMat = material(0x25282c);
const lineMat = material(0xffffff);
const lampMat = material(0xffffdd);
const redMat = material(0xff2222);

const buildingMaterials = [
  material(0x777b80),
  material(0x555d65),
  material(0x8b8275),
  material(0x394c5b),
  material(0x77716a),
  material(0x454a52)
];

// -------------------------
// GROUND AND ROAD
// -------------------------

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2500, 4000),
  material(0x496b42)
);

ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.13, -1500);
scene.add(ground);

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 4000),
  roadMat
);

road.rotation.x = -Math.PI / 2;
road.position.set(0, 0, -1500);
scene.add(road);

const world = new THREE.Group();
scene.add(world);

// -------------------------
// HELPER
// -------------------------

function box(parent, w, h, d, mat, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  );

  mesh.position.set(x, y, z);
  parent.add(mesh);

  return mesh;
}

// -------------------------
// ROAD MARKINGS
// -------------------------

const movingObjects = [];

for (let z = 20; z > -1400; z -= 12) {
  for (const x of [-3, 3]) {
    const stripe = box(
      world,
      0.16,
      0.035,
      5,
      lineMat,
      x,
      0.03,
      z
    );

    movingObjects.push(stripe);
  }
}

// -------------------------
// PLAYER BMW
// -------------------------

const player = new THREE.Group();
scene.add(player);

player.position.set(0, 0, 5);

// Main body
box(player, 2.05, 0.55, 4.5, greenMat, 0, 0.75, 0);

// Roof
box(player, 1.85, 0.55, 2.15, greenMat, 0, 1.22, -0.35);

// Windows
box(player, 1.72, 0.48, 1.8, glassMat, 0, 1.25, -0.4);

// Front grille
box(player, 1.2, 0.28, 0.12, darkMat, 0, 0.78, -2.29);

// Front bumper
box(player, 1.95, 0.22, 0.16, darkMat, 0, 0.65, -2.28);

// Rear bumper
box(player, 1.8, 0.25, 0.12, darkMat, 0, 0.7, 2.28);

// Headlights and taillights
for (const x of [-0.72, 0.72]) {
  box(player, 0.38, 0.17, 0.08, lampMat, x, 0.93, -2.3);
  box(player, 0.38, 0.15, 0.08, redMat, x, 0.88, 2.3);
}

// Wheels
const wheels = [];

for (const x of [-0.78, 0.78]) {
  for (const z of [-1.45, 1.45]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, 0.27, 16),
      rubberMat
    );

    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.48, z);

    player.add(wheel);
    wheels.push(wheel);
  }
}

// -------------------------
// CITY BUILDINGS
// -------------------------

const cityLength = 1400;
const buildings = [];

for (let z = 0; z > -cityLength; z -= 35) {
  for (const side of [-1, 1]) {
    const height = 12 + Math.random() * 40;
    const width = 9 + Math.random() * 12;

    const building = new THREE.Group();

    const buildingMat =
      buildingMaterials[
        Math.floor(Math.random() * buildingMaterials.length)
      ];

    box(
      building,
      width,
      height,
      18,
      buildingMat,
      side * (16 + width / 2),
      height / 2,
      0
    );

    box(
      building,
      width * 0.85,
      1,
      18.1,
      glassMat,
      side * (16 + width / 2),
      height * 0.7,
      0
    );

    building.position.z = z;

    world.add(building);
    buildings.push(building);
    movingObjects.push(building);
  }
}

// -------------------------
// STREETLIGHTS
// -------------------------

const streetlights = [];

for (let z = 0; z > -cityLength; z -= 45) {
  for (const side of [-1, 1]) {
    const light = new THREE.Group();

    box(light, 0.16, 7, 0.16, darkMat, 0, 3.5, 0);
    box(light, 2, 0.13, 0.13, darkMat, side, 7, 0);
    box(light, 0.5, 0.18, 0.35, lampMat, side * 1.9, 6.9, 0);

    light.position.set(side * 10, 0, z);

    world.add(light);
    streetlights.push(light);
    movingObjects.push(light);
  }
}

// -------------------------
// TRAFFIC
// -------------------------

const traffic = [];

const trafficColors = [
  0xeeeeee,
  0x222222,
  0x992222,
  0x244b83,
  0xaaaaaa
];

for (let i = 0; i < 9; i++) {
  const car = new THREE.Group();

  const color = material(
    trafficColors[i % trafficColors.length],
    0.4
  );

  box(car, 1.8, 0.6, 4, color, 0, 0.7, 0);
  box(car, 1.5, 0.55, 1.8, glassMat, 0, 1.2, -0.3);

  for (const x of [-0.7, 0.7]) {
    for (const z of [-1.2, 1.2]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.35, 0.2, 12),
        rubberMat
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.4, z);
      car.add(wheel);
    }
  }

  car.position.set(
    [-5, -1.7, 1.7, 5][i % 4],
    0,
    -50 - i * 95
  );

  car.userData.forwardSpeed = 4 + Math.random() * 7;

  world.add(car);
  traffic.push(car);
}

// -------------------------
// CONTROLS
// -------------------------

const keys = {};

addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  if (
    ["arrowup", "arrowdown", "arrowleft", "arrowright", " "]
      .includes(key)
  ) {
    e.preventDefault();
  }
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// -------------------------
// GAME VARIABLES
// -------------------------

let speed = 0;
let steer = 0;
let playerX = 0;
let gameOver = false;

const clock = new THREE.Clock();

// -------------------------
// CRASH
// -------------------------

function crash() {
  if (gameOver) return;

  gameOver = true;
  speed = 0;

  document.getElementById("gameover").style.display = "flex";
}

// -------------------------
// GAME LOOP
// -------------------------

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (!gameOver) {

    // FAST ACCELERATION
    if (keys.w || keys.arrowup) {
      speed += 110 * dt;
    } else if (keys.s || keys.arrowdown) {
      speed -= 170 * dt;
    } else {
      speed -= 22 * dt;
    }

    speed = THREE.MathUtils.clamp(speed, 0, 320);

    // STEERING
    let input = 0;

    if (keys.a || keys.arrowleft) input -= 1;
    if (keys.d || keys.arrowright) input += 1;

    steer += input * 5 * dt;
    steer *= Math.pow(0.82, dt * 60);

    playerX += steer * (2.2 + speed / 100) * dt;
    playerX = THREE.MathUtils.clamp(playerX, -7, 7);

    player.position.x = playerX;
    player.rotation.z = -steer * 0.045;

    // ROAD AND CITY MOVE AS YOU DRIVE
    const movement = speed * 0.11 * dt;

    movingObjects.forEach(object => {
      object.position.z += movement;

      // RECYCLE OBJECTS INSTEAD OF RESETTING THE WHOLE WORLD
      if (object.position.z > 35) {
        object.position.z -= cityLength;
      }
    });

    // TRAFFIC MOVES FORWARD IN ITS OWN LANE
    traffic.forEach(car => {
      const relativeMovement =
        (speed * 0.11 - car.userData.forwardSpeed) * dt;

      car.position.z += relativeMovement;

      // Recycle cars that have passed the player
      if (car.position.z > 25) {
        car.position.z = -850 - Math.random() * 400;
        car.position.x = [-5, -1.7, 1.7, 5][
          Math.floor(Math.random() * 4)
        ];
        car.userData.forwardSpeed = 4 + Math.random() * 7;
      }

      // COLLISION DETECTION
      const distanceZ = Math.abs(car.position.z - player.position.z);
      const distanceX = Math.abs(car.position.x - playerX);

      if (distanceZ < 3.2 && distanceX < 1.8) {
        crash();
      }
    });

    // OFF-ROAD CRASH
    if (Math.abs(playerX) > 7.2) {
      crash();
    }

    // WHEEL ROTATION
    wheels.forEach(wheel => {
      wheel.rotation.x += speed * dt * 0.025;
    });

    document.getElementById("speed").textContent =
      Math.round(speed);
  }

  // CAMERA
  camera.position.x +=
    (playerX * 0.35 - camera.position.x) * 0.06;

  camera.lookAt(playerX * 0.35, 1, -8);

  renderer.render(scene, camera);
}

animate();

// -------------------------
// RESIZE
// -------------------------

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
