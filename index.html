
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Need For Speed</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;color:white;font-weight:bold;font-size:18px;text-shadow:2px 2px 4px black;z-index:5;line-height:1.7}
#viewButton,#restartButton{border:2px solid white;border-radius:10px;padding:11px 15px;background:#111d;color:white;font-weight:bold;cursor:pointer}
#viewButton{position:fixed;top:15px;right:15px;z-index:6}
#crashFlash{position:fixed;inset:0;background:red;opacity:0;pointer-events:none;z-index:8}
#crashMessage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:white;text-align:center;font-weight:900;font-size:48px;text-shadow:3px 3px 8px black;background:#0005;z-index:10}
#crashMessage button{margin-top:20px;font-size:18px}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none;z-index:6}
.controlGroup{display:flex;gap:14px;pointer-events:auto}
.control{width:68px;height:68px;border:2px solid #ffffffaa;border-radius:18px;color:white;background:#101827aa;font-size:28px;font-weight:bold;touch-action:none;user-select:none}
.control:active{background:#3985ddee}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:white;font-size:12px;text-shadow:1px 1px 3px black;white-space:nowrap;z-index:5}
@media(max-width:600px){#hud{font-size:15px}.control{width:60px;height:60px}#help{bottom:95px}}
</style>
</head>
<body>
<div id="hud">SPEED: <span id="speed">0</span> KM/H<br>DISTANCE: <span id="distance">0</span> M</div>
<button id="viewButton">🚘 EXTERIOR VIEW</button>
<div id="crashFlash"></div>
<div id="crashMessage">
  <div>💥 CRASH!</div>
  <div style="font-size:20px;margin-top:8px">You crashed your car!</div>
  <button id="restartButton">🔄 DRIVE AGAIN</button>
</div>
<div id="controls">
  <div class="controlGroup">
    <button class="control" id="leftButton">◀</button>
    <button class="control" id="rightButton">▶</button>
  </div>
  <div class="controlGroup">
    <button class="control" id="brakeButton">▼</button>
    <button class="control" id="gasButton">▲</button>
  </div>
</div>
<div id="help">A/D or ←/→ to steer · W/↑ to accelerate · S/↓ to brake</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc9f0);
scene.fog = new THREE.Fog(0x8bc9f0,85,260);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,600);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x536044,2));
const sunlight = new THREE.DirectionalLight(0xfff2d5,3);
sunlight.position.set(-30,55,-45);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024,1024);
scene.add(sunlight);

function mat(color,roughness=.8,metalness=0){
  return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function box(parent,w,h,d,color,x,y,z,material=null){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material||mat(color));
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cylinder(parent,rt,rb,h,color,x,y,z,segments=12){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),mat(color));
  m.position.set(x,y,z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

const grassMat=mat(0x557e43), roadMat=mat(0x33383d), shoulderMat=mat(0x77766c);
const whiteMat=mat(0xf3f0df), yellowMat=mat(0xffd34d), metalMat=mat(0x9ba4aa,.3,.8);
const interiorMat=mat(0x171b21), seatMat=mat(0x292d33), trimMat=mat(0x6d777e,.35,.7);
const glassMat=new THREE.MeshStandardMaterial({
  color:0x8bd6ed,roughness:.15,metalness:.1,transparent:true,opacity:.27,side:THREE.DoubleSide
});

// Ground and road
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,700),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.15,-220);
ground.receiveShadow=true;
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(15,700),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.04,-220);
road.receiveShadow=true;
scene.add(road);

for(const side of [-1,1]){
  const shoulder=new THREE.Mesh(new THREE.PlaneGeometry(2.1,700),shoulderMat);
  shoulder.rotation.x=-Math.PI/2;
  shoulder.position.set(side*8.5,-.035,-220);
  scene.add(shoulder);

  const edge=new THREE.Mesh(new THREE.PlaneGeometry(.13,700),whiteMat);
  edge.rotation.x=-Math.PI/2;
  edge.position.set(side*7.1,-.02,-220);
  scene.add(edge);
}

const laneDashes=[];
for(let z=-550;z<80;z+=12){
  const dash=new THREE.Mesh(new THREE.PlaneGeometry(.16,5.5),yellowMat);
  dash.rotation.x=-Math.PI/2;
  dash.position.set(0,.005,z);
  scene.add(dash);
  laneDashes.push(dash);
}
for(const x of [-2.5,2.5]){
  for(let z=-550;z<80;z+=18){
    const line=new THREE.Mesh(new THREE.PlaneGeometry(.07,8),whiteMat);
    line.rotation.x=-Math.PI/2;
    line.position.set(x,.004,z);
    scene.add(line);
  }
}

// Mountains
function mountain(x,z,width,height,color){
  const m=new THREE.Mesh(new THREE.ConeGeometry(width,height,5,1),mat(color));
  m.position.set(x,height/2-1,z);
  m.rotation.y=Math.random()*Math.PI;
  m.scale.z=1.7;
  scene.add(m);
}
for(let i=0;i<32;i++){
  const side=i%2===0?-1:1;
  mountain(side*(28+Math.random()*85),-100-Math.random()*380,
    13+Math.random()*23,22+Math.random()*48,[0x647f7a,0x738b83,0x84938c][i%3]);
}

// Clouds
function cloud(x,y,z){
  const g=new THREE.Group(), white=mat(0xffffff);
  for(let i=0;i<6;i++){
    const puff=new THREE.Mesh(new THREE.SphereGeometry(2.5+Math.random()*2,12,10),white);
    puff.position.set(i*2.6,Math.random()*1.1,Math.random()*1.5);
    puff.scale.y=.65;
    g.add(puff);
  }
  g.position.set(x,y,z);
  scene.add(g);
}
for(let i=0;i<22;i++)cloud((Math.random()-.5)*220,32+Math.random()*22,-50-Math.random()*430);

// Trees
function tree(x,z,size){
  const g=new THREE.Group();
  cylinder(g,.16*size,.24*size,2*size,0x65432d,0,size,0,8);
  const leaves=new THREE.Mesh(new THREE.ConeGeometry(1.3*size,3.4*size,8),
    mat([0x245b35,0x326c3c,0x477b42][Math.floor(Math.random()*3)]));
  leaves.position.y=3.1*size;
  leaves.castShadow=true;
  g.add(leaves);
  const upper=new THREE.Mesh(new THREE.ConeGeometry(.95*size,2.5*size,8),mat(0x356f3a));
  upper.position.y=4.5*size;
  g.add(upper);
  g.position.set(x,0,z);
  scene.add(g);
}
for(let i=0;i<115;i++){
  const side=i%2===0?-1:1;
  tree(side*(11+Math.random()*50),-Math.random()*600,.7+Math.random()*1.8);
}

// Guardrails
for(const side of [-1,1]){
  for(let z=-500;z<80;z+=7){
    box(scene,.18,.18,7,0xb8c0c2,side*8,.9,z,metalMat);
    box(scene,.15,1.1,.15,0x666c70,side*8,.45,z);
  }
  for(let z=-500;z<80;z+=21){
    box(scene,.13,.38,.08,0xffe4a0,side*7.85,.9,z);
  }
}

// Player vehicle
const player=new THREE.Group();
scene.add(player);
const carBodyMat=mat(0x125de0,.25,.45);

function wheel(parent,x,y,z){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.28,20),mat(0x111111,.95));
  w.rotation.z=Math.PI/2;
  w.position.set(x,y,z);
  w.castShadow=true;
  parent.add(w);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.30,16),metalMat);
  hub.rotation.z=Math.PI/2;
  hub.position.set(x,y,z);
  parent.add(hub);
}

box(player,2,.48,4.2,0x125de0,0,.66,0,carBodyMat);
box(player,1.75,.15,1.05,0x125de0,0,1.02,-1.15,carBodyMat);
box(player,1.78,.15,.95,0x125de0,0,1,1.18,carBodyMat);
box(player,1.4,.035,1.2,0x347cf0,0,.93,-1.35);
box(player,1.55,.08,.12,0xb9e6ff,0,.58,-2.12);
for(const x of [-.72,.72]){
  box(player,.35,.12,.12,0xfff1cc,x,.74,-2.12);
  box(player,.42,.2,.1,0xff2929,x,.65,2.1);
  wheel(player,x*1.22,.42,-1.32);
  wheel(player,x*1.22,.42,1.34);
}

// Roof, pillars, glass
box(player,1.55,.12,1.3,0x125de0,0,1.82,.05,carBodyMat);
for(const x of [-.78,.78]){
  const p=box(player,.09,.95,.11,0x172b47,x,1.38,-.7);
  p.rotation.x=-.16;
  const rp=box(player,.1,.8,.12,0x172b47,x,1.38,.72);
  rp.rotation.x=.18;
}
const windscreen=new THREE.Mesh(new THREE.PlaneGeometry(1.43,.79),glassMat);
windscreen.position.set(0,1.42,-.72);
windscreen.rotation.x=-.18;
player.add(windscreen);
for(const side of [-1,1]){
  const win=new THREE.Mesh(new THREE.PlaneGeometry(.95,.64),glassMat);
  win.position.set(side*.81,1.43,0);
  win.rotation.y=side*Math.PI/2;
  player.add(win);
}

// Interior dashboard
box(player,1.72,.28,.5,0x171b21,0,1.05,-.78,interiorMat);
box(player,1.5,.06,.23,0x30363c,0,1.20,-.82);
box(player,1.5,.035,.035,0x838e95,0,1.17,-.98,trimMat);

// Gauges
box(player,.62,.20,.08,0x05090d,-.40,1.24,-.80);
for(let i=0;i<2;i++){
  const gauge=new THREE.Mesh(new THREE.CircleGeometry(.073,24),mat(0x123c4c,.35,.2));
  gauge.position.set(-.55+i*.3,1.25,-.748);
  player.add(gauge);
  const needle=box(player,.015,.07,.012,0xff3434,-.55+i*.3,1.26,-.735);
  needle.rotation.z=-.45-i*.4;
}

// Centre console
box(player,.44,.14,.55,0x20252b,.25,.88,-.32,interiorMat);
box(player,.30,.17,.025,0x050b12,.25,1.05,-.47);
const screenMat=new THREE.MeshStandardMaterial({color:0x24a9d8,emissive:0x0875bb,emissiveIntensity:1.2});
box(player,.24,.105,.018,0x164a6a,.25,1.055,-.45,screenMat);
for(let i=0;i<4;i++){
  box(player,.045,.035,.025,i%2?0xffa22d:0x8295a1,.12+i*.085,.94,-.45);
}

// Steering wheel
const steeringWheel=new THREE.Group();
steeringWheel.position.set(-.43,1.27,-.36);
player.add(steeringWheel);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.245,.035,10,32),mat(0x090b0e,.5));
steeringWheel.add(ring);
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,.07,16),trimMat);
hub.rotation.x=Math.PI/2;
hub.position.z=.015;
steeringWheel.add(hub);
box(steeringWheel,.045,.34,.045,0x555d64,0,0,.01,trimMat);
const spoke=box(steeringWheel,.32,.045,.045,0x555d64,0,-.05,.01,trimMat);
spoke.rotation.z=.12;

// Seats
for(const x of [-.52,.52]){
  box(player,.55,.17,.58,0x171a1f,x,.72,.45,seatMat);
  box(player,.55,.75,.18,0x242930,x,1.12,.70,seatMat);
  box(player,.38,.08,.08,0x424a52,x,1.40,.59);
}

// Door panels
for(const side of [-1,1]){
  box(player,.08,.36,1.25,0x1a1e24,side*.88,.98,.25,interiorMat);
  box(player,.10,.045,.48,0x59636a,side*.84,1.10,.26,trimMat);
}

// Rearview and side mirrors
box(player,.28,.085,.06,0x15191d,0,1.75,-.45);
box(player,.23,.04,.018,0x8ba9b5,0,1.75,-.415);
for(const side of [-1,1]){
  box(player,.20,.12,.18,0x20262d,side*1,1.35,-.58);
  box(player,.04,.04,.1,0x92b9c9,side*1.06,1.37,-.59);
}

// Traffic
const traffic=[];
function trafficCar(color,x,z){
  const g=new THREE.Group();
  box(g,1.7,.55,3.2,color,0,.58,0);
  box(g,1.35,.55,1.45,0x283d4b,0,1.04,-.05);
  for(const side of [-1,1]){
    box(g,.28,.12,.1,0xfff1d1,side*.57,.62,-1.58);
    box(g,.28,.12,.1,0xff2727,side*.57,.62,1.58);
    wheel(g,side*.9,.37,-1);
    wheel(g,side*.9,.37,1);
  }
  g.position.set(x,0,z);
  scene.add(g);
  traffic.push({mesh:g,speed:.35+Math.random()*.55});
}
for(let i=0;i<9;i++){
  trafficCar([0xd72626,0xe6e6e6,0x171b25,0xe7bb2b,0x2e9b72][i%5],
    [-5,-2.5,2.5,5][Math.floor(Math.random()*4)],-45-i*48);
}

// Game state
let speed=0,distance=0,playerX=0,steering=0,steeringVelocity=0,heading=0;
let crashed=false,crashFlash=0,shake=0;
let gas=false,brake=false,steerLeft=false,steerRight=false;
let interiorView=true;
const speedText=document.getElementById("speed");
const distanceText=document.getElementById("distance");
const crashOverlay=document.getElementById("crashMessage");
const flashElement=document.getElementById("crashFlash");

// Keyboard controls
window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")steerLeft=true;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")steerRight=true;
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")gas=true;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")brake=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")steerLeft=false;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")steerRight=false;
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")gas=false;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")brake=false;
});

function bindHold(id,setter){
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();setter(true);b.setPointerCapture(e.pointerId);
  });
  const release=e=>{e.preventDefault();setter(false)};
  b.addEventListener("pointerup",release);
  b.addEventListener("pointercancel",release);
  b.addEventListener("lostpointercapture",()=>setter(false));
}
bindHold("leftButton",v=>steerLeft=v);
bindHold("rightButton",v=>steerRight=v);
bindHold("gasButton",v=>gas=v);
bindHold("brakeButton",v=>brake=v);

// Crash particles
const particles=[];
function crashEffect(){
  for(let i=0;i<55;i++){
    const spark=new THREE.Mesh(
      new THREE.SphereGeometry(.045+Math.random()*.07,6,6),
      new THREE.MeshBasicMaterial({color:[0xff5a12,0xffd447,0xffffff][i%3]})
    );
    spark.position.set(playerX+(Math.random()-.5)*2.2,.8+Math.random()*1.4,-1+(Math.random()-.5)*2);
    scene.add(spark);
    particles.push({
      mesh:spark,
      velocity:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7,(Math.random()-.5)*8),
      life:.5+Math.random()*.8
    });
  }
}
function crash(){
  if(crashed)return;
  crashed=true;
  speed=0;
  crashFlash=.9;
  shake=.8;
  crashEffect();
  crashOverlay.style.display="flex";
}

document.getElementById("restartButton").addEventListener("click",()=>{
  crashed=false;speed=0;playerX=0;steering=0;steeringVelocity=0;heading=0;distance=0;
  crashFlash=0;shake=0;
  player.position.set(0,0,0);
  player.rotation.set(0,0,0);
  traffic.forEach((t,i)=>{
    t.mesh.position.x=[-5,-2.5,2.5,5][i%4];
    t.mesh.position.z=-45-i*48;
  });
  particles.forEach(p=>scene.remove(p.mesh));
  particles.length=0;
  crashOverlay.style.display="none";
});

document.getElementById("viewButton").addEventListener("click",()=>{
  interiorView=!interiorView;
  document.getElementById("viewButton").textContent=
    interiorView?"🚘 EXTERIOR VIEW":"🧑 DRIVER VIEW";
});

// Hide exterior body in driver view while keeping cockpit details.
const interiorObjects=[];
player.children.forEach(obj=>{
  const z=obj.position.z, y=obj.position.y;
  // Most lower body parts are hidden in driver view.
  if(y<.85 || z < -1.1 || Math.abs(z)>1.6) obj.userData.exterior=true;
  else interiorObjects.push(obj);
});

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);

  if(!crashed){
    if(gas)speed+=42*dt;
    else speed-=9*dt;
    if(brake)speed-=65*dt;
    speed=THREE.MathUtils.clamp(speed,0,220);

    const speedFactor=.25+speed/130;
    const input=(steerRight?1:0)-(steerLeft?1:0);

    steering+=(input-steering)*(1-Math.exp(-5.5*dt));
    steeringVelocity+=steering*5.2*speedFactor*dt;
    steeringVelocity*=Math.exp(-2.7*dt);
    playerX+=steeringVelocity*dt*Math.max(.5,speed/45);
    playerX=THREE.MathUtils.clamp(playerX,-6.3,6.3);

    const targetHeading=-steering*Math.min(speed/100,1)*.32;
    heading+=(targetHeading-heading)*(1-Math.exp(-3.8*dt));

    player.position.x+=(playerX-player.position.x)*(1-Math.exp(-7*dt));
    player.rotation.y=heading;
    steeringWheel.rotation.z=-steering*.55;

    distance+=speed*dt/3.6;
    speedText.textContent=Math.round(speed);
    distanceText.textContent=Math.floor(distance);

    for(const t of traffic){
      t.mesh.position.z+=(speed/3.6*1.3+t.speed*8)*dt;
      const dx=Math.abs(t.mesh.position.x-playerX);
      const dz=Math.abs(t.mesh.position.z);
      if(dx<1.75&&dz<2.8&&speed>8){crash();break}
      if(t.mesh.position.z>12){
        t.mesh.position.z=-390-Math.random()*100;
        t.mesh.position.x=[-5,-2.5,2.5,5][Math.floor(Math.random()*4)];
      }
    }

    for(const dash of laneDashes){
      dash.position.z+=speed*dt*.18;
      if(dash.position.z>15)dash.position.z-=620;
    }
  }else{
    speed=0;
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    p.velocity.y-=10*dt;
    p.mesh.position.addScaledVector(p.velocity,dt);
    if(p.life<=0){
      scene.remove(p.mesh);
      particles.splice(i,1);
    }
  }

  crashFlash=Math.max(0,crashFlash-dt*2.5);
  shake=Math.max(0,shake-dt*2.8);
  flashElement.style.opacity=crashFlash;

  // LOWERED DRIVER CAMERA: height is now 1.60
  const cameraHeight=interiorView?1.60:3.1;
  const cameraBack=interiorView?-.20:6.7;
  const cameraSide=interiorView?-.42:0;

  const offset=new THREE.Vector3(cameraSide,cameraHeight,cameraBack);
  offset.applyAxisAngle(new THREE.Vector3(0,1,0),heading);

  camera.position.set(
    player.position.x+offset.x+(Math.random()-.5)*shake,
    offset.y+(Math.random()-.5)*shake,
    player.position.z+offset.z
  );

  if(interiorView){
    camera.rotation.order="YXZ";
    camera.rotation.y=heading;
    camera.rotation.x=0;
    camera.rotation.z=0;
  }else{
    camera.lookAt(player.position.x,.9,-12);
  }

  // Hide bodywork in driver view, show it in exterior view.
  player.children.forEach(obj=>{
    if(obj.userData.exterior)obj.visible=!interiorView;
  });

  renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
})();
</script>
</body>
</html>
