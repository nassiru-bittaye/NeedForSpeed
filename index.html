
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMW M5 CS City Drive</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:18px;left:18px;color:white;z-index:5;
text-shadow:0 2px 5px #000;pointer-events:none}
#title{font-size:19px;color:#b7e7c5;font-weight:bold;letter-spacing:2px}
#speed{font-size:38px;font-weight:bold}
#status{font-size:13px}
#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
color:white;background:#000b;padding:12px 18px;border-radius:12px;
font-size:13px;text-align:center;z-index:5;width:max-content;max-width:95%}
#gameover{display:none;position:fixed;inset:0;background:#000c;z-index:10;
color:white;align-items:center;justify-content:center;text-align:center}
#gameover h1{font-size:52px;color:#ff3434}
#gameover button{background:#168c43;color:white;border:0;padding:15px 30px;
border-radius:8px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="hud">
 <div id="title">BMW M5 CS</div>
 <div><span id="speed">0</span> KM/H</div>
 <div id="status">READY TO DRIVE</div>
</div>
<div id="help">W / ↑ ACCELERATE · S / ↓ BRAKE · A / D OR ← / → TURN · SPACE HANDBRAKE</div>
<div id="gameover">
 <div>
  <h1>CRASHED!</h1>
  <p>Your BMW has crashed.</p>
  <button onclick="location.reload()">DRIVE AGAIN</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML='<h2 style="color:white;padding:30px">Connect to the internet to load the 3D game.</h2>';
 throw new Error("Three.js failed to load");
}

// ---------------- PERFORMANCE SETTINGS ----------------

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b6d0);
scene.fog=new THREE.Fog(0x91b6d0,100,550);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.shadowMap.enabled=false;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdceeff,0x303020,2));

const sun=new THREE.DirectionalLight(0xffffff,1.7);
sun.position.set(-50,100,40);
scene.add(sun);

function material(color,roughness=.6,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

const green=material(0x123d2b,.25,.7);
const darkGreen=material(0x09251b,.3,.6);
const black=material(0x090b0c,.4,.2);
const rubber=material(0x080808,.9);
const chrome=material(0xb9c2c5,.25,.85);
const glass=material(0x243b4b,.2,.5);
const white=material(0xffffff,.2);
const red=new THREE.MeshStandardMaterial({
 color:0xff2020,emissive:0x990000,emissiveIntensity:1
});
const headlight=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0x9ecfff,emissiveIntensity:1.8
});

// ---------------- BMW CAR ----------------

function box(parent,x,y,z,w,h,d,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

function sphere(parent,x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),mat);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 parent.add(m);
 return m;
}

function cylinder(parent,x,y,z,r,length,mat){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,length,16),mat);
 m.rotation.z=Math.PI/2;
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

const car=new THREE.Group();
scene.add(car);
car.position.set(0,0,0);

// Main body
box(car,0,.95,0,2.05,.65,4.45,green);
sphere(car,0,1.12,-1.45,1.02,.4,.85,green);
box(car,0,1.12,1.75,2.08,.48,.75,green);

// Front bumper
box(car,0,.73,-2.17,2.08,.4,.35,darkGreen);
box(car,0,.65,-2.38,1.65,.16,.12,black);
box(car,0,.48,-2.4,1.95,.07,.35,black);

// BMW kidney grille
for(const side of [-1,1]){
 const gx=side*.32;
 box(car,gx,.96,-2.39,.48,.42,.09,chrome);
 box(car,gx,.96,-2.45,.40,.34,.07,black);
 for(let i=0;i<5;i++){
  box(car,gx,.80+i*.075,-2.50,.37,.018,.025,chrome);
 }
}

// Headlights and LED rings
for(const side of [-1,1]){
 box(car,side*.76,1.13,-2.28,.55,.20,.13,headlight);
 for(let i=0;i<2;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.075,.018,6,16),white);
  ring.position.set(side*.76+(i-.5)*.20,1.14,-2.37);
  car.add(ring);
 }
 box(car,side*.55,1.31,-1.45,.035,.018,1.15,darkGreen);
}

// Roof and windows
box(car,0,1.68,.15,1.65,.78,2.15,glass);
box(car,0,2.08,.12,1.55,.13,1.45,green);

for(const side of [-1,1]){
 box(car,side*.83,1.68,.05,.035,.52,1.65,black);
 sphere(car,side*1.13,1.58,-.60,.22,.12,.25,green);
 box(car,side*1.03,1.53,-.60,.18,.07,.10,black);
 box(car,side*1.04,.99,.15,.025,.42,1.65,darkGreen);
 box(car,side*1.06,1.20,.40,.025,.035,.25,chrome);
 box(car,side*1.02,.54,.05,.13,.13,2.6,black);
}

// Rear
box(car,0,.72,2.28,2.08,.35,.32,darkGreen);
for(const side of [-1,1]){
 box(car,side*.72,1.15,2.25,.48,.20,.12,red);
 cylinder(car,side*.67,.55,2.43,.12,.12,chrome);
}
box(car,0,.47,2.30,1.7,.10,.3,black);
box(car,0,1.70,1.95,1.8,.09,.40,black);
for(const side of [-1,1]){
 box(car,side*.62,1.59,1.95,.07,.22,.10,black);
}

// BMW badge
const badge=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.025,24),chrome);
badge.rotation.x=Math.PI/2;
badge.position.set(0,1.38,-2.49);
car.add(badge);

// Wheels
const wheels=[];
for(const x of [-1.04,1.04]){
 for(const z of [-1.40,1.40]){
  const wheel=new THREE.Group();
  wheel.position.set(x,.62,z);
  car.add(wheel);

  const tire=new THREE.Mesh(
   new THREE.CylinderGeometry(.43,.43,.25,20),rubber
  );
  tire.rotation.z=Math.PI/2;
  wheel.add(tire);

  const rim=new THREE.Mesh(
   new THREE.CylinderGeometry(.30,.30,.27,20),chrome
  );
  rim.rotation.z=Math.PI/2;
  wheel.add(rim);

  cylinder(wheel,0,0,0,.10,.29,black);

  for(let i=0;i<8;i++){
   const a=i*Math.PI/4;
   const spoke=box(wheel,0,Math.cos(a)*.18,Math.sin(a)*.18,.26,.04,.04,chrome);
   spoke.rotation.x=a;
  }
  wheels.push(wheel);
 }
}

// ---------------- MOVING ROAD ----------------

// Everything that scrolls belongs to this world group.
const world=new THREE.Group();
scene.add(world);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1500),
 material(0x343b38)
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.12,-600);
world.add(ground);

const road=new THREE.Mesh(
 new THREE.PlaneGeometry(22,1500),
 material(0x242628)
);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-600);
world.add(road);

// Sidewalks
for(const x of [-13,13]){
 const sidewalk=new THREE.Mesh(
  new THREE.BoxGeometry(3,.2,1500),
  material(0x777777)
 );
 sidewalk.position.set(x,.02,-600);
 world.add(sidewalk);
}

// Lane markings
const markings=[];
const laneMat=material(0xe9e6d6);

for(let z=-1200;z<80;z+=16){
 for(const x of [-3,3]){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(.13,.025,6),
   laneMat
  );
  line.position.set(x,.035,z);
  world.add(line);
  markings.push(line);
 }
}

// ---------------- OPTIMISED CITY ----------------

const cityChunks=[];
const buildingMats=[
 material(0x77818a),material(0x555f69),
 material(0x9b8f7d),material(0x3d4d5d),
 material(0x77716a),material(0x41494c)
];
const windowMat=material(0x8fb5c5,.25,.3);
const darkWindow=material(0x293642,.4,.1);

function createCityChunk(z){
 const group=new THREE.Group();
 group.position.z=z;

 const windowPositions=[];
 const windowColors=[];

 for(const side of [-1,1]){
  for(let j=0;j<2;j++){
   const width=9+Math.random()*5;
   const depth=9+Math.random()*5;
   const height=18+Math.random()*35;
   const x=side*(20+j*14);
   const bz=-j*11;

   const body=new THREE.Mesh(
    new THREE.BoxGeometry(width,height,depth),
    buildingMats[Math.floor(Math.random()*buildingMats.length)]
   );
   body.position.set(x,height/2,bz);
   group.add(body);

   // Windows are combined into one InstancedMesh per chunk.
   for(let row=2;row<height-1;row+=3.5){
    for(let col=-width/2+1;col<width/2-1;col+=2.2){
     const wx=x+col;
     const wy=row;
     const wz=bz-depth/2-.025;
     windowPositions.push([wx,wy,wz]);
    }
   }
  }
 }

 const windowGeometry=new THREE.BoxGeometry(1,.9,.04);
 const windows=new THREE.InstancedMesh(
  windowGeometry,windowMat,Math.max(1,windowPositions.length)
 );
 const dummy=new THREE.Object3D();
 for(let i=0;i<windowPositions.length;i++){
  const p=windowPositions[i];
  dummy.position.set(p[0],p[1],p[2]);
  dummy.updateMatrix();
  windows.setMatrixAt(i,dummy.matrix);
 }
 windows.instanceMatrix.needsUpdate=true;
 group.add(windows);

 world.add(group);
 cityChunks.push(group);
}

for(let i=0;i<28;i++){
 createCityChunk(-i*44);
}

// Streetlights: fewer objects, spaced farther apart.
const lampMat=material(0x333333,.4,.6);
const lampBulb=new THREE.MeshStandardMaterial({
 color:0xffe7a5,emissive:0xffd27a,emissiveIntensity:.6
});
const lamps=[];
for(let z=-1100;z<80;z+=55){
 for(const side of [-1,1]){
  const g=new THREE.Group();
  g.position.set(side*12,0,z);
  box(g,0,3,0,.12,6,.12,lampMat);
  box(g,-side*.7,6,0,1.4,.12,.12,lampMat);
  sphere(g,-side*1.2,5.9,0,.16,.12,.16,lampBulb);
  world.add(g);
  lamps.push(g);
 }
}

// ---------------- TRAFFIC ----------------

const traffic=[];
const trafficColors=[
 material(0x202a35,.3,.5),
 material(0xeeeeee,.3,.3),
 material(0x9e2020,.3,.4),
 material(0x303030,.3,.4),
 material(0xaaaaaa,.3,.4)
];

function createTraffic(z,x){
 const g=new THREE.Group();
 const color=trafficColors[Math.floor(Math.random()*trafficColors.length)];

 box(g,0,.75,0,1.8,.55,3.8,color);
 box(g,0,1.25,.1,1.5,.7,1.9,glass);

 for(const side of [-1,1]){
  for(const zz of [-1.2,1.2]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.34,.34,.2,12),rubber
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(side*.92,.38,zz);
   g.add(wheel);
  }
  box(g,side*.55,.80,-1.95,.35,.13,.05,white);
  box(g,side*.55,.80,1.95,.35,.13,.05,red);
 }

 g.position.set(x,0,z);
 world.add(g);
 traffic.push(g);
}

for(let i=0;i<12;i++){
 createTraffic(-55-i*85,[-7,-3,3,7][i%4]);
}

// ---------------- CONTROLS ----------------

const keys={};
let speed=0;
let playerX=0;
let steer=0;
let gameOver=false;
let shake=0;

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)){
  e.preventDefault();
 }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

const speedText=document.getElementById("speed");
const statusText=document.getElementById("status");
const particles=[];

function crash(){
 if(gameOver)return;
 gameOver=true;
 speed=0;
 shake=1.5;
 statusText.textContent="CRASHED";
 document.getElementById("gameover").style.display="flex";

 // Small, non-graphic crash sparks
 const sparkMat=new THREE.MeshBasicMaterial({color:0xffa52a});
 for(let i=0;i<28;i++){
  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.07,6,6),sparkMat
  );
  p.position.set(
   car.position.x+(Math.random()-.5)*2,
   1+Math.random()*1.5,
   (Math.random()-.5)*2
  );
  p.userData.velocity=new THREE.Vector3(
   (Math.random()-.5)*10,
   Math.random()*8,
   (Math.random()-.5)*10
  );
  scene.add(p);
  particles.push(p);
 }
}

// ---------------- GAME LOOP ----------------

let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 // Limit very large time steps after a tab switch.
 const dt=Math.min((now-previous)/1000,.035);
 previous=now;

 if(!gameOver){
  const accelerating=keys.w||keys.arrowup;
  const braking=keys.s||keys.arrowdown;
  const left=keys.a||keys.arrowleft;
  const right=keys.d||keys.arrowright;
  const handbrake=keys[" "];

  // Acceleration and braking
  if(accelerating)speed=Math.min(speed+45*dt,230);
  else speed=Math.max(0,speed-8*dt);

  if(braking)speed=Math.max(0,speed-95*dt);
  if(handbrake)speed=Math.max(0,speed-55*dt);

  // RESPONSIVE STEERING
  const steerInput=(right?1:0)-(left?1:0);
  const steeringPower=4.2;

  steer+=steerInput*steeringPower*dt;
  steer*=Math.pow(.88,dt*60);

  // Steering is stronger at low and medium speeds too.
  const turnSpeed=2.4+(speed/230)*3.5;
  playerX+=steer*turnSpeed*dt;

  playerX=Math.max(-8.4,Math.min(8.4,playerX));

  car.position.x=playerX;
  car.rotation.z=-steer*.12;
  car.rotation.y=-steer*.10;

  // Rotate wheels
  wheels.forEach(w=>{
   w.rotation.x-=speed*dt*.035;
  });

  // THE CITY MOVES WHEN YOU DRIVE
  const movement=speed*dt*.85;

  markings.forEach(m=>{
   m.position.z+=movement;
   if(m.position.z>15)m.position.z-=1280;
  });

  cityChunks.forEach(c=>{
   c.position.z+=movement;
   if(c.position.z>55)c.position.z-=28*44;
  });

  lamps.forEach(l=>{
   l.position.z+=movement;
   if(l.position.z>35)l.position.z-=1250;
  });

  traffic.forEach(t=>{
   t.position.z+=movement*.85;

   if(t.position.z>18){
    t.position.z=-1150-Math.random()*200;
    t.position.x=[-7,-3,3,7][Math.floor(Math.random()*4)];
   }

   // Collision
   if(Math.abs(t.position.z)<3.1 &&
      Math.abs(t.position.x-playerX)<1.8){
    crash();
   }
  });

  if(Math.abs(playerX)>8.25)crash();

  speedText.textContent=Math.round(speed);
  statusText.textContent=
   speed>170?"HIGH SPEED":
   speed>90?"FAST DRIVING":
   speed>5?"DRIVING":"READY TO DRIVE";
 }

 // Crash particles
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.position.addScaledVector(p.userData.velocity,dt);
  p.userData.velocity.y-=14*dt;
  p.scale.multiplyScalar(.96);
  if(p.position.y<0){
   scene.remove(p);
   particles.splice(i,1);
  }
 }

 // Follow the car smoothly
 const target=new THREE.Vector3(playerX*.45,4.3,9);
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(playerX*.3,1,-9);

 if(shake>0){
  camera.position.x+=(Math.random()-.5)*shake;
  camera.position.y+=(Math.random()-.5)*shake;
  shake=Math.max(0,shake-dt*2);
 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// Resize
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
});
</script>
</body>
</html>
