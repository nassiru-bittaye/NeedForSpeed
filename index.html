
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW M5 CS - Street Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:18px;left:18px;color:white;z-index:5;
text-shadow:0 2px 5px #000;pointer-events:none}
#speed{font-size:36px;font-weight:bold}
#title{font-size:18px;color:#b7e7c5;font-weight:bold;letter-spacing:2px}
#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
color:white;background:#0009;padding:12px 20px;border-radius:12px;
font-size:13px;text-align:center;z-index:5}
#gameover{display:none;position:fixed;inset:0;background:#000b;
z-index:10;color:white;align-items:center;justify-content:center;text-align:center}
#gameover h1{font-size:55px;color:#ff3434}
#gameover button{background:#168c43;color:white;border:0;padding:15px 30px;
border-radius:8px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="hud">
<div id="title">BMW M5 CS</div>
<div><span id="speed">0</span> KM/H</div>
<div id="status">READY TO DRIVE</div>
</div>
<div id="help">W / ↑ ACCELERATE · S / ↓ BRAKE · A D / ← → STEER · SPACE HANDBRAKE</div>
<div id="gameover">
<div>
<h1>CRASHED!</h1>
<p>Your BMW has been damaged.</p>
<button onclick="location.reload()">DRIVE AGAIN</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE) {
 document.body.innerHTML="<h2 style='color:white;padding:30px'>Please connect to the internet to load the 3D game.</h2>";
 throw new Error("Three.js could not load");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b6d0);
scene.fog=new THREE.Fog(0x91b6d0,100,650);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);
camera.position.set(0,6,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdceeff,0x303020,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-80,130,60);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=(color,roughness=.55,metalness=0)=>new THREE.MeshStandardMaterial({
 color,roughness,metalness
});

const green=mat(0x123d2b,.25,.75);
const darkGreen=mat(0x09251b,.25,.6);
const black=mat(0x090b0c,.3,.2);
const rubber=mat(0x080808,.9);
const glass= new THREE.MeshPhysicalMaterial({
 color:0x142a35,metalness:.4,roughness:.12,transparent:true,opacity:.85
});
const chrome=mat(0xb9c2c5,.2,.9);
const white=mat(0xffffff,.15,.1);
const red=mat(0xff1010,.2,.1);
const gold=mat(0xb78b38,.3,.7);

function box(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function sphere(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),material);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);
 m.castShadow=true;parent.add(m);return m;
}
function cylinder(parent,x,y,z,r1,r2,length,material,rotX=Math.PI/2){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,length,24),material);
 m.position.set(x,y,z);m.rotation.x=rotX;
 m.castShadow=true;parent.add(m);return m;
}

// BMW-inspired car model
const car=new THREE.Group();
scene.add(car);
car.position.set(0,0,0);

// Main body
box(car,0,.95,0,2.05,.65,4.45,green);
sphere(car,0,1.13,-1.45,1.02,.4,.85,green);
box(car,0,1.12,1.75,2.08,.48,.75,green);

// Front bumper
box(car,0,.73,-2.17,2.08,.4,.35,darkGreen);
box(car,0,.65,-2.36,1.65,.16,.12,black);

// Kidney grille: two separate chrome-bordered openings
for(let side of [-1,1]){
 const gx=side*.32;
 box(car,gx,.96,-2.39,.48,.42,.09,chrome);
 box(car,gx,.96,-2.45,.40,.34,.07,black);
 for(let i=0;i<5;i++){
  box(car,gx,.80+i*.075,-2.50,.37,.018,.025,chrome);
 }
}

// Front splitter
box(car,0,.48,-2.38,1.95,.07,.35,black);

// Headlights with LED strips
for(let side of [-1,1]){
 const light=box(car,side*.76,1.13,-2.28,.55,.20,.13,white);
 light.material=new THREE.MeshStandardMaterial({
  color:0xffffff,emissive:0x9ecfff,emissiveIntensity:2
 });
 for(let i=0;i<2;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.075,.018,8,24),white);
  ring.position.set(side*.76+(i-.5)*.20,1.14,-2.37);
  car.add(ring);
 }
}

// Hood details
for(let side of [-1,1]){
 box(car,side*.55,1.31,-1.45,.035,.018,1.15,darkGreen);
}

// Cabin
const cabin=new THREE.Group();
car.add(cabin);
const cabinShape=new THREE.Mesh(
 new THREE.BoxGeometry(1.63,.85,2.15),glass
);
cabinShape.position.set(0,1.65,.15);
cabinShape.castShadow=true;
cabin.add(cabinShape);

// Roof
box(car,0,2.08,.12,1.55,.13,1.45,green);

// Windows
for(let side of [-1,1]){
 box(car,side*.83,1.68,.05,.035,.52,1.65,black);
 box(car,side*.84,1.68,-.80,.035,.48,.48,black);
 box(car,side*.84,1.68,.92,.035,.48,.43,black);
}

// Mirrors
for(let side of [-1,1]){
 sphere(car,side*1.13,1.58,-.60,.22,.12,.25,green);
 box(car,side*1.03,1.53,-.60,.18,.07,.10,black);
}

// Door lines and handles
for(let side of [-1,1]){
 box(car,side*1.04,.99,.15,.025,.42,1.65,darkGreen);
 box(car,side*1.06,1.20,.40,.025,.035,.25,chrome);
}

// Side skirts
for(let side of [-1,1])
 box(car,side*1.02,.54,.05,.13,.13,2.6,black);

// Rear lights
for(let side of [-1,1]){
 const tail=box(car,side*.72,1.15,2.25,.48,.20,.12,red);
 tail.material=new THREE.MeshStandardMaterial({
  color:0xff2020,emissive:0x9d0000,emissiveIntensity:1.3
 });
}

// Rear bumper and exhausts
box(car,0,.72,2.28,2.08,.35,.32,darkGreen);
for(let side of [-1,1]){
 cylinder(car,side*.67,.55,2.43,.12,.12,.12,chrome);
}
box(car,0,.47,2.30,1.7,.10,.3,black);

// Rear spoiler
box(car,0,1.70,1.95,1.8,.09,.40,black);
for(let side of [-1,1])box(car,side*.62,1.59,1.95,.07,.22,.10,black);

// BMW-style badge
cylinder(car,0,1.38,-2.49,.12,.12,.025,chrome);
cylinder(car,0,1.38,-2.51,.08,.08,.025,mat(0x1456a0,.3,.3));

// Wheels
const wheels=[];
for(let x of [-1.04,1.04]){
 for(let z of [-1.40,1.40]){
  const wheel=new THREE.Group();
  wheel.position.set(x,.62,z);
  car.add(wheel);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,32),rubber);
  tire.rotation.z=Math.PI/2;
  wheel.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.30,.30,.27,32),chrome);
  rim.rotation.z=Math.PI/2;
  wheel.add(rim);
  const center=new THREE.Mesh(new THREE.CylinderGeometry(.10,.10,.29,24),black);
  center.rotation.z=Math.PI/2;
  wheel.add(center);
  for(let i=0;i<10;i++){
   const a=i*Math.PI/5;
   const spoke=box(wheel,0,Math.cos(a)*.19,Math.sin(a)*.19,.28,.045,.045,chrome);
   spoke.rotation.x=a;
  }
  wheels.push(wheel);
 }
}

// Ground and road
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1600),mat(0x343b38));
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.08,-450);
ground.receiveShadow=true;
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(22,1600),mat(0x242628));
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-450);
scene.add(road);

// Sidewalks
for(let x of [-13,13]){
 const walk=new THREE.Mesh(new THREE.BoxGeometry(3,.25,1600),mat(0x777777));
 walk.position.set(x,.05,-450);scene.add(walk);
}

// Road markings
const markings=[];
for(let z=-1200;z<120;z+=18){
 for(let x of [-3,3]){
  const line=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,7),mat(0xe8e8d0));
  line.position.set(x,.035,z);scene.add(line);markings.push(line);
 }
}

// City chunks
const chunks=[];
const buildingMaterials=[
 mat(0x777f88),mat(0x555f69),mat(0x9b8f7d),
 mat(0x3d4d5d),mat(0x77716a),mat(0x41494c)
];

function createBuilding(parent,x,z,w,h,d){
 const b=new THREE.Group();
 b.position.set(x,0,z);
 const material=buildingMaterials[Math.floor(Math.random()*buildingMaterials.length)];
 box(b,0,h/2,0,w,h,d,material);
 for(let y=2;y<h-1;y+=3){
  for(let xx=-w/2+1;xx<w/2-1;xx+=2.2){
   const window=box(b,xx,y,-d/2-.015,1,.9,.035,
    Math.random()>.25?mat(0x9fc6d4,.25):mat(0x303b48));
  }
 }
 parent.add(b);
}
for(let i=0;i<32;i++){
 const chunk=new THREE.Group();
 chunk.position.z=-i*38;
 for(let side of [-1,1]){
  for(let j=0;j<3;j++){
   const h=15+Math.random()*48;
   createBuilding(chunk,side*(21+j*13),-j*9,10+Math.random()*7,h,10+Math.random()*8);
  }
 }
 scene.add(chunk);chunks.push(chunk);
}

// Streetlights
const lampMat=mat(0x333333,.4,.7);
for(let z=-1100;z<100;z+=35){
 for(let side of [-1,1]){
  const pole=box(scene,side*12,3,z,.12,6,.12,lampMat);
  box(scene,side*11.3,6,z,.9,.12,.12,lampMat);
  sphere(scene,side*10.9,5.9,z,.16,.12,.16,mat(0xffe7a5));
 }
}

// Traffic cars
const traffic=[];
function makeTraffic(z,x){
 const g=new THREE.Group();
 const color=mat([0x202a35,0xeeeeee,0x9e2020,0x303030,0xaaaaaa][Math.floor(Math.random()*5)],.3,.5);
 box(g,0,.75,0,1.8,.55,3.8,color);
 box(g,0,1.25,.1,1.5,.7,1.9,glass);
 for(let side of [-1,1]){
  for(let zz of [-1.2,1.2]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,20),rubber);
   w.rotation.z=Math.PI/2;w.position.set(side*.92,.38,zz);g.add(w);
  }
  box(g,side*.55,.80,-1.95,.35,.13,.05,white);
  box(g,side*.55,.80,1.95,.35,.13,.05,red);
 }
 g.position.set(x,0,z);
 scene.add(g);traffic.push(g);
}
for(let i=0;i<18;i++){
 makeTraffic(-50-i*65,[-7,-3,3,7][i%4]);
}

// Driving
const keys={};
let speed=0,steering=0,gameOver=false,shake=0;
let playerX=0;
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const speedText=document.getElementById("speed");
const statusText=document.getElementById("status");

function crash(){
 if(gameOver)return;
 gameOver=true;speed=0;shake=1;
 document.getElementById("gameover").style.display="flex";
 statusText.textContent="CRASHED";
 // Non-graphic sparks
 for(let i=0;i<45;i++){
  const p=new THREE.Mesh(new THREE.SphereGeometry(.06,6,6),
   mat(0xffa52a,.3,.1));
  p.position.copy(car.position);
  p.position.y+=1+Math.random()*1.5;
  scene.add(p);
  p.userData.velocity=new THREE.Vector3(
   (Math.random()-.5)*12,Math.random()*10,(Math.random()-.5)*12
  );
  particles.push(p);
 }
}

const particles=[];
let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;

 if(!gameOver){
  const accelerating=keys.w||keys.arrowup;
  const braking=keys.s||keys.arrowdown;
  const left=keys.a||keys.arrowleft;
  const right=keys.d||keys.arrowright;

  if(accelerating)speed=Math.min(speed+34*dt,220);
  else speed=Math.max(0,speed-9*dt);
  if(braking)speed=Math.max(0,speed-75*dt);

  steering+=( (right?1:0)-(left?1:0))*dt*2.5;
  steering*=Math.pow(.93,dt*60);
  playerX+=steering*speed*.018*dt;
  playerX=Math.max(-8,Math.min(8,playerX));
  car.position.x=playerX;
  car.rotation.z=-steering*.10;
  car.rotation.y=-steering*.08;

  wheels.forEach(w=>w.rotation.x-=speed*dt*.04);

  const movement=speed*dt*.65;
  markings.forEach(m=>{
   m.position.z+=movement;
   if(m.position.z>15)m.position.z-=1300;
  });
  chunks.forEach(c=>{
   c.position.z+=movement;
   if(c.position.z>45)c.position.z-=1216;
  });

  traffic.forEach(t=>{
   t.position.z+=movement-(speed*dt*.25);
   if(t.position.z>15){
    t.position.z=-1100-Math.random()*300;
    t.position.x=[-7,-3,3,7][Math.floor(Math.random()*4)];
   }
   if(Math.abs(t.position.z-car.position.z)<3.2&&
      Math.abs(t.position.x-car.position.x)<1.8){
    crash();
   }
  });

  if(Math.abs(playerX)>8)crash();

  speedText.textContent=Math.round(speed);
  statusText.textContent=speed>150?"HIGH SPEED":speed>60?"DRIVING":"READY TO DRIVE";
 }

 particles.forEach((p,i)=>{
  p.position.addScaledVector(p.userData.velocity,dt);
  p.userData.velocity.y-=15*dt;
  p.scale.multiplyScalar(.97);
  if(p.position.y<0){scene.remove(p);particles.splice(i,1);}
 });

 const target=new THREE.Vector3(playerX*.45,4.2,8.5);
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(playerX*.3,1,-9);

 if(shake>0){
  camera.position.x+=(Math.random()-.5)*shake;
  camera.position.y+=(Math.random()-.5)*shake;
  shake=Math.max(0,shake-dt*2);
 }

 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
