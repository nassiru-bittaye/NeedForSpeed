
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Need For Speed</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  text-shadow: 2px 2px 4px black;
  z-index: 5;
  line-height: 1.7;
}

#viewButton, #restartButton {
  border: 2px solid white;
  border-radius: 10px;
  padding: 11px 15px;
  background: #111d;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#viewButton {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 6;
}

#crashFlash {
  position: fixed;
  inset: 0;
  background: red;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
}

#crashMessage {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  text-align: center;
  font-weight: 900;
  font-size: 48px;
  text-shadow: 3px 3px 8px black;
  background: #0005;
  z-index: 10;
}

#crashMessage button {
  margin-top: 20px;
  font-size: 18px;
}

#controls {
  position: fixed;
  bottom: 22px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 24px;
  pointer-events: none;
  z-index: 6;
}

.controlGroup {
  display: flex;
  gap: 14px;
  pointer-events: auto;
}

.control {
  width: 68px;
  height: 68px;
  border: 2px solid #ffffffaa;
  border-radius: 18px;
  color: white;
  background: #101827aa;
  font-size: 28px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
}

.control:active {
  background: #3985ddee;
}

#help {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 12px;
  text-shadow: 1px 1px 3px black;
  white-space: nowrap;
  z-index: 5;
}

@media (max-width: 600px) {
  #hud { font-size: 15px; }
  .control { width: 60px; height: 60px; }
  #help { bottom: 95px; }
}
</style>
</head>

<body>
<div id="hud">
  SPEED: <span id="speed">0</span> KM/H<br>
  DISTANCE: <span id="distance">0</span> M
</div>

<button id="viewButton">🚘 EXTERIOR VIEW</button>

<div id="crashFlash"></div>

<div id="crashMessage">
  <div>💥 CRASH!</div>
  <div style="font-size:20px;margin-top:8px">
    You crashed your car!
  </div>
  <button id="restartButton">🔄 DRIVE AGAIN</button>
</div>

<div id="controls">
  <div class="controlGroup">
    <button class="control" id="leftButton">◀</button>
    <button class="control" id="rightButton">▶</button>
  </div>
  <div class="controlGroup">
    <button class="control" id="brakeButton">▼</button>
    <button class="control" id="gasButton">▲</button>
  </div>
</div>

<div id="help">A/D or ←/→ to steer · W/↑ to accelerate · S/↓ to brake</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
"use strict";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc9f0);
scene.fog = new THREE.Fog(0x8bc9f0, 85, 260);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 600
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xd9efff, 0x536044, 2.0));

const sunlight = new THREE.DirectionalLight(0xfff2d5, 3.0);
sunlight.position.set(-30, 55, -45);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);
scene.add(sunlight);

// MATERIALS
function material(color, roughness = 0.8, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color, roughness, metalness
  });
}

const grassMat = material(0x557e43);
const roadMat = material(0x33383d, 0.95);
const shoulderMat = material(0x77766c);
const whiteMat = material(0xf3f0df);
const yellowMat = material(0xffd34d);
const metalMat = material(0x9ba4aa, 0.3, 0.8);
const darkMat = material(0x141a20);
const glassMat = new THREE.MeshStandardMaterial({
  color: 0x8bd6ed,
  roughness: 0.15,
  metalness: 0.1,
  transparent: true,
  opacity: 0.27,
  side: THREE.DoubleSide
});

// BASIC BUILDERS
function addBox(parent, w, h, d, color, x, y, z, mat = null) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat || material(color)
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function addCylinder(parent, radiusTop, radiusBottom, height,
                     color, x, y, z, segments = 12) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radiusTop, radiusBottom, height, segments
    ),
    material(color)
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// LANDSCAPE
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 700),
  grassMat
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.15, -220);
ground.receiveShadow = true;
scene.add(ground);

// ROAD
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(15, 700),
  roadMat
);
road.rotation.x = -Math.PI / 2;
road.position.set(0, -0.04, -220);
road.receiveShadow = true;
scene.add(road);

// Gravel shoulders
for (const side of [-1, 1]) {
  const shoulder = new THREE.Mesh(
    new THREE.PlaneGeometry(2.1, 700),
    shoulderMat
  );
  shoulder.rotation.x = -Math.PI / 2;
  shoulder.position.set(side * 8.5, -0.035, -220);
  scene.add(shoulder);

  const edge = new THREE.Mesh(
    new THREE.PlaneGeometry(0.13, 700),
    whiteMat
  );
  edge.rotation.x = -Math.PI / 2;
  edge.position.set(side * 7.1, -0.02, -220);
  scene.add(edge);
}

// Road centre dashes
const laneDashes = [];
for (let z = -550; z < 80; z += 12) {
  const dash = new THREE.Mesh(
    new THREE.PlaneGeometry(0.16, 5.5),
    yellowMat
  );
  dash.rotation.x = -Math.PI / 2;
  dash.position.set(0, 0.005, z);
  scene.add(dash);
  laneDashes.push(dash);
}

// White lane markings
for (const x of [-2.5, 2.5]) {
  for (let z = -550; z < 80; z += 18) {
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.07, 8),
      whiteMat
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(x, 0.004, z);
    scene.add(line);
  }
}

// MOUNTAINS
function createMountain(x, z, width, height, color) {
  const mountain = new THREE.Mesh(
    new THREE.ConeGeometry(width, height, 5, 1),
    material(color)
  );
  mountain.position.set(x, height / 2 - 1, z);
  mountain.rotation.y = Math.random() * Math.PI;
  mountain.scale.z = 1.7;
  scene.add(mountain);
}

for (let i = 0; i < 32; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  createMountain(
    side * (28 + Math.random() * 85),
    -100 - Math.random() * 380,
    13 + Math.random() * 23,
    22 + Math.random() * 48,
    [0x647f7a, 0x738b83, 0x84938c][i % 3]
  );
}

// CLOUDS
function createCloud(x, y, z) {
  const cloud = new THREE.Group();
  const cloudMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 1
  });

  for (let i = 0; i < 6; i++) {
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(2.5 + Math.random() * 2, 12, 10),
      cloudMat
    );
    puff.position.set(i * 2.6, Math.random() * 1.1, Math.random() * 1.5);
    puff.scale.y = 0.65;
    cloud.add(puff);
  }

  cloud.position.set(x, y, z);
  scene.add(cloud);
}

for (let i = 0; i < 22; i++) {
  createCloud(
    (Math.random() - 0.5) * 220,
    32 + Math.random() * 22,
    -50 - Math.random() * 430
  );
}

// TREES
function createTree(x, z, size) {
  const tree = new THREE.Group();

  addCylinder(tree, 0.16 * size, 0.24 * size,
    2.0 * size, 0x65432d, 0, size, 0, 8);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.3 * size, 3.4 * size, 8),
    material([0x245b35, 0x326c3c, 0x477b42][Math.floor(Math.random()*3)])
  );
  leaves.position.y = 3.1 * size;
  leaves.castShadow = true;
  tree.add(leaves);

  const upper = new THREE.Mesh(
    new THREE.ConeGeometry(0.95 * size, 2.5 * size, 8),
    material(0x356f3a)
  );
  upper.position.y = 4.5 * size;
  tree.add(upper);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

for (let i = 0; i < 115; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  createTree(
    side * (11 + Math.random() * 50),
    -Math.random() * 600,
    0.7 + Math.random() * 1.8
  );
}

// GUARDRAILS AND REFLECTORS
for (const side of [-1, 1]) {
  for (let z = -500; z < 80; z += 7) {
    addBox(scene, 0.18, 0.18, 7,
      0xb8c0c2, side * 8.0, 0.9, z, metalMat);

    addBox(scene, 0.15, 1.1, 0.15,
      0x666c70, side * 8.0, 0.45, z);
  }

  for (let z = -500; z < 80; z += 21) {
    addBox(scene, 0.13, 0.38, 0.08,
      0xffe4a0, side * 7.85, 0.9, z);
  }
}

// PLAYER CAR
const player = new THREE.Group();
scene.add(player);

const carBodyMat = material(0x125de0, 0.25, 0.45);
const interiorMat = material(0x171b21, 0.8);
const seatMat = material(0x292d33, 0.9);
const trimMat = material(0x6d777e, 0.35, 0.7);
const screenMat = new THREE.MeshStandardMaterial({
  color: 0x24a9d8,
  emissive: 0x0875bb,
  emissiveIntensity: 1.2,
  roughness: 0.25
});

function createWheel(parent, x, y, z) {
  const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.39, 0.39, 0.28, 20),
    material(0x111111, 0.95)
  );
  wheel.rotation.z = Math.PI / 2;
  wheel.position.set(x, y, z);
  wheel.castShadow = true;
  parent.add(wheel);

  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.16, 0.30, 16),
    metalMat
  );
  hub.rotation.z = Math.PI / 2;
  hub.position.set(x, y, z);
  parent.add(hub);
}

// Car shell
addBox(player, 2.0, 0.48, 4.2,
  0x125de0, 0, 0.66, 0, carBodyMat);

addBox(player, 1.75, 0.15, 1.05,
  0x125de0, 0, 1.02, -1.15, carBodyMat);

addBox(player, 1.78, 0.15, 0.95,
  0x125de0, 0, 1.00, 1.18, carBodyMat);

// Bonnet details
addBox(player, 1.4, 0.035, 1.2,
  0x347cf0, 0, 0.93, -1.35);

addBox(player, 1.55, 0.08, 0.12,
  0xb9e6ff, 0, 0.58, -2.12);

for (const x of [-0.72, 0.72]) {
  addBox(player, 0.35, 0.12, 0.12,
    0xfff1cc, x, 0.74, -2.12);

  addBox(player, 0.42, 0.2, 0.1,
    0xff2929, x, 0.65, 2.1);

  createWheel(player, x * 1.22, 0.42, -1.32);
  createWheel(player, x * 1.22, 0.42, 1.34);
}

// Roof and windshield pillars
addBox(player, 1.55, 0.12, 1.3,
  0x125de0, 0, 1.82, 0.05, carBodyMat);

for (const x of [-0.78, 0.78]) {
  const pillar = addBox(player, 0.09, 0.95, 0.11,
    0x172b47, x, 1.38, -0.7);
  pillar.rotation.x = -0.16;

  const rearPillar = addBox(player, 0.1, 0.8, 0.12,
    0x172b47, x, 1.38, 0.72);
  rearPillar.rotation.x = 0.18;
}

// Windscreen
const windscreen = new THREE.Mesh(
  new THREE.PlaneGeometry(1.43, 0.79),
  glassMat
);
windscreen.position.set(0, 1.42, -0.72);
windscreen.rotation.x = -0.18;
player.add(windscreen);

// Side windows
for (const side of [-1, 1]) {
  const windowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.95, 0.64),
    glassMat
  );
  windowMesh.position.set(side * 0.81, 1.43, 0.0);
  windowMesh.rotation.y = side * Math.PI / 2;
  player.add(windowMesh);
}

// REALISTIC INTERIOR
// Dashboard
addBox(player, 1.72, 0.28, 0.5,
  0x171b21, 0, 1.05, -0.78, interiorMat);

addBox(player, 1.5, 0.06, 0.23,
  0x30363c, 0, 1.20, -0.82);

// Dashboard trim
addBox(player, 1.5, 0.035, 0.035,
  0x838e95, 0, 1.17, -0.98, trimMat);

// Instrument cluster
addBox(player, 0.62, 0.20, 0.08,
  0x05090d, -0.40, 1.24, -0.80);

for (let i = 0; i < 2; i++) {
  const gauge = new THREE.Mesh(
    new THREE.CircleGeometry(0.073, 24),
    material(0x123c4c, 0.35, 0.2)
  );
  gauge.position.set(-0.55 + i * 0.3, 1.25, -0.748);
  player.add(gauge);

  const needle = addBox(player, 0.015, 0.07, 0.012,
    0xff3434, -0.55 + i * 0.3, 1.26, -0.735);
  needle.rotation.z = -0.45 - i * 0.4;
}

// Centre console
addBox(player, 0.44, 0.14, 0.55,
  0x20252b, 0.25, 0.88, -0.32, interiorMat);

addBox(player, 0.30, 0.17, 0.025,
  0x050b12, 0.25, 1.05, -0.47);

addBox(player, 0.24, 0.105, 0.018,
  0x164a6a, 0.25, 1.055, -0.45, screenMat);

// Console buttons
for (let i = 0; i < 4; i++) {
  addBox(player, 0.045, 0.035, 0.025,
    i % 2 ? 0xffa22d : 0x8295a1,
    0.12 + i * 0.085, 0.94, -0.45);
}

// Steering wheel
const steeringWheel = new THREE.Group();
steeringWheel.position.set(-0.43, 1.27, -0.36);
player.add(steeringWheel);

const wheelRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.245, 0.035, 10, 32),
  material(0x090b0e, 0.5)
);
steeringWheel.add(wheelRing);

const wheelHub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.065, 0.065, 0.07, 16),
  trimMat
);
wheelHub.rotation.x = Math.PI / 2;
wheelHub.position.z = 0.015;
steeringWheel.add(wheelHub);

const spoke1 = addBox(steeringWheel, 0.045, 0.34, 0.045,
  0x555d64, 0, 0, 0.01, trimMat);

const spoke2 = addBox(steeringWheel, 0.32, 0.045, 0.045,
  0x555d64, 0, -0.05, 0.01, trimMat);
spoke2.rotation.z = 0.12;

// Seats
for (const x of [-0.52, 0.52]) {
  addBox(player, 0.55, 0.17, 0.58,
    0x171a1f, x, 0.72, 0.45, seatMat);

  addBox(player, 0.55, 0.75, 0.18,
    0x242930, x, 1.12, 0.70, seatMat);

  addBox(player, 0.38, 0.08, 0.08,
    0x424a52, x, 1.40, 0.59);
}

// Interior door panels
for (const side of [-1, 1]) {
  addBox(player, 0.08, 0.36, 1.25,
    0x1a1e24, side * 0.88, 0.98, 0.25, interiorMat);

  addBox(player, 0.10, 0.045, 0.48,
    0x59636a, side * 0.84, 1.10, 0.26, trimMat);
}

// Rearview mirror
addBox(player, 0.28, 0.085, 0.06,
  0x15191d, 0, 1.75, -0.45);

addBox(player, 0.23, 0.04, 0.018,
  0x8ba9b5, 0, 1.75, -0.415);

// Side mirrors
for (const side of [-1, 1]) {
  addBox(player, 0.20, 0.12, 0.18,
    0x20262d, side * 1.0, 1.35, -0.58);

  addBox(player, 0.04, 0.04, 0.1,
    0x92b9c9, side * 1.06, 1.37, -0.59);
}

// Exterior camera mode includes the whole car.
// Driver view hides the car body but keeps the cockpit visible.
let interiorView = true;

function setCarVisibility() {
  player.traverse(obj => {
    if (obj === player) return;

    // The cockpit is made from these parts and stays visible.
    // The bonnet, body, wheels and exterior trim hide in driver view.
    const cockpitParts = [
      steeringWheel
    ];

    let cockpit = false;
    for (const group of cockpitParts) {
      if (obj === group || group.getObjectById(obj.id)) {
        cockpit = true;
      }
    }

    if (obj.userData.cockpit) cockpit = true;
    if (obj.userData.exterior) obj.visible = !interiorView;
  });
}

// Mark exterior body parts
player.children.forEach(obj => {
  if (obj !== steeringWheel && obj !== windscreen) {
    obj.userData.exterior = true;
  }
});

// Re-enable interior objects explicitly
function markCockpit(object) {
  object.userData.cockpit = true;
  object.traverse(child => {
    child.userData.cockpit = true;
    child.userData.exterior = false;
  });
}

// The interior components are identifiable by their position above the bonnet.
player.children.forEach(obj => {
  if (obj.position.y >= 0.85 && obj.position.z > -1.0) {
    markCockpit(obj);
  }
});
markCockpit(steeringWheel);

// Traffic
const traffic = [];

function createTrafficCar(color, x, z) {
  const car = new THREE.Group();

  addBox(car, 1.7, 0.55, 3.2, color, 0, 0.58, 0);
  addBox(car, 1.35, 0.55, 1.45, 0x283d4b, 0, 1.04, -0.05);

  for (const side of [-1, 1]) {
    addBox(car, 0.28, 0.12, 0.1,
      0xfff1d1, side * 0.57, 0.62, -1.58);

    addBox(car, 0.28, 0.12, 0.1,
      0xff2727, side * 0.57, 0.62, 1.58);

    createWheel(car, side * 0.9, 0.37, -1.0);
    createWheel(car, side * 0.9, 0.37, 1.0);
  }

  car.position.set(x, 0, z);
  scene.add(car);

  traffic.push({
    mesh: car,
    speed: 0.35 + Math.random() * 0.55,
    passed: false
  });
}

for (let i = 0; i < 9; i++) {
  const lanes = [-5, -2.5, 2.5, 5];
  createTrafficCar(
    [0xd72626, 0xe6e6e6, 0x171b25, 0xe7bb2b, 0x2e9b72][i % 5],
    lanes[Math.floor(Math.random() * lanes.length)],
    -45 - i * 48
  );
}

// GAME STATE
let speed = 0;
let distance = 0;
let playerX = 0;
let steering = 0;
let steeringVelocity = 0;
let heading = 0;
let crashed = false;
let crashFlash = 0;
let shake = 0;
let crashTextTimer = 0;
let gas = false;
let brake = false;
let steerLeft = false;
let steerRight = false;
let lastTime = performance.now();

const speedText = document.getElementById("speed");
const distanceText = document.getElementById("distance");
const crashOverlay = document.getElementById("crashMessage");
const flashElement = document.getElementById("crashFlash");

// Input
window.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") steerLeft = true;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") steerRight = true;
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") gas = true;
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") brake = true;
});

window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") steerLeft = false;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") steerRight = false;
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") gas = false;
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") brake = false;
});

function bindHold(id, setter) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    setter(true);
    button.setPointerCapture(e.pointerId);
  });

  const release = e => {
    e.preventDefault();
    setter(false);
  };

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", () => setter(false));
}

bindHold("leftButton", v => steerLeft = v);
bindHold("rightButton", v => steerRight = v);
bindHold("gasButton", v => gas = v);
bindHold("brakeButton", v => brake = v);

// Crash particles
const particles = [];

function createCrashEffect() {
  for (let i = 0; i < 55; i++) {
    const spark = new THREE.Mesh(
      new THREE.SphereGeometry(0.045 + Math.random() * 0.07, 6, 6),
      new THREE.MeshBasicMaterial({
        color: [0xff5a12, 0xffd447, 0xffffff][i % 3]
      })
    );

    spark.position.set(
      playerX + (Math.random() - 0.5) * 2.2,
      0.8 + Math.random() * 1.4,
      -1 + (Math.random() - 0.5) * 2
    );

    scene.add(spark);

    particles.push({
      mesh: spark,
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 8,
        Math.random() * 7,
        (Math.random() - 0.5) * 8
      ),
      life: 0.5 + Math.random() * 0.8
    });
  }
}

function crash() {
  if (crashed) return;

  crashed = true;
  speed = 0;
  crashFlash = 0.9;
  shake = 0.8;
  crashTextTimer = 1.7;

  createCrashEffect();
  crashOverlay.style.display = "flex";
}

document.getElementById("restartButton").addEventListener("click", () => {
  crashed = false;
  speed = 0;
  playerX = 0;
  steering = 0;
  steeringVelocity = 0;
  heading = 0;
  distance = 0;
  crashFlash = 0;
  shake = 0;

  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);

  traffic.forEach((t, i) => {
    t.mesh.position.x = [-5, -2.5, 2.5, 5][i % 4];
    t.mesh.position.z = -45 - i * 48;
    t.passed = false;
  });

  particles.forEach(p => scene.remove(p.mesh));
  particles.length = 0;

  crashOverlay.style.display = "none";
});

// Camera view toggle
document.getElementById("viewButton").addEventListener("click", () => {
  interiorView = !interiorView;

  document.getElementById("viewButton").textContent =
    interiorView ? "🚘 EXTERIOR VIEW" : "🧑 DRIVER VIEW";
});

// Main game loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (!crashed) {
    // Acceleration and braking
    if (gas) speed += 42 * dt;
    else speed -= 9 * dt;

    if (brake) speed -= 65 * dt;

    speed = THREE.MathUtils.clamp(speed, 0, 220);

    const speedFactor = 0.25 + speed / 130;

    // Smooth steering
    const input = (steerRight ? 1 : 0) - (steerLeft ? 1 : 0);

    steering += (input - steering) *
      (1 - Math.exp(-5.5 * dt));

    steeringVelocity += steering * 5.2 * speedFactor * dt;
    steeringVelocity *= Math.exp(-2.7 * dt);

    playerX += steeringVelocity * dt * Math.max(0.5, speed / 45);

    playerX = THREE.MathUtils.clamp(playerX, -6.3, 6.3);

    const targetHeading = -steering * Math.min(speed / 100, 1) * 0.32;
    heading += (targetHeading - heading) * (1 - Math.exp(-3.8 * dt));

    player.position.x += (playerX - player.position.x) *
      (1 - Math.exp(-7 * dt));

    player.rotation.y = heading;
    steeringWheel.rotation.z = -steering * 0.55;

    distance += speed * dt / 3.6;
    speedText.textContent = Math.round(speed);
    distanceText.textContent = Math.floor(distance);

    // Move traffic towards the player
    for (const t of traffic) {
      t.mesh.position.z += (speed / 3.6 * 1.3 + t.speed * 8) * dt;

      // Collision detection
      const dx = Math.abs(t.mesh.position.x - playerX);
      const dz = Math.abs(t.mesh.position.z);

      if (dx < 1.75 && dz < 2.8 && speed > 8) {
        crash();
        break;
      }

      // Passed cars return in the distance
      if (t.mesh.position.z > 12) {
        t.mesh.position.z = -390 - Math.random() * 100;
        t.mesh.position.x = [-5, -2.5, 2.5, 5][
          Math.floor(Math.random() * 4)
        ];
        t.passed = false;
      }
    }

    // Road markings scroll backwards for a driving effect
    const roadMovement = speed * dt * 0.18;

    for (const dash of laneDashes) {
      dash.position.z += roadMovement;

      if (dash.position.z > 15) dash.position.z -= 620;
    }

  } else {
    speed = 0;
  }

  // Crash particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.life -= dt;
    p.velocity.y -= 10 * dt;
    p.mesh.position.addScaledVector(p.velocity, dt);

    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }

  // Crash flash and camera shake
  crashFlash = Math.max(0, crashFlash - dt * 2.5);
  shake = Math.max(0, shake - dt * 2.8);

  flashElement.style.opacity = crashFlash;

  // HIGHER DRIVER-SEAT CAMERA
  // Change 1.75 to 1.9 or 2.0 for an even higher view.
  const cameraHeight = interiorView ? 1.75 : 3.1;
  const cameraBack = interiorView ? -0.20 : 6.7;
  const cameraSide = interiorView ? -0.42 : 0;

  const cameraOffset = new THREE.Vector3(
    cameraSide,
    cameraHeight,
    cameraBack
  );

  cameraOffset.applyAxisAngle(
    new THREE.Vector3(0, 1, 0),
    heading
  );

  camera.position.set(
    player.position.x + cameraOffset.x +
      (Math.random() - 0.5) * shake,
    cameraOffset.y + (Math.random() - 0.5) * shake,
    camera.position.z
  );

  camera.position.z = player.position.z + cameraOffset.z;

  if (interiorView) {
    camera.rotation.order = "YXZ";
    camera.rotation.y = heading;
    camera.rotation.x = 0;
    camera.rotation.z = 0;
  } else {
    camera.lookAt(player.position.x, 0.9, -12);
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

})();
</script>
</body>
</html>
