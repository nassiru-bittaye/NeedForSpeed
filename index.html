<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedForSpeed 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:white}
canvas{display:block}
button{font-weight:bold;cursor:pointer;touch-action:none;border:0;user-select:none;-webkit-user-select:none}
#hud{position:fixed;top:15px;left:15px;z-index:2;background:#000b;padding:14px;border-radius:12px;line-height:1.7}
#speed{font-size:28px;font-weight:bold;color:#55eaff}
#message{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0009;z-index:5}
.panel{background:#141414ed;padding:28px;border:1px solid #555;border-radius:18px;max-width:90%}
#start{background:#19c8ef;color:#111;padding:14px 22px;border-radius:10px}
#viewToggle{position:fixed;top:15px;right:15px;z-index:4;background:#101d2cee;color:white;border:2px solid #19c8ef;border-radius:12px;padding:12px;font-size:14px}
#help{position:fixed;right:15px;top:68px;background:#000a;padding:9px;border-radius:10px;z-index:2;font-size:12px}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;z-index:3;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
.control{min-width:60px;min-height:55px;font-size:17px;background:#222d;color:white;border:1px solid #aaa;border-radius:12px}
#gas{background:#16874c}
#brake{background:#a72b2b}
@media(max-width:500px){
 #hud{font-size:12px;padding:9px}
 #speed{font-size:21px}
 .control{min-width:48px;min-height:50px;padding:9px}
 #help{top:70px;font-size:10px}
 #viewToggle{font-size:12px;padding:10px}
}
</style>
</head>
<body>

<div id="hud">
  <b>NEED FOR SPEED</b>
  <div id="speed">0 km/h</div>
  <div id="gear">GEAR: N</div>
  <div>SCORE: <span id="score">0</span></div>
</div>

<button id="viewToggle">🚘 INTERIOR VIEW</button>
<div id="help">W / ↑ GAS · S / ↓ BRAKE<br>A / ← LEFT · D / → RIGHT</div>

<div id="message">
  <div class="panel">
    <h1 id="title">🏎️ NEED FOR SPEED</h1>
    <p id="description">Drive fast. Avoid traffic. Beat your score!</p>
    <button id="start">START ENGINE</button>
  </div>
</div>

<div id="controls">
  <div class="group">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <div class="group">
    <button class="control" id="brake">BRAKE</button>
    <button class="control" id="gas">GAS</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  // ---------------- SCENE ----------------

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 55, 240);

  const camera = new THREE.PerspectiveCamera(
    75, innerWidth / innerHeight, 0.1, 400
  );

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x46533e,2));

  const sun=new THREE.DirectionalLight(0xffffff,2);
  sun.position.set(-10,20,15);
  sun.castShadow=true;
  scene.add(sun);

  // ---------------- OBJECTS ----------------

  function makeBox(w,h,d,color,x,y,z,parent=scene){
    const obj=new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      new THREE.MeshStandardMaterial({
        color,
        roughness:0.7
      })
    );
    obj.position.set(x,y,z);
    obj.castShadow=true;
    obj.receiveShadow=true;
    parent.add(obj);
    return obj;
  }

  // Ground and road
  makeBox(300,0.2,400,0x478b3d,0,-0.2,-150);
  makeBox(14,0.15,400,0x303238,0,-0.06,-150);
  makeBox(0.16,0.05,400,0xffffff,-6.6,0.04,-150);
  makeBox(0.16,0.05,400,0xffffff,6.6,0.04,-150);

  const roadLines=[];
  for(let z=-350;z<20;z+=10){
    roadLines.push(
      makeBox(0.16,0.06,4,0xffffff,0,0.04,z)
    );
  }

  // Trees
  const trees=[];

  function makeTree(x,z){
    const group=new THREE.Group();

    const trunk=new THREE.Mesh(
      new THREE.CylinderGeometry(0.15,0.22,1.6,8),
      new THREE.MeshStandardMaterial({color:0x704629})
    );
    trunk.position.y=0.8;
    group.add(trunk);

    const leaves=new THREE.Mesh(
      new THREE.ConeGeometry(1.2,2.8,8),
      new THREE.MeshStandardMaterial({color:0x176b30})
    );
    leaves.position.y=2.5;
    group.add(leaves);

    group.position.set(x,0,z);
    scene.add(group);
    trees.push(group);
  }

  for(let z=-330;z<20;z+=14){
    makeTree(-10,z);
    makeTree(10,z-6);
  }

  // ---------------- CAR MODEL ----------------

  function makeCar(color){
    const car=new THREE.Group();

    makeBox(1.8,0.52,3.5,color,0,0.65,0,car);
    makeBox(1.35,0.68,1.65,0x182634,0,1.16,-0.18,car);

    // Headlights and taillights
    makeBox(0.42,0.12,0.12,0xfff2b0,-0.5,0.73,-1.77,car);
    makeBox(0.42,0.12,0.12,0xfff2b0,0.5,0.73,-1.77,car);
    makeBox(0.4,0.13,0.12,0xff2222,-0.48,0.75,1.77,car);
    makeBox(0.4,0.13,0.12,0xff2222,0.48,0.75,1.77,car);

    // Interior
    makeBox(1.15,0.15,0.4,0x111820,0,1.0,-0.72,car);
    makeBox(0.45,0.7,0.2,0x101318,-0.48,0.95,0.3,car);
    makeBox(0.45,0.7,0.2,0x101318,0.48,0.95,0.3,car);

    // Steering wheel
    const steeringWheel=new THREE.Mesh(
      new THREE.TorusGeometry(0.24,0.035,8,24),
      new THREE.MeshStandardMaterial({color:0x171717})
    );
    steeringWheel.position.set(0,1.15,-0.6);
    car.add(steeringWheel);
    car.userData.steeringWheel=steeringWheel;

    // Wheels
    const wheels=[];
    for(const x of [-0.94,0.94]){
      for(const z of [-1.12,1.12]){
        const tire=new THREE.Mesh(
          new THREE.CylinderGeometry(0.37,0.37,0.22,16),
          new THREE.MeshStandardMaterial({color:0x111111})
        );
        tire.rotation.z=Math.PI/2;
        tire.position.set(x,0.37,z);
        car.add(tire);
        wheels.push(tire);
      }
    }

    car.userData.wheels=wheels;
    scene.add(car);
    return car;
  }

  const player=makeCar(0x087cff);
  player.position.set(0,0,3);

  // Traffic
  const traffic=[];
  const colors=[
    0xff3333,0xffcc22,0xeeeeee,0x9944ee,0x22cc77
  ];

  for(let i=0;i<5;i++){
    const car=makeCar(colors[i]);
    car.position.set(
      [-4,0,4][Math.floor(Math.random()*3)],
      0,
      -35-i*42
    );
    traffic.push(car);
  }

  // ---------------- INPUT ----------------

  const keys={
    left:false,
    right:false,
    gas:false,
    brake:false
  };

  let running=false;
  let speed=0;
  let score=0;
  let playerX=0;

  // New handling state
  let steering=0;
  let lateralVelocity=0;
  let interiorView=false;
  let previous=performance.now();

  function clearKeys(){
    Object.keys(keys).forEach(k=>keys[k]=false);
  }

  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();

    if([
      'arrowup','arrowdown','arrowleft','arrowright',' '
    ].includes(k)){
      e.preventDefault();
    }

    if(k==='arrowleft'||k==='a')keys.left=true;
    if(k==='arrowright'||k==='d')keys.right=true;
    if(k==='arrowup'||k==='w')keys.gas=true;
    if(k==='arrowdown'||k==='s'||k===' ')keys.brake=true;
  });

  addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();

    if(k==='arrowleft'||k==='a')keys.left=false;
    if(k==='arrowright'||k==='d')keys.right=false;
    if(k==='arrowup'||k==='w')keys.gas=false;
    if(k==='arrowdown'||k==='s'||k===' ')keys.brake=false;
  });

  addEventListener('blur',clearKeys);

  function bindButton(id,key){
    const el=document.getElementById(id);

    el.addEventListener('pointerdown',e=>{
      e.preventDefault();
      keys[key]=true;
      el.setPointerCapture(e.pointerId);
    });

    ['pointerup','pointercancel','lostpointercapture'].forEach(evt=>{
      el.addEventListener(evt,()=>{
        keys[key]=false;
      });
    });
  }

  bindButton('left','left');
  bindButton('right','right');
  bindButton('gas','gas');
  bindButton('brake','brake');

  // Interior/exterior view toggle
  document.getElementById('viewToggle').addEventListener('click',()=>{
    interiorView=!interiorView;

    document.getElementById('viewToggle').textContent=
      interiorView?'🌆 EXTERIOR VIEW':'🚘 INTERIOR VIEW';
  });

  // ---------------- GAME STATE ----------------

  function gameOver(){
    if(!running)return;

    running=false;
    clearKeys();

    document.getElementById('title').textContent='💥 CRASH!';
    document.getElementById('description').textContent=
      'Score: '+Math.floor(score)+' — Try again!';
    document.getElementById('start').textContent='DRIVE AGAIN';
    document.getElementById('message').style.display='flex';
  }

  function startGame(){
    speed=0;
    score=0;
    playerX=0;
    steering=0;
    lateralVelocity=0;
    player.position.set(0,0,3);
    player.rotation.set(0,0,0);

    traffic.forEach((car,i)=>{
      car.position.x=[-4,0,4][Math.floor(Math.random()*3)];
      car.position.z=-35-i*42;
    });

    clearKeys();

    document.getElementById('speed').textContent='0 km/h';
    document.getElementById('score').textContent='0';
    document.getElementById('title').textContent='🏎️ NEED FOR SPEED';
    document.getElementById('description').textContent=
      'Drive fast. Avoid traffic!';
    document.getElementById('start').textContent='START ENGINE';
    document.getElementById('message').style.display='none';

    running=true;
    previous=performance.now();
  }

  document.getElementById('start').addEventListener('click',startGame);

  // ---------------- MAIN GAME LOOP ----------------

  function animate(now){
    requestAnimationFrame(animate);

    const dt=Math.min((now-previous)/1000,0.04);
    previous=now;

    if(running){

      // 1. ACCELERATION AND BRAKING
      if(keys.gas){
        speed+=48*dt;
      }else{
        speed-=4*dt;
      }

      if(keys.brake){
        speed-=100*dt;
      }

      speed=THREE.MathUtils.clamp(speed,0,190);

      // 2. IMPROVED HANDLING
      // Positive steering means RIGHT.
      // Negative steering means LEFT.
      const input=
        (keys.right?1:0)-(keys.left?1:0);

      const speedFactor=speed/190;

      // Steering responds smoothly to button presses
      const steeringResponse=1-Math.exp(-8*dt);

      steering=THREE.MathUtils.lerp(
        steering,
        input,
        steeringResponse
      );

      // Steering sensitivity decreases at high speed
      const steeringStrength=THREE.MathUtils.lerp(
        2.5,
        1.2,
        speedFactor
      );

      // Steering gradually builds lateral velocity
      const turnForce=
        steering*steeringStrength*(speed/45);

      lateralVelocity+=turnForce*dt;

      // Tyre grip reduces sideways sliding
      const grip=input===0?5.5:3.5;
      lateralVelocity*=Math.exp(-grip*dt);

      // Limit sideways movement for better control
      lateralVelocity=THREE.MathUtils.clamp(
        lateralVelocity,-4.5,4.5
      );

      // Move the car
      playerX+=lateralVelocity*dt;

      // Keep the car inside the road
      if(playerX < -5.15){
        playerX=-5.15;
        lateralVelocity=Math.max(0,lateralVelocity);
      }

      if(playerX > 5.15){
        playerX=5.15;
        lateralVelocity=Math.min(0,lateralVelocity);
      }

      player.position.x=playerX;

      // 3. NATURAL BODY TURNING
      // Right input turns the nose toward the right.
      const targetYaw=-steering*0.3;

      player.rotation.y=THREE.MathUtils.lerp(
        player.rotation.y,
        targetYaw,
        1-Math.exp(-5*dt)
      );

      // Small body roll while cornering
      const targetRoll=-steering*0.06;

      player.rotation.z=THREE.MathUtils.lerp(
        player.rotation.z,
        targetRoll,
        1-Math.exp(-4*dt)
      );

      // Steering wheel movement
      player.userData.steeringWheel.rotation.z=
        -steering*0.55;

      // Wheel rotation
      player.userData.wheels.forEach(wheel=>{
        wheel.rotation.x+=speed*dt*0.035;
      });

      // 4. ROAD MOVEMENT
      const move=speed*dt*0.22;

      roadLines.forEach(line=>{
        line.position.z+=move*3;

        if(line.position.z>12){
          line.position.z-=380;
        }
      });

      trees.forEach(tree=>{
        tree.position.z+=move*3;

        if(tree.position.z>15){
          tree.position.z-=350;
        }
      });

      // 5. TRAFFIC AND COLLISIONS
      for(const car of traffic){
        car.position.z+=move*2.2;

        const hitLength=
          Math.abs(car.position.z-player.position.z)<2.6;

        const hitWidth=
          Math.abs(car.position.x-playerX)<1.65;

        if(hitLength&&hitWidth){
          gameOver();
          break;
        }

        if(car.position.z>12){
          car.position.z=-190-Math.random()*80;
          car.position.x=
            [-4,0,4][Math.floor(Math.random()*3)];

          score+=100;
        }
      }

      // Score and dashboard
      score+=dt*speed*0.25;

      document.getElementById('speed').textContent=
        Math.round(speed)+' km/h';

      document.getElementById('gear').textContent=
        'GEAR: '+(
          speed<1?'N':
          speed<45?'1':
          speed<90?'2':
          speed<140?'3':'4'
        );

      document.getElementById('score').textContent=
        Math.floor(score);
    }

    // ---------------- CAMERA MODES ----------------

    if(interiorView){

      // Cockpit camera looking through the windshield
      const cockpit=player.localToWorld(
        new THREE.Vector3(0,1.35,-0.35)
      );

      const forward=player.localToWorld(
        new THREE.Vector3(steering*1.2,1.3,-25)
      );

      camera.position.copy(cockpit);
      camera.lookAt(forward);

    }else{

      // Smooth chase camera behind the car
      const chase=player.localToWorld(
        new THREE.Vector3(0,4.8,9)
      );

      camera.position.lerp(
        chase,
        1-Math.exp(-4*dt)
      );

      const target=player.localToWorld(
        new THREE.Vector3(0,1,-8)
      );

      camera.lookAt(target);
    }

    renderer.render(scene,camera);
  }

  // ---------------- RESIZE ----------------

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
